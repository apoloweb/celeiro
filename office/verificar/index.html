<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Verificação de contato · Celeiro Administradora</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#0F3D2E;--ambar:#E3A72F;--nevoa:#F4F6F3;--linha:#D5DED9;--borda:#9FB0A8;--texto2:#44564E;--branco:#FFFFFF;--erro:#B3261E}
*{box-sizing:border-box}
body{margin:0;font-family:Sora,system-ui,Arial,sans-serif;background:var(--verde);color:var(--verde);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px;gap:24px}
header img{height:56px;width:auto;display:block}
main{background:var(--branco);border-radius:16px;padding:28px;width:min(480px,100%);display:flex;flex-direction:column;gap:18px}
h1{font-size:24px;line-height:1.25;margin:0}
p{margin:0;line-height:1.6}
.apoio{color:var(--texto2);font-size:15px}
form{display:flex;flex-direction:column;gap:16px}
label{font-size:14px;font-weight:500}
.campo{display:flex;flex-direction:column;gap:8px}
input{font:inherit;color:inherit;border:1px solid var(--borda);border-radius:8px;padding:12px 14px;min-height:56px;width:100%;font-size:28px;font-weight:600;letter-spacing:10px;text-align:center}
input:focus,button:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
button{font:inherit;font-weight:600;min-height:52px;border:0;border-radius:10px;background:var(--verde);color:var(--nevoa);cursor:pointer;padding:0 20px}
button:disabled{opacity:.6;cursor:default}
.erro{background:#FBE9E7;color:var(--erro);border:1px solid #F0B4B4;border-radius:8px;padding:12px 14px;font-size:14px}
.sucesso{background:#E4F1EA;border:1px solid #B5D3C4;border-radius:8px;padding:16px;font-size:15px}
.oculto{display:none!important}
</style>
</head>
<body>
<header><img src="../assets/logo-negativa.png" alt="Celeiro Administradora"></header>
<main id="caixa" aria-live="polite"><p class="apoio">Carregando…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.1"></script>
<script src="../config.js"></script>
<script>
(function(){
'use strict';
var caixa=document.getElementById('caixa');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fim(titulo,msg,bom){caixa.innerHTML='<h1>'+esc(titulo)+'</h1><p class="'+(bom?'sucesso':'apoio')+'">'+esc(msg)+'</p>';}
var cfg=window.CELEIRO_OFFICE_CONFIG||{};
var token=(new URLSearchParams(location.search).get('t')||'').trim().toLowerCase();
if(!cfg.url||!cfg.anonKey||!window.supabase){fim('Página indisponível','Não foi possível carregar a página. Tente de novo em instantes.');return;}
if(!/^[a-f0-9]{32}$/.test(token)){fim('Link inválido','Este link de verificação não é válido. Peça um novo envio a quem fez o seu cadastro.');return;}
var sb=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
function expirado(){fim('Código expirado','Este código não vale mais. Peça um novo envio a quem fez o seu cadastro.');}
sb.rpc('verificacao_publica',{p_token:token}).then(function(r){
  if(r.error){fim('Página indisponível','Não foi possível carregar a página. Tente de novo em instantes.');return;}
  var d=r.data||{};
  if(!d.ok){fim('Link inválido','Este link de verificação não é válido. Peça um novo envio a quem fez o seu cadastro.');return;}
  var oque=d.canal==='email'?'e-mail':'número de WhatsApp';
  function pronto(){fim('Contato confirmado','Seu '+oque+' '+d.destino+' foi verificado. Você já pode fechar esta página.',true);}
  if(d.situacao==='confirmado'){pronto();return;}
  if(d.situacao==='expirado'){expirado();return;}
  caixa.innerHTML='<h1>Confirme seu '+esc(oque)+'</h1>'+
    '<p class="apoio">Digite o código de 6 números que a '+esc(d.empresa)+' enviou para <strong>'+esc(d.destino)+'</strong>.</p>'+
    '<form id="f" novalidate><div class="campo"><label for="cod">Código de verificação</label><input id="cod" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></div>'+
    '<p class="erro oculto" id="erro" role="alert"></p><button type="submit">Confirmar</button></form>';
  var f=document.getElementById('f'),erro=document.getElementById('erro'),cod=document.getElementById('cod');
  cod.focus();
  cod.oninput=function(){cod.value=cod.value.replace(/\D/g,'').slice(0,6);};
  f.onsubmit=function(ev){
    ev.preventDefault();
    erro.classList.add('oculto');
    if(cod.value.length!==6){erro.textContent='Digite os 6 números do código.';erro.classList.remove('oculto');return;}
    var b=f.querySelector('button');b.disabled=true;
    sb.rpc('verificacao_confirmar',{p_token:token,p_codigo:cod.value}).then(function(x){
      var v=x.data||{};
      if(x.error){b.disabled=false;erro.textContent='Não foi possível confirmar agora. Tente de novo.';erro.classList.remove('oculto');return;}
      if(v.ok){pronto();return;}
      if(v.situacao==='expirado'){fim('Código expirado',v.erro||'Este código não vale mais. Peça um novo envio.');return;}
      b.disabled=false;cod.value='';cod.focus();erro.textContent=v.erro||'Código incorreto.';erro.classList.remove('oculto');
    });
  };
});
})();
</script>
</body>
</html>
