<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Celeiro Office</title>
<script>
/* Raiz do sistema: funciona em /office, /office/ e na raiz do subdomínio */
(function(){var p=location.pathname.replace(/[^\/]*\.html$/,'');if(p.charAt(p.length-1)!=='/')p+='/';window.CELEIRO_OFFICE_RAIZ=p;
document.write('<link rel="icon" href="'+p+'assets/favicon.png">');})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#0F3D2E;--verde2:#1B5A45;--ambar:#E3A72F;--nevoa:#F4F6F3;--linha:#D5DED9;--borda:#9FB0A8;--texto2:#44564E;--branco:#FFFFFF;--erro:#9B1C1C;--erro-fundo:#FDECEC;--alerta-fundo:#FBF1DC}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Sora',system-ui,sans-serif;color:var(--verde);background:var(--nevoa);font-size:15px;line-height:1.5}
h1,h2,h3,p{margin:0}
a{color:var(--verde)}
button,input,select{font-family:inherit;font-size:15px;color:var(--verde)}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
.oculto{display:none!important}

/* telas públicas */
.publico{min-height:100vh;display:flex;flex-wrap:wrap}
.publico .marca{flex:1 1 440px;background:var(--verde);color:var(--nevoa);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.publico .marca img{width:240px;height:auto}
.publico .marca .olho{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--ambar);font-weight:600}
.publico .marca h1{font-size:36px;line-height:1.15;font-weight:600;max-width:460px;margin-top:16px}
.publico .marca ul{margin:20px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;color:#D5DED9}
.publico .marca li{display:flex;gap:12px;align-items:flex-start}
.publico .marca li::before{content:"";flex:none;width:14px;height:8px;margin-top:8px;background:var(--ambar);transform:skewX(-30deg)}
.publico .marca .rodape{font-size:13px;color:#B9C7C0}
.publico .lado{flex:1 1 420px;padding:48px 24px;display:flex;align-items:center;justify-content:center}
.caixa{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px}
.caixa.larga{max-width:560px}
.caixa h2{font-size:26px;font-weight:600;line-height:1.25}
.caixa .apoio,.apoio{color:var(--texto2)}
.nota{font-size:13px;line-height:1.6;color:var(--texto2);padding-top:18px;border-top:1px solid var(--linha)}

/* formulários */
.campo{display:flex;flex-direction:column;gap:8px}
.campo label,.campo .rotulo{font-size:14px;font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=date],select{height:48px;padding:0 14px;border:1px solid var(--borda);border-radius:8px;background:var(--branco);width:100%}
input.codigo{font-size:24px;font-weight:600;letter-spacing:.35em;text-align:center;height:60px}
.botao{height:48px;padding:0 22px;border:0;border-radius:8px;background:var(--verde);color:var(--nevoa);font-weight:600;cursor:pointer}
.botao:hover{background:var(--verde2)}
.botao[disabled]{opacity:.6;cursor:wait}
.botao.ambar{background:var(--ambar);color:var(--verde)}
.botao.claro{background:var(--branco);color:var(--verde);border:1px solid var(--verde)}
.botao.pequeno{height:44px;padding:0 14px;font-size:14px}
.link-botao{display:inline-flex;align-items:center;text-decoration:none}
.link{background:none;border:0;padding:0;color:var(--verde);text-decoration:underline;cursor:pointer;font-size:14px;min-height:44px;text-align:left}
.erro{background:var(--erro-fundo);color:var(--erro);border:1px solid #F0B4B4;border-radius:8px;padding:12px 14px;font-size:14px}
.sucesso{background:#E4F1EA;color:var(--verde);border:1px solid #B5D3C4;border-radius:8px;padding:12px 14px;font-size:14px}
.qr{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.qr img{width:200px;height:200px;border:1px solid var(--linha);border-radius:12px;background:var(--branco);padding:8px}
.qr .chave{font-size:14px;letter-spacing:.06em;word-break:break-all;padding:10px 12px;border:1px solid var(--linha);border-radius:8px;background:var(--branco)}

/* sistema */
.casca{min-height:100vh;display:flex;flex-wrap:wrap}
.lateral{flex:1 0 230px;max-width:100%;background:var(--verde);color:var(--nevoa);padding:24px 16px;display:flex;flex-direction:column;gap:20px}
.lateral img{width:180px;height:auto}
.lateral .itens{display:flex;flex-direction:column;gap:2px}
.lateral a{display:block;padding:12px;border-radius:8px;color:var(--nevoa);text-decoration:none;font-size:14px}
.lateral a:hover{background:rgba(255,255,255,.08)}
.lateral a[aria-current=page]{background:var(--verde2);font-weight:600}
.lateral .grupo{margin:16px 12px 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ambar);font-weight:600}
.lateral .fase{font-size:11px;color:#B9C7C0;margin-left:6px}
.conteudo{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.topo{padding:14px 28px;background:var(--branco);border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topo .trilha{font-size:14px;color:var(--texto2)}
.topo .quem{display:flex;align-items:center;gap:12px;font-size:14px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:6px;background:var(--verde);color:var(--ambar);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
main.tela{padding:28px;display:flex;flex-direction:column;gap:22px;width:100%}
main.tela h1{font-size:26px;font-weight:600}
.cabeca{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.cabeca > div{display:flex;flex-direction:column;gap:6px;max-width:680px}
.painel{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.painel h2{font-size:17px;font-weight:600}
.grade{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.grade .campo{flex:1 1 180px}
.cartoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;text-decoration:none}

.cartao span{font-size:13px;color:var(--texto2)}
.rolagem{overflow-x:auto;background:var(--branco);border:1px solid var(--linha);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 14px;text-align:left;vertical-align:top}
thead th{background:var(--nevoa);font-weight:600;white-space:nowrap}
tbody tr{border-top:1px solid var(--linha)}
tr.alerta{background:var(--alerta-fundo)}
td .sub{display:block;font-size:12px;color:var(--texto2)}
.vazio{padding:28px;text-align:center;color:var(--texto2)}
.chave-sw{width:52px;height:44px;padding:8px 0;border:0;background:none;cursor:pointer}
.chave-sw span{display:flex;width:48px;height:28px;padding:3px;border-radius:14px;background:#B9C7C0;justify-content:flex-start}
.chave-sw span i{width:22px;height:22px;border-radius:11px;background:var(--branco)}
.chave-sw[aria-checked=true] span{background:var(--verde);justify-content:flex-end}
.chave-sw[aria-checked=true] span i{background:var(--ambar)}
.chave-sw[disabled]{opacity:.5;cursor:not-allowed}
.situacao{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;background:#E4F1EA;color:var(--verde)}
.situacao.off{background:#E8E8E8;color:#4A4A4A}
.chips{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle}
.chipm{padding:3px 9px;border-radius:6px;background:#E4F1EA;color:var(--verde);font-size:12px;font-weight:500;white-space:nowrap}
.chipm.bloq{background:var(--alerta-fundo);color:#7A5400}
.previa{padding:12px 14px;border-radius:8px;background:var(--nevoa);font-size:14px;line-height:1.9}
.previa .sub{display:block;font-size:12px;color:var(--texto2);line-height:1.5}
.caixas{display:flex;flex-wrap:wrap;gap:8px 18px}
.caixa-mod{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;cursor:pointer}
.caixa-mod input{width:20px;height:20px;accent-color:var(--verde)}
.junto{display:flex;gap:8px}
.junto input{flex:1;min-width:0}
.senha-inicial{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;font-weight:600;letter-spacing:.04em;user-select:all}
.oculto-visual{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
textarea{font-family:inherit;font-size:15px;color:var(--verde);padding:12px 14px;border:1px solid var(--borda);border-radius:8px;background:var(--branco);width:100%;resize:vertical}
.segmento{display:inline-flex;flex-wrap:wrap;border:1px solid var(--borda);border-radius:8px;background:var(--branco);overflow:hidden;max-width:100%}
.segmento.rolavel{display:flex}
.campo>.segmento{align-self:flex-start}
.aba{min-height:44px;padding:0 14px;border:0;border-right:1px solid var(--linha);background:none;font-size:14px;cursor:pointer;white-space:nowrap}
.aba:last-child{border-right:0}
.aba[aria-pressed=true]{background:var(--verde);color:var(--nevoa);font-weight:600}
.conta{font-size:12px;opacity:.8;margin-left:2px}
.selo{padding:2px 8px;border-radius:6px;background:#E4F1EA;color:var(--verde);font-size:12px;font-weight:500;white-space:nowrap}
.selo.claro{background:var(--nevoa);border:1px solid var(--linha)}
.selo.urgente{background:var(--erro-fundo);color:var(--erro)}
.selo.novo{background:var(--ambar);color:var(--verde);font-weight:600}
.vencida{color:var(--erro);font-weight:600}
.titulo-t{background:none;border:0;padding:0;text-align:left;font-size:14px;font-weight:500;color:var(--verde);cursor:pointer;min-height:28px;line-height:1.4}
.titulo-t:hover{text-decoration:underline}
.codigo{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--texto2);margin-right:4px}
tr.grupo-l th{background:var(--nevoa);font-size:13px;font-weight:600;padding:8px 14px}
.quadro{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start}
.coluna{background:#E9EEEA;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.coluna.alvo{outline:2px dashed var(--verde)}
.coluna h2{font-size:14px;font-weight:600}
.cartao-t{background:var(--branco);border:1px solid var(--linha);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:grab}
.cartao-t .meta,.meta{font-size:12px;color:var(--texto2);margin:0}
.mover{display:flex;flex-wrap:wrap;gap:6px}
.mover .botao{height:36px;padding:0 10px;font-size:12px}
.dlg{width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px);padding:0;border:0;border-radius:14px;color:var(--verde);box-shadow:0 20px 60px rgba(15,61,46,.35)}
.dlg::backdrop{background:rgba(15,61,46,.45)}
.dlg form{display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.dlg-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--linha)}
.dlg-topo h2{font-size:20px;font-weight:600}
.dlg-corpo{padding:18px 22px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.dlg-rodape{display:flex;flex-wrap:wrap;gap:10px;padding:16px 22px;border-top:1px solid var(--linha)}
.linha-conf{display:flex;justify-content:space-between;align-items:center;gap:12px}
.coment{padding:10px 12px;border-radius:8px;background:var(--nevoa);font-size:14px;margin-bottom:8px}
.coment p{margin-top:4px;white-space:pre-wrap;word-break:break-word}
.grade-d{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.cartao-d{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.cartao-d.baixo{min-height:110px}
.cartao-d.apagado{background:transparent;border-style:dashed}
.cartao-d-topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.cartao-d-topo a{font-size:13px;white-space:nowrap}
.cartao-d .numero{font-size:24px;font-weight:600;line-height:1.2;margin-top:6px}
.cartao-d .apoio{font-size:13px}
.titulo-s{font-size:16px;font-weight:600;margin-top:4px}
.dupla-d{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
.legenda{display:flex;gap:16px;font-size:12px;color:var(--texto2)}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.lista-p{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lista-p li{padding:10px 0;border-top:1px solid var(--linha);display:flex;flex-direction:column;gap:2px}
.lista-p li:first-child{border-top:0}
.dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 24px}
.dado{display:flex;flex-direction:column;gap:2px;min-width:0}
.dado .rot{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto2)}
.dado .val{font-size:15px;word-break:break-word}
.copiar{background:none;border:0;padding:0 4px;font-size:12px;color:var(--texto2);text-decoration:underline;cursor:pointer;min-height:24px}
.contatos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.contato{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--linha);border-radius:10px;background:var(--nevoa)}
.grade3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:start}
.acoes{display:flex;flex-wrap:wrap;gap:10px;flex:1 1 100%}
.linha-socio{flex-direction:row!important;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px!important}
.linha-socio>div:first-child{display:flex;flex-direction:column;gap:2px}
#aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 18px;border-radius:8px;background:var(--verde);color:var(--nevoa);font-size:14px;box-shadow:0 6px 24px rgba(15,61,46,.25);z-index:2147483647}
#aviso.ruim{background:var(--erro)}
#aviso:empty{display:none}
@media (max-width:720px){.publico .marca{padding:32px 24px}.publico .marca h1{font-size:28px}.lateral .itens{flex-direction:row;flex-wrap:wrap}.lateral .grupo{width:100%;margin:8px 12px 2px}main.tela{padding:20px 16px}.topo{padding:12px 16px}}
</style>

<body>
<div id="app"><p class="vazio">Carregando…</p></div>
<div id="aviso" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.1"></script>
<script>document.write('<script src="'+window.CELEIRO_OFFICE_RAIZ+'config.js"><\/script>');</script>
<script>
(function(){
'use strict';

var cfg=window.CELEIRO_OFFICE_CONFIG||{};
var RAIZ=window.CELEIRO_OFFICE_RAIZ||'';
var configurado=!!(cfg.url&&cfg.anonKey&&!/COLE_AQUI/.test(String(cfg.url)+String(cfg.anonKey))&&window.supabase&&window.supabase.createClient);
var hashInicial=location.hash||'';
var sb=configurado?window.supabase.createClient(cfg.url,cfg.anonKey):null;
var app=document.getElementById('app');
var elAviso=document.getElementById('aviso');

var PERFIS={master:'Master',gerencial:'Gerencial',corp_master:'Corporativo master',corp_operador:'Corporativo operador'};
var PRONTOS={auditoria:true,workflow:true,dashboard:true,app:true,cadastro:true};
var INATIVIDADE_MS=15*60*1000;
var MAX_TENTATIVAS=5;
var E={acesso:null,modulos:[],recuperando:/type=recovery/.test(hashInicial),novoLogin:false,tentativas:0,relogio:null,avisoRelogio:null};

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(sel,raiz){return (raiz||document).querySelector(sel);}
function $$(sel,raiz){return Array.prototype.slice.call((raiz||document).querySelectorAll(sel));}
function aviso(msg,ruim){
  var aberto=document.querySelector('dialog[open]');
  (aberto||document.body).appendChild(elAviso);
  elAviso.textContent=msg||'';
  elAviso.className=ruim?'ruim':'';
  clearTimeout(E.avisoRelogio);
  if(msg){E.avisoRelogio=setTimeout(function(){elAviso.textContent='';},5000);}
}
function msgErro(e){
  var m=(e&&e.message)||String(e||'');
  if(/Invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Invalid TOTP code|invalid.*code/i.test(m))return 'Código incorreto. Confira o aplicativo e tente de novo.';
  if(/rate limit|too many/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/Failed to fetch|NetworkError/i.test(m))return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
  if(/Email not confirmed/i.test(m))return 'Este e-mail ainda não foi confirmado.';
  if(/should be different/i.test(m))return 'A nova senha precisa ser diferente da atual.';
  return m||'Não foi possível concluir. Tente de novo.';
}
function evento(acao,modulo,detalhes){
  if(!sb)return;
  try{
    sb.rpc('registrar_evento',{p_acao:acao,p_modulo:modulo||'',p_detalhes:detalhes||null}).then(function(r){
      if(r&&r.error&&window.console)console.warn('Auditoria:',r.error.message);
    });
  }catch(err){}
}
function dataHora(iso){
  var d=new Date(iso);
  return {data:d.toLocaleDateString('pt-BR'),hora:d.toLocaleTimeString('pt-BR')};
}
function cnpjValido(v){
  var n=String(v||'').replace(/\D/g,'');
  if(n.length!==14||/^(\d)\1+$/.test(n))return false;
  function dv(base){var p=base.length-7,s=0;for(var i=0;i<base.length;i++){s+=Number(base[i])*p;p=p===2?9:p-1;}var r=s%11;return r<2?0:11-r;}
  return dv(n.slice(0,12))===Number(n[12])&&dv(n.slice(0,13))===Number(n[13]);
}
function formataCnpj(v){
  var n=String(v||'').replace(/\D/g,'');
  return n.length===14?n.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):String(v||'');
}
function ocupar(botao,sim){if(botao){botao.disabled=!!sim;}}

/* ---------- telas públicas ---------- */
function publico(html){
  app.innerHTML=
  '<div class="publico">'+
    '<section class="marca">'+
      '<img src="'+RAIZ+'assets/logo-negativa.png" alt="Celeiro Administradora">'+
      '<div><p class="olho">Celeiro Office</p>'+
      '<h1>Sistema de gestão da Celeiro Administradora</h1>'+
      '<ul><li>Acesso restrito a usuários convidados</li><li>Autenticação em dois fatores obrigatória</li><li>Todas as ações registradas em auditoria</li></ul></div>'+
      '<p class="rodape">'+esc(location.host||'office.celeiroadministradora.com.br')+'</p>'+
    '</section>'+
    '<main class="lado">'+html+'</main>'+
  '</div>';
}

function telaConfig(){
  publico('<div class="caixa"><h2>Falta ligar ao Supabase</h2>'+
    '<p class="apoio">Preencha o arquivo <strong>config.js</strong> com o endereço e a chave pública do projeto Supabase do backoffice. O passo a passo está no arquivo LEIA-ME.md.</p></div>');
}

function telaLogin(msg,bom){
  pararInatividade();
  E.acesso=null;E.tentativas=0;
  publico('<form class="caixa" id="f-login" novalidate>'+
    '<div><h2>Entrar</h2><p class="apoio">Use o e-mail e a senha do seu acesso. Em seguida pediremos o código do autenticador.</p></div>'+
    (msg?'<p class="'+(bom?'sucesso':'erro')+'" role="alert">'+esc(msg)+'</p>':'')+
    '<div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>'+
    '<div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>'+

async function aposSenha(){
  var n=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(n.error){telaLogin(msgErro(n.error));return;}
  if(n.data&&n.data.currentLevel==='aal2'){await entrar();return;}
  var f=await sb.auth.mfa.listFactors();
  if(f.error){telaLogin(msgErro(f.error));return;}
  var verificados=(f.data&&f.data.totp)||[];
  if(verificados.length){telaCodigo(verificados[0].id);}
  else{await telaCadastro(((f.data&&f.data.all)||[]).filter(function(x){return x.status!=='verified';}));}
}

function telaCodigo(factorId){
  publico('<form class="caixa" id="f-codigo" novalidate>'+
    '<div><h2>Código do Google Authenticator</h2><p class="apoio">Abra o aplicativo no seu celular e informe o código de 6 dígitos da conta Celeiro Office.</p></div>'+
    '<p class="erro oculto" role="alert"></p>'+
    '<div class="campo"><label for="codigo">Código de 6 dígitos</label><input id="codigo" class="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>'+
    '<button class="botao" type="submit">Verificar e entrar</button>'+
    '<button class="link" type="button" id="b-sair">Voltar para o login</button>'+
    '<p class="nota">Perdeu o celular ou o autenticador? A redefinição é feita por um usuário Master, e fica registrada.</p>'+
  '</form>');
  var f=$('#f-codigo');
  $('#codigo').focus();
  $('#b-sair').onclick=function(){sair(true);};
  f.onsubmit=async function(ev){
    ev.preventDefault();
    var c=$('#codigo').value.replace(/\D/g,''),b=$('button[type=submit]',f),p=$('.erro',f);
    if(c.length!==6){p.textContent='Digite os 6 dígitos.';p.classList.remove('oculto');return;}
    ocupar(b,true);
    var r=await sb.auth.mfa.challengeAndVerify({factorId:factorId,code:c});
    if(r.error){
      E.tentativas++;
      evento('Código do autenticador recusado','Acesso',{tentativa:E.tentativas});
      if(E.tentativas>=MAX_TENTATIVAS){
        await sb.auth.signOut();
        telaLogin('Acesso encerrado após '+MAX_TENTATIVAS+' códigos incorretos. Entre de novo.');
        return;
      }
      ocupar(b,false);$('#codigo').value='';$('#codigo').focus();
      p.textContent=msgErro(r.error);p.classList.remove('oculto');
      return;
    }
    E.tentativas=0;
    await entrar();
  };
}

/* ---------- entrada no sistema ---------- */
async function entrar(){
  if(E.recuperando){telaNovaSenha();return;}
  var r=await sb.rpc('meu_acesso');
  if(r.error){telaBloqueio('Não foi possível carregar seu acesso',msgErro(r.error));return;}
  var a=r.data||{};
  if(a.situacao==='sem_2fa'){
    var n=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(n.data&&n.data.currentLevel==='aal2'){telaBloqueio('Sessão não reconhecida','Saia e entre de novo.');return;}
    await aposSenha();return;
  }
  if(a.situacao==='sem_cadastro'){
    evento('Entrou sem perfil vinculado','Acesso');
    telaBloqueio('Acesso ainda não liberado','Seu e-mail e o autenticador estão corretos, mas o acesso ainda não foi vinculado a um perfil. Peça a um usuário Master ou ao responsável da sua organização.');
    return;
  }
  if(a.situacao!=='ok'){
    evento('Tentou entrar com acesso inativo','Acesso');
    telaBloqueio('Acesso inativo','Este acesso está desativado. Fale com um usuário Master ou com o responsável da sua organização.');
    return;
  }
  E.acesso=a;
  evento(E.novoLogin?'Entrou no sistema com segundo fator':'Retomou a sessão','Acesso');
  E.novoLogin=false;
  var m=await sb.from('modulos').select('*').order('ordem');
  E.modulos=m.error?[]:(m.data||[]);
  montarCasca();
  iniciarInatividade();
  rota();
}

async function sair(silencioso){
  pararInatividade();
  if(E.acesso){
    try{await sb.rpc('registrar_evento',{p_acao:'Saiu do sistema',p_modulo:'Acesso',p_detalhes:null});}catch(err){}
  }
  E.acesso=null;
  await sb.auth.signOut();
  if(location.hash){history.replaceState(null,'',location.pathname+location.search);}
  telaLogin(silencioso?'':'Você saiu do sistema.',true);
}

function pararInatividade(){clearTimeout(E.relogio);E.relogio=null;}
function iniciarInatividade(){
  pararInatividade();
  E.relogio=setTimeout(async function(){
    if(!E.acesso)return;
    try{await sb.rpc('registrar_evento',{p_acao:'Sessão encerrada por inatividade',p_modulo:'Acesso',p_detalhes:null});}catch(err){}
    E.acesso=null;
    await sb.auth.signOut();
    telaLogin('Sessão encerrada por inatividade. Entre de novo.');
  },INATIVIDADE_MS);
}
['click','keydown','touchstart','scroll'].forEach(function(t){
  window.addEventListener(t,function(){if(E.acesso)iniciarInatividade();},{passive:true,capture:true});
});

function ehCorpMaster(){return !!E.acesso&&E.acesso.perfil==='corp_master';}

  var a=E.acesso,itens='<a href="#inicio" data-rota="inicio">Início</a>';

    '<nav class="lateral" aria-label="Menu do sistema"><img src="'+RAIZ+'assets/logo-negativa.png" alt="Celeiro Administradora">'+

var ROTAS={
  inicio:{titulo:'Início',modulo:'Início',fn:telaInicio,pode:function(){return true;}},
  modulos:{titulo:'Módulos e permissões',modulo:'Módulos e permissões',fn:telaModulos,pode:function(){return ehMaster()||ehCorpMaster();}},
  usuarios:{titulo:'Usuários',modulo:'Usuários',fn:telaUsuarios,pode:function(){return ehMaster()||ehCorpMaster();}},
  organizacoes:{titulo:'Organizações',modulo:'Organizações',fn:telaOrganizacoes,pode:ehMaster},
  auditoria:{titulo:'Auditoria',modulo:'Auditoria',fn:telaAuditoria,pode:function(){return temModulo('auditoria');}},
  senha:{titulo:'Trocar senha',modulo:'Acesso',fn:telaSenha,pode:function(){return true;},semGrupo:true},
  workflow:{titulo:'Workflow',modulo:'Workflow',fn:telaWorkflow,pode:function(){return temModulo('workflow');},semGrupo:true},
  dashboard:{titulo:'Dashboard',modulo:'Dashboard',fn:telaDashboard,pode:function(){return temModulo('dashboard');},semGrupo:true},
  cadastro:{titulo:'Cadastro',modulo:'Cadastro',fn:telaCadPessoas,pode:function(){return temModulo('cadastro');},semGrupo:true},
  app:{titulo:'Aplicativo',modulo:'Aplicativo',fn:telaApp,pode:function(){return temModulo('app');},semGrupo:true}
};

function rota(){
  if(!E.acesso||!$('#tela'))return;
  var h=(location.hash||'#inicio').slice(1),r=ROTAS[h],mod=null;
  if(!r&&h.indexOf('m-')===0){
    mod=E.modulos.filter(function(m){return m.codigo===h.slice(2);})[0];
    if(mod&&temModulo(mod.codigo)&&!PRONTOS[mod.codigo]){r={titulo:mod.nome,modulo:mod.nome,fn:function(){telaPrevista(mod);},pode:function(){return true;}};}
  }
  if(!r||!r.pode()){h='inicio';r=ROTAS.inicio;}
  $$('.lateral a').forEach(function(l){if(l.getAttribute('data-rota')===h)l.setAttribute('aria-current','page');else l.removeAttribute('aria-current');});
  $('#trilha').textContent=(h==='inicio'||mod||r.semGrupo?'':'Administração / ')+r.titulo;
  document.title=r.titulo+' · Celeiro Office';
  E.telaAtual={origem:r.titulo,modulo:r.modulo};
  evento('Abriu a tela '+r.titulo,r.modulo);
  if(r.fn===telaUsuarios){telaUsuarios();}else{r.fn();}
}
window.addEventListener('hashchange',rota);

/* ---------- Usuários, níveis de permissão e módulos de cada pessoa ---------- */
function gerarSenha(){
  var abc='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789',v=new Uint32Array(14),s='';
  window.crypto.getRandomValues(v);
  for(var i=0;i<v.length;i++){s+=abc[v[i]%abc.length];}
  return s;
}
async function erroFuncao(e){
  var corpo=null;
  try{if(e&&e.context&&typeof e.context.json==='function'){corpo=await e.context.json();}}catch(err){}
  if(corpo&&corpo.erro)return corpo.erro;
  var st=e&&e.context&&e.context.status;
  if(st===404||/FunctionsFetchError|FunctionsRelayError/.test((e&&e.name)||'')||/Failed to send|not found/i.test((e&&e.message)||'')){
    return 'A função de criar usuários ainda não foi publicada no Supabase. Veja "Publicar a função criar-usuario" no LEIA-ME.';
  }
  if(st===401)return 'A função não aceitou a sua sessão. Saia, entre de novo e repita.';
  if(corpo&&corpo.message)return corpo.message;
  return msgErro(e);
}
function nomeModulo(c){

}

/* ---------- Trocar a própria senha ---------- */
function telaSenha(){
  tela('<div class="cabeca"><div><h1>Trocar senha</h1><p class="apoio">Use pelo menos 10 caracteres. A troca fica registrada na auditoria.</p></div></div>'+
    '<form class="painel" id="f-senha" novalidate style="max-width:460px">'+
    '<div class="campo"><label for="t-s1">Nova senha</label><input id="t-s1" type="password" autocomplete="new-password" required></div>'+
    '<div class="campo"><label for="t-s2">Repita a nova senha</label><input id="t-s2" type="password" autocomplete="new-password" required></div>'+
    '<button class="botao" type="submit">Salvar senha</button></form>');
  $('#f-senha').onsubmit=async function(ev){
    ev.preventDefault();
    var s1=$('#t-s1').value,s2=$('#t-s2').value,b=$('button[type=submit]',this);
    if(s1.length<10){aviso('A senha precisa ter pelo menos 10 caracteres.',true);return;}
    if(s1!==s2){aviso('As duas senhas não são iguais.',true);return;}
    ocupar(b,true);
    var r=await sb.auth.updateUser({password:s1});
    ocupar(b,false);
    if(r.error){aviso(msgErro(r.error),true);return;}
    evento('Trocou a própria senha','Acesso');
    $('#t-s1').value='';$('#t-s2').value='';
    aviso('Senha alterada.');
  };
}

/* ---------- Módulos e permissões ---------- */
async function telaModulos(orgEscolhida){
  carregando('Módulos e permissões');
  var rs=await Promise.all([sb.from('modulo_permissoes').select('*'),sb.from('organizacoes').select('*').order('nome')]);
  if(rs[0].error){falhaTela('Módulos e permissões',rs[0].error);return;}
  if(rs[1].error){falhaTela('Módulos e permissões',rs[1].error);return;}
  var perms=rs[0].data||[],orgs=rs[1].data||[],master=ehMaster(),a=E.acesso;
  var org=master?(orgEscolhida||''):a.organizacao_id;
  var colunas=master?(org?['corp_master','corp_operador']:['gerencial']):['corp_operador'];
  var mods=E.modulos.filter(function(m){return master||temModulo(m.codigo);});
  function ligado(perfil,modulo){
    return perms.some(function(p){return p.perfil===perfil&&p.modulo===modulo&&p.habilitado&&(perfil==='gerencial'?p.organizacao_id===null:p.organizacao_id===org);});
  }
  var linhas=mods.map(function(m){
    return '<tr><th scope="row">'+esc(m.nome)+'<span class="sub">'+(m.codigo==='auditoria'?'consulta ao histórico':'fase '+esc(m.fase))+'</span></th>'+
      colunas.map(function(p){
        return '<td>'+chaveSw(ligado(p,m.codigo),m.nome+' para '+PERFIS[p],'data-perfil="'+p+'" data-modulo="'+esc(m.codigo)+'"')+'</td>';
      }).join('')+'</tr>';
  }).join('');

/* ---------- Workflow (tarefas em lista e em quadro) ---------- */
var WF={tarefas:[],orgs:[],visao:'lista',aba:'todas',busca:'',grupo:'status'};
var WF_STATUS=[['a_fazer','A fazer'],['em_andamento','Em andamento'],['em_revisao','Em revisão'],['concluida','Concluída']];
var WF_PRIOR=[['baixa','Baixa'],['media','Média'],['alta','Alta'],['urgente','Urgente']];
function rotuloDe(lista,c){var x=lista.filter(function(i){return i[0]===c;})[0];return x?x[1]:c;}
function isoLocal(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function hojeIso(){return isoLocal(new Date());}
function somaDias(n){var d=new Date();d.setDate(d.getDate()+n);return isoLocal(d);}
function dataBr(iso){if(!iso)return '';var p=String(iso).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function ehEquipe(){return !!E.acesso&&(E.acesso.perfil==='master'||E.acesso.perfil==='gerencial');}
function wfAberta(t){return t.status!=='concluida';}
function wfVencida(t){return wfAberta(t)&&!!t.prazo&&t.prazo<hojeIso();}
function wfPapel(t,papel){return t.participantes.some(function(p){return p.user_id===E.acesso.user_id&&p.papel===papel;});}
function wfResponsaveis(t){return t.participantes.filter(function(p){return p.papel==='responsavel';}).map(function(p){return p.nome;}).join(', ');}
var WF_ABAS=[
  ['todas','Todas',function(){return true;},'Todas as tarefas que você pode ver.'],
  ['pra_mim','Pra mim',function(t){return wfAberta(t)&&wfPapel(t,'responsavel');},'Tarefas em aberto em que você é o responsável.'],
  ['aguardando','Aguardando',function(t){return wfAberta(t)&&t.criado_por===E.acesso.user_id&&!wfPapel(t,'responsavel');},'Tarefas em aberto que você criou e estão com outra pessoa.'],
  ['nao_lidas','Não lidas',function(t){return !!t.nao_lida;},'Tarefas com novidade desde a última vez que você abriu.'],
  ['vencidas','Vencidas',wfVencida,'Tarefas em aberto com o prazo já passado.'],
  ['urgentes','Urgentes',function(t){return wfAberta(t)&&t.prioridade==='urgente';},'Tarefas em aberto com prioridade urgente.'],
  ['mencionado','Mencionado',function(t){return wfPapel(t,'envolvido');},'Tarefas em que você foi marcado como envolvido.']
];
function wfAba(){return WF_ABAS.filter(function(a){return a[0]===WF.aba;})[0]||WF_ABAS[0];}
function wfVisiveis(){
  var b=WF.busca.trim().toLowerCase(),f=wfAba()[2];
  return WF.tarefas.filter(function(t){
    return f(t)&&(!b||t.titulo.toLowerCase().indexOf(b)>=0||t.codigo.toLowerCase().indexOf(b)>=0);
  });
}
async function carregaTarefas(){
  var r=await sb.rpc('workflow_listar');
  if(r.error)return r.error;
  WF.tarefas=r.data||[];
  return null;
}

async function telaWorkflow(){
  carregando('Tarefas');
  var e=await carregaTarefas();
  if(e){falhaTela('Tarefas',e);return;}
  if(ehEquipe()){var o=await sb.from('organizacoes').select('*').order('nome');WF.orgs=o.error?[]:(o.data||[]);}
  desenhaWorkflow();
}

function desenhaWorkflow(){

  }).join('');
  function seg(nome,valor,atual,rotulo){return '<button type="button" class="aba" data-'+nome+'="'+valor+'" aria-pressed="'+(atual===valor?'true':'false')+'">'+rotulo+'</button>';}

      '<div class="grade" style="align-items:center"><div class="segmento" role="group" aria-label="Forma de ver">'+seg('visao','lista',WF.visao,'Lista')+seg('visao','quadro',WF.visao,'Quadro')+'</div>'+
      '<button class="botao" type="button" id="wf-nova">Nova tarefa</button></div></div>'+
    '<div class="segmento rolavel" role="group" aria-label="Filtro de tarefas">'+abas+'</div>'+
    '<div class="grade" style="align-items:center">'+
      '<div class="campo" style="flex:999 1 260px"><label class="oculto-visual" for="wf-busca">Buscar</label><input id="wf-busca" type="text" placeholder="Buscar por título ou WF-0001" value="'+esc(WF.busca)+'"></div>'+
      (WF.visao==='lista'?'<div class="grade" style="align-items:center;flex:0 1 auto"><span class="apoio" style="font-size:13px">Agrupar por</span><div class="segmento" role="group" aria-label="Agrupar por">'+
        seg('grupo','status',WF.grupo,'Status')+seg('grupo','origem',WF.grupo,'Origem')+seg('grupo','nenhum',WF.grupo,'Nenhum')+'</div></div>':'')+
    '</div>'+
    '<p class="apoio" id="wf-explica" style="font-size:13px"></p>'+
    '<div id="wf-resultado"></div>');
  $('#wf-nova').onclick=function(){abrirTarefa(null);};
  $$('[data-aba]').forEach(function(b){b.onclick=function(){WF.aba=b.getAttribute('data-aba');desenhaWorkflow();};});
  $$('[data-visao]').forEach(function(b){b.onclick=function(){WF.visao=b.getAttribute('data-visao');desenhaWorkflow();};});
  $$('[data-grupo]').forEach(function(b){b.onclick=function(){WF.grupo=b.getAttribute('data-grupo');desenhaWorkflow();};});
  $('#wf-busca').oninput=function(){WF.busca=this.value;desenhaWfResultado();};
  desenhaWfResultado();
}

function wfSelos(t){
  return (t.nao_lida?'<span class="selo novo">Nova</span>':'')+
    (t.prioridade==='urgente'&&wfAberta(t)?'<span class="selo urgente">Urgente</span>':'')+
    (t.confidencial?'<span class="selo">Confidencial</span>':'')+
    (ehEquipe()?'<span class="selo claro">'+esc(t.organizacao||'Celeiro')+'</span>':'');
}
function wfPrazoHtml(t){
  if(!t.prazo)return '<span class="apoio">Sem prazo</span>';
  return wfVencida(t)?'<span class="vencida">'+esc(dataBr(t.prazo))+' · vencida</span>':esc(dataBr(t.prazo));
}

function desenhaWfResultado(){
  var alvo=$('#wf-resultado');
  if(!alvo)return;
  var lista=wfVisiveis();
  $('#wf-explica').textContent=wfAba()[3]+' '+lista.length+(lista.length===1?' tarefa.':' tarefas.');

    alvo.innerHTML='<div class="quadro">'+WF_STATUS.map(function(s,i){

        cs.map(function(t){
          return '<article class="cartao-t" draggable="true" data-tarefa="'+esc(t.id)+'">'+

            '<p class="meta">'+esc(wfResponsaveis(t)||'Sem responsável')+'</p><p class="meta">'+wfPrazoHtml(t)+(t.comentarios?' · '+t.comentarios+(t.comentarios===1?' comentário':' comentários'):'')+'</p>'+
            '<div class="mover">'+(i>0?'<button type="button" class="botao claro pequeno" data-mover="'+esc(t.id)+'" data-para="'+WF_STATUS[i-1][0]+'" aria-label="Mover '+esc(t.codigo)+' para '+esc(WF_STATUS[i-1][1])+'">← '+esc(WF_STATUS[i-1][1])+'</button>':'')+
              (i<WF_STATUS.length-1?'<button type="button" class="botao claro pequeno" data-mover="'+esc(t.id)+'" data-para="'+WF_STATUS[i+1][0]+'" aria-label="Mover '+esc(t.codigo)+' para '+esc(WF_STATUS[i+1][1])+'">'+esc(WF_STATUS[i+1][1])+' →</button>':'')+'</div>'+
          '</article>';
        }).join('')+(cs.length?'':'<p class="meta" style="padding:8px">Nada aqui.</p>')+'</section>';
    }).join('')+'</div>';
    $$('.cartao-t',alvo).forEach(function(c){

    });

      var nomes=[];lista.forEach(function(t){var n=t.modulo||'Sem módulo';if(nomes.indexOf(n)<0)nomes.push(n);});
      nomes.sort().forEach(function(n){grupos.push([n,lista.filter(function(t){return (t.modulo||'Sem módulo')===n;})]);});
    }else{grupos.push([null,lista]);}
    var corpo=grupos.filter(function(g){return g[1].length;}).map(function(g){
      return (g[0]===null?'':'<tr class="grupo-l"><th scope="colgroup" colspan="5">'+esc(g[0])+' <span class="conta">'+g[1].length+'</span></th></tr>')+
        g[1].map(function(t){
          return '<tr'+(wfVencida(t)?' class="alerta"':'')+'><td><button type="button" class="titulo-t" data-abrir="'+esc(t.id)+'"><span class="codigo">'+esc(t.codigo)+'</span> '+esc(t.titulo)+'</button><div class="chips" style="margin-top:4px">'+wfSelos(t)+'</div></td>'+
            '<td>'+esc(rotuloDe(WF_STATUS,t.status))+'<span class="sub">Prioridade '+esc(rotuloDe(WF_PRIOR,t.prioridade).toLowerCase())+'</span></td>'+
            '<td>'+esc(wfResponsaveis(t)||'—')+'</td><td>'+wfPrazoHtml(t)+'</td><td>'+esc(t.modulo||'—')+(t.categoria?'<span class="sub">'+esc(t.categoria)+'</span>':'')+'</td></tr>';
        }).join('');
    }).join('');
    alvo.innerHTML='<div class="rolagem"><table style="min-width:760px"><thead><tr><th scope="col">Título</th><th scope="col">Status</th><th scope="col">Responsável</th><th scope="col">Prazo</th><th scope="col">Módulo</th></tr></thead><tbody>'+corpo+'</tbody></table></div>';
  }
  $$('[data-abrir]',alvo).forEach(function(b){b.onclick=function(){var t=WF.tarefas.filter(function(x){return x.id===b.getAttribute('data-abrir');})[0];if(t)abrirTarefa(t);};});
}

async function moverTarefa(id,status){
  var t=WF.tarefas.filter(function(x){return x.id===id;})[0];
  if(!t||t.status===status){desenhaWfResultado();return;}
  var r=await sb.rpc('workflow_mover',{p_id:id,p_status:status});
  if(r.error){aviso(msgErro(r.error),true);desenhaWfResultado();return;}
  aviso(t.codigo+' movida para '+rotuloDe(WF_STATUS,status)+'.');
  await recarregaTelaDeTarefas();
}
async function recarregaTelaDeTarefas(){
  var h=(location.hash||'').slice(1);
  if(h==='workflow'){var e=await carregaTarefas();if(e){aviso(msgErro(e),true);return;}desenhaWorkflow();}
  else if(h==='dashboard'){telaDashboard();}
}

  async function montaPessoas(){

    atuais.forEach(function(p){if(!pessoas.some(function(x){return x.user_id===p.user_id;}))pessoas.push({user_id:p.user_id,nome:p.nome});});
    var respAtual=novo?a.user_id:((atuais.filter(function(p){return p.papel==='responsavel';})[0]||{}).user_id||'');

    alvo.innerHTML=cs.length?cs.map(function(c){var dh=dataHora(c.criado_em);return '<div class="coment"><strong>'+esc(c.nome)+'</strong> <span class="apoio">'+esc(dh.data)+' '+esc(dh.hora.slice(0,5))+'</span><p>'+esc(c.texto)+'</p></div>';}).join(''):'<p class="apoio">Nenhum comentário ainda.</p>';
  }

    };
    if($('#t-excluir',d)){
      $('#t-excluir',d).onclick=async function(){
        if(this.getAttribute('data-certeza')!=='1'){this.setAttribute('data-certeza','1');this.textContent='Confirmar exclusão';return;}
        ocupar(this,true);
        var r=await sb.rpc('workflow_excluir',{p_id:t.id});
        if(r.error){ocupar(this,false);aviso(msgErro(r.error),true);return;}
        fechar();aviso(t.codigo+' excluída.');recarregaTelaDeTarefas();
      };
    }
  }

  f.onsubmit=async function(ev){
    ev.preventDefault();
    var titulo=$('#t-titulo',d).value.trim(),b=$('button[type=submit]',f);
    if(!titulo){aviso('Informe o título da tarefa.',true);$('#t-titulo',d).focus();return;}
    var resp=selResp.value?[selResp.value]:[];
    var env=$$('input[name=t-env]:checked',d).map(function(x){return x.value;}).filter(function(x){return resp.indexOf(x)<0;});
    ocupar(b,true);
    var r=await sb.rpc('workflow_salvar',{
      p_id:novo?null:t.id,p_titulo:titulo,p_descricao:$('#t-desc',d).value,
      p_org:equipe?(selOrg.value||null):(org||null),
      p_status:novo?'a_fazer':$('#t-status',d).value,p_prazo:inPrazo.value||null,p_prioridade:prior,
      p_modulo:$('#t-modulo',d).value,p_categoria:$('#t-cat',d).value.trim(),
      p_confidencial:$('#t-conf',d).getAttribute('aria-checked')==='true',
      p_responsaveis:resp,p_envolvidos:env,p_origem_rotulo:novo?(ctx.origem||''):(t.origem_rotulo||'')});
    if(r.error){ocupar(b,false);aviso(msgErro(r.error),true);return;}
    fechar();

}

      cartaoA('Urgentes em aberto',texto(urgentes,'tarefa','tarefas','Nenhuma'),urgentes?'prioridade urgente':'sem urgência pendente','urgentes')+
      cartaoA('Pra mim',texto(praMim,'tarefa','tarefas','Nenhuma'),'em aberto sob sua responsabilidade','pra_mim')+

    '</div>'+

    '<div class="grade-d">'+
      cartaoB('Tarefas em aberto',temWf?String(abertas.length):'—',temWf?(n(function(t){return t.status==='a_fazer';})+' a fazer · '+n(function(t){return t.status==='em_andamento';})+' em andamento · '+n(function(t){return t.status==='em_revisao';})+' em revisão'):'Módulo Workflow não habilitado')+

function fmtCpf(v){var n=soNum(v);return n.length===11?n.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4'):String(v||'');}
function fmtCep(v){var n=soNum(v);return n.length===8?n.slice(0,5)+'-'+n.slice(5):String(v||'');}
function fmtTel(v){var n=soNum(v);if(n.length===11)return '('+n.slice(0,2)+') '+n.slice(2,7)+'-'+n.slice(7);if(n.length===10)return '('+n.slice(0,2)+') '+n.slice(2,6)+'-'+n.slice(6);return String(v||'');}
function fmtMoeda(v){if(v===null||v===undefined||v==='')return '';return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function leMoeda(txt){var t=String(txt||'').replace(/[^\d,.]/g,'');if(!t)return '';if(t.indexOf(',')>=0){t=t.replace(/\./g,'').replace(',','.');}return isNaN(Number(t))?'':String(Number(t));}
function cpfValido(v){
  var n=soNum(v);if(n.length!==11||/^(\d)\1+$/.test(n))return false;
  function dv(q){var s=0;for(var i=0;i<q;i++){s+=Number(n[i])*(q+1-i);}var r=(s*10)%11;return r===10?0:r;}
  return dv(9)===Number(n[9])&&dv(10)===Number(n[10]);
}
function simNao(b){return b?'Sim':'Não';}
function dado(rotulo,valor,copiavel){
  var tem=valor!==null&&valor!==undefined&&String(valor)!=='';
  return '<div class="dado"><span class="rot">'+esc(rotulo)+'</span><span class="val">'+(tem?esc(valor):'—')+
    (tem&&copiavel?' <button type="button" class="copiar" data-copiar="'+esc(valor)+'" aria-label="Copiar '+esc(rotulo.toLowerCase())+'">Copiar</button>':'')+'</span></div>';
}
function seloVerificado(sim){return '<span class="selo'+(sim?'':' claro')+'">'+(sim?'Verificado':'Não verificado')+'</span>';}
function ligaCopiar(){
  $$('[data-copiar]').forEach(function(b){b.onclick=function(){
    var v=b.getAttribute('data-copiar');
    try{navigator.clipboard.writeText(v).then(function(){aviso('Copiado.');},function(){aviso('Não foi possível copiar.',true);});}catch(err){aviso('Não foi possível copiar.',true);}
  };});
}
function ci(id,rotulo,valor,extra){return '<div class="campo"><label for="'+id+'">'+esc(rotulo)+'</label><input id="'+id+'" type="text" value="'+esc(valor==null?'':valor)+'" '+(extra||'')+'></div>';}
function cs(id,rotulo,valor,opcoes,vazio){
  return '<div class="campo"><label for="'+id+'">'+esc(rotulo)+'</label><select id="'+id+'"><option value="">'+esc(vazio||'Não informado')+'</option>'+
    opcoes.map(function(o){var v=typeof o==='string'?[o,o]:o;return '<option value="'+esc(v[0])+'"'+(v[0]===valor?' selected':'')+'>'+esc(v[1])+'</option>';}).join('')+'</select></div>';
}
function cb(id,rotulo,marcado){return '<label class="caixa-mod"><input type="checkbox" id="'+id+'"'+(marcado?' checked':'')+'> '+esc(rotulo)+'</label>';}
function seletorOrg(id,org,novo){
  if(!ehEquipe())return '';
  return '<div class="campo" style="max-width:420px"><label for="'+id+'">De quem é o cadastro</label><select id="'+id+'"'+(novo?'':' disabled')+'><option value="">Celeiro</option>'+
    CAD.orgs.filter(function(o){return o.ativo||o.id===org;}).map(function(o){return '<option value="'+esc(o.id)+'"'+(o.id===org?' selected':'')+'>'+esc(o.nome)+'</option>';}).join('')+'</select></div>';
}
function ligaCep(pre){
  var c=$('#'+pre+'cep');if(!c)return;
  c.onblur=async function(){
    var n=soNum(c.value);if(n.length!==8)return;
    c.value=fmtCep(n);
    try{
      var r=await fetch('https://viacep.com.br/ws/'+n+'/json/');
      var j=await r.json();
      if(!j||j.erro){aviso('CEP não encontrado. Preencha o endereço manualmente.',true);return;}
      [['logradouro',j.logradouro],['bairro',j.bairro],['cidade',j.localidade],['uf',j.uf]].forEach(function(p){var el=$('#'+pre+p[0]);if(el&&!el.value&&p[1])el.value=p[1];});
      aviso('Endereço preenchido pelo CEP. Confira e complete o número.');
    }catch(err){aviso('Não foi possível consultar o CEP agora. Preencha o endereço manualmente.',true);}
  };
}

function pfLer(){
  var d={};
  ['nome_completo','nome_social','cpf','nascimento','sexo','nome_mae','naturalidade','nacionalidade','estado_civil','telefone_celular','telefone_fixo','email','cep','logradouro','numero','complemento','bairro','cidade','uf','profissao','fonte_renda','observacoes'].forEach(function(k){d[k]=$('#p-'+k).value.trim();});
  ['celular_verificado','email_verificado','mei','isento_ir','pep','fatca','crs'].forEach(function(k){d[k]=$('#p-'+k).checked;});
  d.renda_mensal=leMoeda($('#p-renda_mensal').value);
  return d;
}
function pfConfere(d){
  if(!d.nome_completo)return 'Informe o nome completo.';
  if(!cpfValido(d.cpf))return 'CPF inválido. Confira os números.';
  if($('#p-renda_mensal').value.trim()&&d.renda_mensal==='')return 'Renda mensal inválida.';
  return '';
}
function pfLigaMascaras(){
  var c=$('#p-cpf');if(c){c.onblur=function(){c.value=fmtCpf(c.value);};}
  ['p-telefone_celular','p-telefone_fixo'].forEach(function(id){var t=$('#'+id);if(t){t.onblur=function(){t.value=fmtTel(t.value);};}});
  var r=$('#p-renda_mensal');if(r){r.onblur=function(){var n=leMoeda(r.value);r.value=n===''?'':fmtMoeda(n);};}
  ligaCep('p-');
}

/* ----- tela principal do Cadastro ----- */
async function telaCadPessoas(){
  carregando('Cadastro');
  var rs=await Promise.all([
    sb.from('cadastro_pf').select('id,organizacao_id,situacao,nome_completo,nome_social,cpf,cidade,uf,telefone_celular,email').order('nome_completo'),
    sb.from('cadastro_pj').select('id,organizacao_id,situacao,razao_social,nome_fantasia,cnpj,cidade,uf,situacao_cadastral').order('razao_social'),
    ehEquipe()?sb.from('organizacoes').select('*').order('nome'):Promise.resolve({data:[],error:null})
  ]);
  if(rs[0].error){falhaTela('Cadastro',rs[0].error);return;}
  if(rs[1].error){falhaTela('Cadastro',rs[1].error);return;}
  CAD.pf=rs[0].data||[];CAD.pj=rs[1].data||[];CAD.orgs=rs[2].error?[]:(rs[2].data||[]);
  desenhaCadastro();
}
function nomeOrgCad(id){if(!id)return 'Celeiro';var o=CAD.orgs.filter(function(x){return x.id===id;})[0];return o?o.nome:'—';}
function desenhaCadastro(){
  var pf=CAD.aba==='pf';
  tela('<div class="cabeca"><div><h1>Cadastro</h1><p class="apoio">Pessoas físicas e jurídicas. Cadastros não são apagados: podem ser inativados.</p></div>'+
      '<button class="botao" type="button" id="cad-novo">'+(pf?'Nova pessoa física':'Nova pessoa jurídica')+'</button></div>'+
    '<div class="segmento" role="group" aria-label="Tipo de cadastro">'+
      '<button type="button" class="aba" data-cad="pf" aria-pressed="'+(pf?'true':'false')+'">Pessoas físicas <span class="conta">'+CAD.pf.length+'</span></button>'+
      '<button type="button" class="aba" data-cad="pj" aria-pressed="'+(pf?'false':'true')+'">Pessoas jurídicas <span class="conta">'+CAD.pj.length+'</span></button></div>'+
    '<div class="campo"><label class="oculto-visual" for="cad-busca">Buscar</label><input id="cad-busca" type="text" placeholder="'+(pf?'Buscar por nome ou CPF':'Buscar por razão social, nome fantasia ou CNPJ')+'" value="'+esc(CAD.busca)+'"></div>'+
    '<div id="cad-resultado"></div>');
  $$('[data-cad]').forEach(function(b){b.onclick=function(){CAD.aba=b.getAttribute('data-cad');CAD.busca='';desenhaCadastro();};});
  $('#cad-busca').oninput=function(){CAD.busca=this.value;desenhaCadResultado();};
  $('#cad-novo').onclick=function(){if(pf)editarPf(null);else editarPj(null);};

      (linhas||'<tr><td colspan="'+(eq?6:5)+'" class="vazio">'+(CAD.pf.length?'Nenhuma pessoa nesta busca.':'Nenhuma pessoa física cadastrada.')+'</td></tr>')+'</tbody></table></div>';
    $$('[data-pf]',alvo).forEach(function(x){x.onclick=function(){verPf(x.getAttribute('data-pf'));};});
  }else{
    linhas=CAD.pj.filter(function(j){return !b||j.razao_social.toLowerCase().indexOf(b)>=0||(j.nome_fantasia||'').toLowerCase().indexOf(b)>=0||(bn&&j.cnpj.indexOf(bn)>=0);}).map(function(j){
      return '<tr><td><button type="button" class="titulo-t" data-pj="'+esc(j.id)+'">'+esc(j.razao_social)+'</button>'+(j.nome_fantasia?'<span class="sub">'+esc(j.nome_fantasia)+'</span>':'')+'</td>'+
        '<td>'+esc(formataCnpj(j.cnpj))+'</td><td>'+esc(j.cidade?(j.cidade+(j.uf?' - '+j.uf:'')):'—')+'</td><td>'+esc(j.situacao_cadastral||'—')+'</td>'+(eq?'<td>'+esc(nomeOrgCad(j.organizacao_id))+'</td>':'')+'<td>'+sit(j.situacao)+'</td></tr>';

/* ----- pessoa física ----- */
async function verPf(id){
  carregando('Cadastro');
  var r=await sb.from('cadastro_pf').select('*').eq('id',id);
  if(r.error||!r.data||!r.data.length){falhaTela('Cadastro',r.error||{message:'Cadastro não encontrado.'});return;}
  var p=r.data[0];
  evento('Abriu um cadastro de pessoa física','Cadastro',{id:p.id});
  tela('<div class="cabeca"><div><h1>'+esc(p.nome_completo)+'</h1><p class="apoio">Pessoa física · '+esc(ehEquipe()?nomeOrgCad(p.organizacao_id):'cadastro da sua organização')+' · '+(p.situacao==='ativo'?'Ativo':'Inativo')+'</p></div>'+botoesFicha(p.situacao)+'</div>'+
    '<div class="painel">'+pfDetalheHtml(p)+'</div>'+
    '<p class="nota">"Verificado" indica conferência feita manualmente por quem preencheu o cadastro. A confirmação automática por código (SMS ou e-mail) ainda não existe.</p>');
  ligaCopiar();
  $('#f-voltar').onclick=function(){telaCadPessoas();};
  $('#f-editar').onclick=function(){editarPf(p);};
  $('#f-situacao').onclick=async function(){
    ocupar(this,true);
    var s=await sb.rpc('cadastro_pf_situacao',{p_id:p.id,p_situacao:p.situacao==='ativo'?'inativo':'ativo'});
    if(s.error){ocupar(this,false);aviso(msgErro(s.error),true);return;}
    aviso(p.situacao==='ativo'?'Cadastro inativado.':'Cadastro reativado.');verPf(p.id);
  };
  if($('#f-tarefa')){$('#f-tarefa').onclick=function(){abrirTarefa(null,{origem:'Cadastro de '+p.nome_completo,modulo:'Cadastro'});};}
}
function editarPf(p){
  var novo=!p;
  tela('<div class="cabeca"><div><h1>'+(novo?'Nova pessoa física':'Editar pessoa física')+'</h1><p class="apoio">Obrigatórios: nome completo e CPF. Os demais campos podem ser completados depois.</p></div></div>'+
    '<form class="painel" id="f-pf" novalidate>'+seletorOrg('p-org',novo?'':(p.organizacao_id||''),novo)+pfFormHtml(p)+
    '<div class="grade"><button class="botao" type="submit">'+(novo?'Cadastrar':'Salvar')+'</button><button class="botao claro" type="button" id="p-cancelar">Cancelar</button></div></form>');
  pfLigaMascaras();
  $('#p-cancelar').onclick=function(){if(novo)telaCadPessoas();else verPf(p.id);};
  $('#f-pf').onsubmit=async function(ev){
    ev.preventDefault();
    var d=pfLer(),erro=pfConfere(d),b=$('button[type=submit]',this);
    if(erro){aviso(erro,true);return;}
    ocupar(b,true);
    var org=ehEquipe()?($('#p-org').value||null):E.acesso.organizacao_id;
    var r=await sb.rpc('cadastro_pf_salvar',{p_id:novo?null:p.id,p_org:org,p_dados:d});
    if(r.error){ocupar(b,false);aviso(msgErro(r.error),true);return;}
    aviso(novo?'Pessoa física cadastrada.':'Cadastro salvo.');verPf(r.data);
  };
}

/* ----- pessoa jurídica ----- */
async function verPj(id,aba){
  carregando('Cadastro');
  var r=await sb.from('cadastro_pj').select('*').eq('id',id);
  if(r.error||!r.data||!r.data.length){falhaTela('Cadastro',r.error||{message:'Cadastro não encontrado.'});return;}
  var j=r.data[0];aba=aba||'empresa';
  var rs=await Promise.all([
    sb.from('cadastro_pj_socios').select('*').eq('pj_id',id).order('ordem'),
    j.representante_pf_id?sb.from('cadastro_pf').select('*').eq('id',j.representante_pf_id):Promise.resolve({data:[],error:null})
  ]);
  var socios=rs[0].error?[]:(rs[0].data||[]),rep=(rs[1].data&&rs[1].data[0])||null;
  if(aba==='empresa')evento('Abriu um cadastro de pessoa jurídica','Cadastro',{id:j.id});
  var corpo;
  if(aba==='empresa'){
    corpo='<div class="painel"><h2 class="titulo-s">Dados da empresa</h2><div class="dados">'+
        dado('Razão social',j.razao_social,true)+dado('Nome fantasia',j.nome_fantasia)+dado('CNPJ',formataCnpj(j.cnpj),true)+
        dado('Situação cadastral',j.situacao_cadastral)+dado('Status enriquecimento',j.enriquecimento==='concluido'?'Concluído':'Não feito')+
        dado('Enriquecido em',j.enriquecido_em?(dataHora(j.enriquecido_em).data+' '+dataHora(j.enriquecido_em).hora.slice(0,5)):'')+'</div>'+
      '<h2 class="titulo-s">Contatos</h2><div class="dados">'+dado('E-mail',j.email,true)+dado('Telefone fixo',fmtTel(j.telefone_fixo),true)+dado('Telefone celular',fmtTel(j.telefone_celular),true)+'</div>'+
      '<h2 class="titulo-s">Endereço</h2><div class="dados">'+dado('CEP',fmtCep(j.cep),true)+dado('Logradouro',j.logradouro)+dado('Número',j.numero)+dado('Complemento',j.complemento)+dado('Bairro',j.bairro)+dado('Cidade',j.cidade)+dado('UF',j.uf)+'</div>'+
      '<h2 class="titulo-s">Responsável financeiro</h2><div class="dados">'+dado('Nome',j.financeiro_nome)+dado('E-mail',j.financeiro_email,true)+dado('Telefone',fmtTel(j.financeiro_telefone),true)+'</div>'+
      (j.observacoes?'<h2 class="titulo-s">Observações</h2><p style="white-space:pre-wrap">'+esc(j.observacoes)+'</p>':'')+'</div>';
  }else{
    var sel=socios.filter(function(s){return s.selecionado;})[0];
    corpo='<div class="painel"><div class="cartao-d-topo"><div><h2 class="titulo-s">Quadro de sócios e administradores (QSA)</h2><p class="apoio" style="font-size:13px">Escolha quem do quadro é o responsável pelo cadastro.</p></div>'+
        '<span class="selo'+(sel?'':' claro')+'">'+(sel?'Definido':'A definir')+'</span></div>'+
      (socios.length?'<ul class="lista-p">'+socios.map(function(s){
        return '<li class="linha-socio"><div><strong>'+esc(s.nome)+'</strong><span class="meta">'+esc([s.documento?('CPF/CNPJ '+s.documento):'',s.qualificacao].filter(Boolean).join(' · ')||'Sem qualificação informada')+'</span></div>'+
          '<div class="mover">'+(s.selecionado?'<span class="selo">Selecionado</span>':'<button type="button" class="botao claro pequeno" data-selecionar="'+esc(s.id)+'">Selecionar</button>')+
          '<button type="button" class="botao claro pequeno" data-remover-socio="'+esc(s.id)+'" aria-label="Remover '+esc(s.nome)+' do quadro">Remover</button></div></li>';}).join('')+'</ul>'
        :'<p class="apoio">Nenhum sócio ou administrador informado.</p>')+
      '<form id="f-socio" class="grade" novalidate>'+ci('s-nome','Nome','','maxlength="160"')+ci('s-doc','CPF ou CNPJ (opcional)','','maxlength="20"')+ci('s-qual','Qualificação','','maxlength="100" placeholder="Ex.: Sócio-administrador"')+
        '<button class="botao claro" type="submit">Adicionar ao quadro</button></form></div>'+
      '<div class="painel"><div class="cartao-d-topo"><div><h2 class="titulo-s">Representante</h2><p class="apoio" style="font-size:13px">Dados detalhados do responsável legal da empresa.</p></div>'+
        '<button class="botao'+(rep?' claro':'')+' pequeno" type="button" id="rep-editar">'+(rep?'Editar dados do representante':'Informar dados do representante')+'</button></div>'+
      (rep?pfDetalheHtml(rep):'<p class="apoio">Ainda sem dados do representante.'+(sel?' Selecionado no quadro: '+esc(sel.nome)+'.':'')+'</p>')+'</div>';
  }
  tela('<div class="cabeca"><div><h1>'+esc(j.razao_social)+'</h1><p class="apoio">Pessoa jurídica · '+esc(ehEquipe()?nomeOrgCad(j.organizacao_id):'cadastro da sua organização')+' · '+(j.situacao==='ativo'?'Ativo':'Inativo')+'</p></div>'+botoesFicha(j.situacao)+'</div>'+
    '<div class="segmento" role="group" aria-label="Partes do cadastro"><button type="button" class="aba" data-pj-aba="empresa" aria-pressed="'+(aba==='empresa'?'true':'false')+'">Empresa</button>'+
      '<button type="button" class="aba" data-pj-aba="representantes" aria-pressed="'+(aba==='representantes'?'true':'false')+'">Representantes <span class="conta">'+socios.length+'</span></button></div>'+corpo);
  ligaCopiar();
  $$('[data-pj-aba]').forEach(function(b){b.onclick=function(){verPj(j.id,b.getAttribute('data-pj-aba'));};});
  $('#f-voltar').onclick=function(){telaCadPessoas();};
  $('#f-editar').onclick=function(){editarPj(j);};
  $('#f-situacao').onclick=async function(){
    ocupar(this,true);
    var s=await sb.rpc('cadastro_pj_situacao',{p_id:j.id,p_situacao:j.situacao==='ativo'?'inativo':'ativo'});
    if(s.error){ocupar(this,false);aviso(msgErro(s.error),true);return;}
    aviso(j.situacao==='ativo'?'Cadastro inativado.':'Cadastro reativado.');verPj(j.id,aba);
  };
  if($('#f-tarefa')){$('#f-tarefa').onclick=function(){abrirTarefa(null,{origem:'Cadastro de '+j.razao_social,modulo:'Cadastro'});};}
  if(aba==='representantes'){
    async function gravaQuadro(lista,msg){
      var g=await sb.rpc('cadastro_pj_socios_definir',{p_pj:j.id,p_socios:lista});
      if(g.error){aviso(msgErro(g.error),true);return;}
      aviso(msg);verPj(j.id,'representantes');
    }
    function comoLista(){return socios.map(function(s){return {nome:s.nome,documento:s.documento,qualificacao:s.qualificacao,selecionado:s.selecionado};});}
    $('#f-socio').onsubmit=function(ev){
      ev.preventDefault();
      var nome=$('#s-nome').value.trim();
      if(!nome){aviso('Informe o nome.',true);return;}
      gravaQuadro(comoLista().concat([{nome:nome,documento:$('#s-doc').value.trim(),qualificacao:$('#s-qual').value.trim(),selecionado:false}]),'Adicionado ao quadro.');
    };
    $$('[data-remover-socio]').forEach(function(b){b.onclick=function(){
      var id=b.getAttribute('data-remover-socio');
      gravaQuadro(socios.filter(function(s){return s.id!==id;}).map(function(s){return {nome:s.nome,documento:s.documento,qualificacao:s.qualificacao,selecionado:s.selecionado};}),'Removido do quadro.');
    };});
    $$('[data-selecionar]').forEach(function(b){b.onclick=async function(){
      ocupar(b,true);
      var g=await sb.rpc('cadastro_pj_selecionar_socio',{p_pj:j.id,p_socio:b.getAttribute('data-selecionar')});
      if(g.error){ocupar(b,false);aviso(msgErro(g.error),true);return;}
      aviso('Responsável selecionado.');verPj(j.id,'representantes');
    };});
    $('#rep-editar').onclick=function(){editarRepresentante(j,rep,socios.filter(function(s){return s.selecionado;})[0]);};
  }
}
function editarRepresentante(j,rep,sel){
  var base=rep||{nome_completo:sel?sel.nome:''};
  tela('<div class="cabeca"><div><h1>Representante de '+esc(j.razao_social)+'</h1><p class="apoio">Obrigatórios: nome completo e CPF. Se já existir uma pessoa física com este CPF, o cadastro dela é atualizado e usado.</p></div></div>'+
    '<form class="painel" id="f-rep" novalidate>'+pfFormHtml(base)+
    '<div class="grade"><button class="botao" type="submit">Salvar representante</button><button class="botao claro" type="button" id="p-cancelar">Cancelar</button></div></form>');
  pfLigaMascaras();
  $('#p-cancelar').onclick=function(){verPj(j.id,'representantes');};
  $('#f-rep').onsubmit=async function(ev){
    ev.preventDefault();
    var d=pfLer(),erro=pfConfere(d),b=$('button[type=submit]',this);
    if(erro){aviso(erro,true);return;}
    ocupar(b,true);
    var r=await sb.rpc('cadastro_pj_representante_salvar',{p_pj:j.id,p_dados:d});
    if(r.error){ocupar(b,false);aviso(msgErro(r.error),true);return;}
    aviso('Representante salvo.');verPj(j.id,'representantes');
  };
}
function editarPj(j){
  var novo=!j,qsaNovo=null,enriquecido=false;j=j||{};
  tela('<div class="cabeca"><div><h1>'+(novo?'Nova pessoa jurídica':'Editar pessoa jurídica')+'</h1><p class="apoio">Obrigatórios: razão social e CNPJ. "Buscar dados pelo CNPJ" preenche o que estiver na base pública de CNPJ.</p></div></div>'+
    '<form class="painel" id="f-pj" novalidate>'+seletorOrg('j-org',novo?'':(j.organizacao_id||''),novo)+
    '<h2 class="titulo-s">Dados da empresa</h2><div class="grade3">'+
      '<div class="campo"><label for="j-cnpj">CNPJ</label><div class="junto"><input id="j-cnpj" type="text" inputmode="numeric" maxlength="18" value="'+esc(formataCnpj(j.cnpj))+'" required><button class="botao claro pequeno" type="button" id="j-buscar">Buscar dados pelo CNPJ</button></div></div>'+
      ci('j-razao_social','Razão social',j.razao_social,'maxlength="200" required')+ci('j-nome_fantasia','Nome fantasia',j.nome_fantasia,'maxlength="200"')+
      ci('j-situacao_cadastral','Situação cadastral',j.situacao_cadastral,'maxlength="60" placeholder="Ex.: ATIVA"')+'</div>'+
    '<p class="apoio oculto" id="j-qsa-aviso" style="font-size:13px"></p>'+
    '<h2 class="titulo-s">Contatos</h2><div class="grade3">'+ci('j-email','E-mail',j.email,'maxlength="254"')+ci('j-telefone_fixo','Telefone fixo',fmtTel(j.telefone_fixo),'inputmode="tel" maxlength="20"')+ci('j-telefone_celular','Telefone celular',fmtTel(j.telefone_celular),'inputmode="tel" maxlength="20"')+'</div>'+
    '<h2 class="titulo-s">Endereço</h2><div class="grade3">'+ci('j-cep','CEP',fmtCep(j.cep),'inputmode="numeric" maxlength="9"')+ci('j-logradouro','Logradouro',j.logradouro,'maxlength="160"')+ci('j-numero','Número',j.numero,'maxlength="20"')+
      ci('j-complemento','Complemento',j.complemento,'maxlength="80"')+ci('j-bairro','Bairro',j.bairro,'maxlength="100"')+ci('j-cidade','Cidade',j.cidade,'maxlength="100"')+cs('j-uf','UF',j.uf,UFS)+'</div>'+
    '<h2 class="titulo-s">Responsável financeiro</h2><div class="grade3">'+ci('j-financeiro_nome','Nome',j.financeiro_nome,'maxlength="160"')+ci('j-financeiro_email','E-mail',j.financeiro_email,'maxlength="254"')+ci('j-financeiro_telefone','Telefone',fmtTel(j.financeiro_telefone),'inputmode="tel" maxlength="20"')+'</div>'+
    '<div class="campo"><label for="j-observacoes">Observações (opcional)</label><textarea id="j-observacoes" rows="2" maxlength="2000">'+esc(j.observacoes||'')+'</textarea></div>'+
    '<div class="grade"><button class="botao" type="submit">'+(novo?'Cadastrar':'Salvar')+'</button><button class="botao claro" type="button" id="j-cancelar">Cancelar</button></div></form>');
  ligaCep('j-');
  var inC=$('#j-cnpj');inC.onblur=function(){inC.value=formataCnpj(inC.value);};
  ['j-telefone_fixo','j-telefone_celular','j-financeiro_telefone'].forEach(function(id){var t=$('#'+id);t.onblur=function(){t.value=fmtTel(t.value);};});
  $('#j-cancelar').onclick=function(){if(novo)telaCadPessoas();else verPj(j.id);};
  $('#j-buscar').onclick=async function(){
    var n=soNum(inC.value),b=this;
    if(!cnpjValido(n)){aviso('CNPJ inválido. Confira os números.',true);return;}
    ocupar(b,true);
    try{
      var r=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+n);
      if(!r.ok)throw new Error('sem resposta');
      var d=await r.json();
      function poe(id,v){var el=$('#'+id);if(el&&v!==undefined&&v!==null&&String(v).trim()!=='')el.value=String(v).trim();}
      poe('j-razao_social',d.razao_social);poe('j-nome_fantasia',d.nome_fantasia);poe('j-situacao_cadastral',d.descricao_situacao_cadastral);
      poe('j-cep',fmtCep(d.cep));poe('j-logradouro',[d.descricao_tipo_de_logradouro,d.logradouro].filter(Boolean).join(' '));poe('j-numero',d.numero);poe('j-complemento',d.complemento);
      poe('j-bairro',d.bairro);poe('j-cidade',d.municipio);if(UFS.indexOf(d.uf)>=0)$('#j-uf').value=d.uf;
      poe('j-email',d.email);poe('j-telefone_fixo',fmtTel(d.ddd_telefone_1));
      qsaNovo=(Array.isArray(d.qsa)?d.qsa:[]).map(function(s){return {nome:String(s.nome_socio||s.nome||'').trim(),documento:String(s.cnpj_cpf_do_socio||'').trim().slice(0,20),qualificacao:String(s.qualificacao_socio||'').trim(),selecionado:false};}).filter(function(s){return s.nome;});
      enriquecido=true;
      var av=$('#j-qsa-aviso');av.classList.remove('oculto');
      av.textContent='Dados preenchidos pela base pública de CNPJ. '+(qsaNovo.length?qsaNovo.length+(qsaNovo.length===1?' pessoa do quadro societário será gravada':' pessoas do quadro societário serão gravadas')+' ao salvar'+(novo?'.':', substituindo o quadro atual.'):'A base não trouxe quadro societário.');
      aviso('Dados da empresa preenchidos. Confira antes de salvar.');
    }catch(err){aviso('Não foi possível consultar o CNPJ agora. Preencha os dados manualmente.',true);}
    ocupar(b,false);
  };
  $('#f-pj').onsubmit=async function(ev){
    ev.preventDefault();
    var d={},b=$('button[type=submit]',this);
    ['cnpj','razao_social','nome_fantasia','situacao_cadastral','email','telefone_fixo','telefone_celular','cep','logradouro','numero','complemento','bairro','cidade','uf','financeiro_nome','financeiro_email','financeiro_telefone','observacoes'].forEach(function(k){d[k]=$('#j-'+k).value.trim();});
    d.enriquecido=enriquecido;
    if(!d.razao_social){aviso('Informe a razão social.',true);return;}
    if(!cnpjValido(d.cnpj)){aviso('CNPJ inválido. Confira os números.',true);return;}
    ocupar(b,true);
    var org=ehEquipe()?($('#j-org').value||null):E.acesso.organizacao_id;
    var r=await sb.rpc('cadastro_pj_salvar',{p_id:novo?null:j.id,p_org:org,p_dados:d});
    if(r.error){ocupar(b,false);aviso(msgErro(r.error),true);return;}
    if(qsaNovo&&qsaNovo.length){
      var g=await sb.rpc('cadastro_pj_socios_definir',{p_pj:r.data,p_socios:qsaNovo});
      if(g.error){aviso('Empresa salva, mas o quadro societário não foi gravado: '+msgErro(g.error),true);verPj(r.data,'representantes');return;}
    }
    aviso(novo?'Pessoa jurídica cadastrada.':'Cadastro salvo.');verPj(r.data,qsaNovo&&qsaNovo.length?'representantes':'empresa');
  };
}

/* ---------- Auditoria ---------- */
var AUD={linhas:[],filtros:{}};
async function telaAuditoria(){
  carregando('Auditoria');
  var us=await sb.from('usuarios').select('user_id,nome').order('nome');
  var usuarios=us.error?[]:(us.data||[]);
  var modulosFiltro=['Acesso','Início','Módulos e permissões','Usuários','Organizações','Auditoria'].concat(E.modulos.filter(function(m){return m.codigo!=='auditoria';}).map(function(m){return m.nome;}));
  var f=AUD.filtros;
  tela('<div class="cabeca"><div><h1>Auditoria</h1><p class="apoio">Todas as ações de todos os usuários, com IP, data e hora. O registro não pode ser editado nem apagado.</p></div>'+
      '<button class="botao claro" type="button" id="b-exportar">Exportar</button></div>'+
    '<form class="painel" id="f-aud" novalidate><div class="grade">'+
      '<div class="campo"><label for="a-de">De</label><input id="a-de" type="date" value="'+esc(f.de||'')+'"></div>'+
      '<div class="campo"><label for="a-ate">Até</label><input id="a-ate" type="date" value="'+esc(f.ate||'')+'"></div>'+
      '<div class="campo"><label for="a-usuario">Usuário</label><select id="a-usuario"><option value="">Todos</option>'+
        usuarios.map(function(u){return '<option value="'+esc(u.user_id)+'"'+(f.usuario===u.user_id?' selected':'')+'>'+esc(u.nome)+'</option>';}).join('')+'</select></div>'+
      '<div class="campo"><label for="a-modulo">Módulo</label><select id="a-modulo"><option value="">Todos</option>'+
        modulosFiltro.map(function(m){return '<option'+(f.modulo===m?' selected':'')+'>'+esc(m)+'</option>';}).join('')+'</select></div>'+
      '<div class="campo"><label for="a-ip">IP</label><input id="a-ip" type="text" placeholder="Buscar por IP" value="'+esc(f.ip||'')+'"></div>'+
      '<button class="botao" type="submit">Filtrar</button></div></form>'+
    '<div id="aud-lista"><p class="apoio">Carregando…</p></div>'+
    '<p class="nota">O local mostra o país informado pela rede no momento do acesso. Cidade depende de um serviço de localização por IP, ainda não contratado. Mesmo com ele, o local é estimado pelo IP, não é a posição exata do equipamento. Ações feitas direto no painel do Supabase aparecem sem usuário.</p>');
  $('#f-aud').onsubmit=function(ev){
    ev.preventDefault();
    AUD.filtros={de:$('#a-de').value,ate:$('#a-ate').value,usuario:$('#a-usuario').value,modulo:$('#a-modulo').value,ip:$('#a-ip').value.trim()};
    evento('Filtrou a auditoria','Auditoria',AUD.filtros);
    buscaAuditoria();
  };
  $('#b-exportar').onclick=exportaAuditoria;
  buscaAuditoria();
}

async function buscaAuditoria(){
  var f=AUD.filtros,lista=$('#aud-lista');
  if(!lista)return;
  var q=sb.from('auditoria').select('*').order('ocorrido_em',{ascending:false}).limit(300);
  if(f.de)q=q.gte('ocorrido_em',new Date(f.de+'T00:00:00').toISOString());
  if(f.ate)q=q.lte('ocorrido_em',new Date(f.ate+'T23:59:59.999').toISOString());
  if(f.usuario)q=q.eq('user_id',f.usuario);
  if(f.modulo)q=q.eq('modulo',f.modulo);
  if(f.ip)q=q.ilike('ip','%'+f.ip.replace(/[%_,()]/g,'')+'%');
  var r=await q;
  if(!$('#aud-lista'))return;
  if(r.error){lista.innerHTML='<p class="erro" role="alert">'+esc(msgErro(r.error))+'</p>';return;}
  AUD.linhas=r.data||[];
  if(!AUD.linhas.length){lista.innerHTML='<div class="rolagem"><p class="vazio">Nenhum registro para este filtro.</p></div>';return;}
  var linhas=AUD.linhas.map(function(l){
    var d=dataHora(l.ocorrido_em),alerta=/recusad|inativ|sem perfil/i.test(l.acao);
    return '<tr'+(alerta?' class="alerta"':'')+'><td>'+esc(d.data)+'</td><td>'+esc(d.hora)+'</td>'+
      '<td>'+esc(l.usuario_nome||'—')+'<span class="sub">'+esc(l.usuario_email||(l.user_id?'':'direto no banco'))+'</span></td>'+
      '<td>'+esc(PERFIS[l.perfil]||l.perfil||'—')+'</td>'+
      '<td>'+esc(l.acao)+(l.tabela?'<span class="sub">'+esc(l.tabela)+(l.registro_id?' · '+esc(l.registro_id):'')+'</span>':'')+'</td>'+
      '<td>'+esc(l.modulo||'—')+'</td><td>'+esc(l.ip||'—')+'</td><td>'+esc(l.local||l.pais||'—')+'</td></tr>';
  }).join('');
  lista.innerHTML='<div class="rolagem"><table style="min-width:920px"><thead><tr><th scope="col">Data</th><th scope="col">Hora</th><th scope="col">Usuário</th><th scope="col">Perfil</th><th scope="col">Ação</th><th scope="col">Módulo</th><th scope="col">IP</th><th scope="col">Local</th></tr></thead><tbody>'+linhas+'</tbody></table></div>'+
    '<p class="apoio" style="font-size:13px;margin-top:10px">'+AUD.linhas.length+(AUD.linhas.length===300?' registros mais recentes (limite da tela; use os filtros para ver períodos anteriores).':' registros.')+'</p>';
}

function exportaAuditoria(){
  if(!AUD.linhas.length){aviso('Não há registros para exportar.',true);return;}
  function c(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
  var csv=['Data;Hora;Usuário;E-mail;Perfil;Ação;Módulo;Tabela;Registro;IP;País;Local;Navegador;Origem'];
  AUD.linhas.forEach(function(l){
    var d=dataHora(l.ocorrido_em);
    csv.push([d.data,d.hora,l.usuario_nome,l.usuario_email,PERFIS[l.perfil]||l.perfil,l.acao,l.modulo,l.tabela,l.registro_id,l.ip,l.pais,l.local,l.navegador,l.origem].map(c).join(';'));
  });
  var url=URL.createObjectURL(new Blob(['﻿'+csv.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  var a=document.createElement('a');
  a.href=url;a.download='celeiro-auditoria-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
  evento('Exportou a auditoria','Auditoria',{registros:AUD.linhas.length,filtros:AUD.filtros});
}

/* ---------- início ---------- */
async function iniciar(){
  if(!configurado){telaConfig();return;}
  sb.auth.onAuthStateChange(function(tipo){
    if(tipo==='PASSWORD_RECOVERY'){E.recuperando=true;}
    if(tipo==='SIGNED_OUT'&&E.acesso){
      setTimeout(function(){E.acesso=null;telaLogin('Sua sessão foi encerrada. Entre de novo.');},0);
    }
  });
  var s=await sb.auth.getSession();
  if(s.error||!s.data||!s.data.session){telaLogin();return;}
  await aposSenha();
}
iniciar();

})();
</script>
