<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Celeiro Office</title>
<script>
/* Raiz do sistema: funciona em /office, /office/ e na raiz do subdomínio */
(function(){var p=location.pathname.replace(/[^\/]*\.html$/,'');if(p.charAt(p.length-1)!=='/')p+='/';window.CELEIRO_OFFICE_RAIZ=p;
document.write('<link rel="icon" href="'+p+'assets/favicon.png">');})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#0F3D2E;--verde2:#1B5A45;--ambar:#E3A72F;--nevoa:#F4F6F3;--linha:#D5DED9;--borda:#9FB0A8;--texto2:#44564E;--branco:#FFFFFF;--erro:#9B1C1C;--erro-fundo:#FDECEC;--alerta-fundo:#FBF1DC}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Sora',system-ui,sans-serif;color:var(--verde);background:var(--nevoa);font-size:15px;line-height:1.5}
h1,h2,h3,p{margin:0}
a{color:var(--verde)}
button,input,select{font-family:inherit;font-size:15px;color:var(--verde)}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
.oculto{display:none!important}

/* telas públicas */
.publico{min-height:100vh;display:flex;flex-wrap:wrap}
.publico .marca{flex:1 1 440px;background:var(--verde);color:var(--nevoa);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.publico .marca img{width:240px;height:auto}
.publico .marca .olho{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--ambar);font-weight:600}
.publico .marca h1{font-size:36px;line-height:1.15;font-weight:600;max-width:460px;margin-top:16px}
.publico .marca ul{margin:20px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;color:#D5DED9}
.publico .marca li{display:flex;gap:12px;align-items:flex-start}
.publico .marca li::before{content:"";flex:none;width:14px;height:8px;margin-top:8px;background:var(--ambar);transform:skewX(-30deg)}
.publico .marca .rodape{font-size:13px;color:#B9C7C0}
.publico .lado{flex:1 1 420px;padding:48px 24px;display:flex;align-items:center;justify-content:center}
.caixa{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px}
.caixa.larga{max-width:560px}
.caixa h2{font-size:26px;font-weight:600;line-height:1.25}
.caixa .apoio,.apoio{color:var(--texto2)}
.nota{font-size:13px;line-height:1.6;color:var(--texto2);padding-top:18px;border-top:1px solid var(--linha)}

/* formulários */
.campo{display:flex;flex-direction:column;gap:8px}
.campo label,.campo .rotulo{font-size:14px;font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=date],select{height:48px;padding:0 14px;border:1px solid var(--borda);border-radius:8px;background:var(--branco);width:100%}
input.codigo{font-size:24px;font-weight:600;letter-spacing:.35em;text-align:center;height:60px}
.botao{height:48px;padding:0 22px;border:0;border-radius:8px;background:var(--verde);color:var(--nevoa);font-weight:600;cursor:pointer}
.botao:hover{background:var(--verde2)}
.botao[disabled]{opacity:.6;cursor:wait}
.botao.ambar{background:var(--ambar);color:var(--verde)}
.botao.claro{background:var(--branco);color:var(--verde);border:1px solid var(--verde)}
.botao.pequeno{height:44px;padding:0 14px;font-size:14px}
.link-botao{display:inline-flex;align-items:center;text-decoration:none}
.link{background:none;border:0;padding:0;color:var(--verde);text-decoration:underline;cursor:pointer;font-size:14px;min-height:44px;text-align:left}
.erro{background:var(--erro-fundo);color:var(--erro);border:1px solid #F0B4B4;border-radius:8px;padding:12px 14px;font-size:14px}
.sucesso{background:#E4F1EA;color:var(--verde);border:1px solid #B5D3C4;border-radius:8px;padding:12px 14px;font-size:14px}
.qr{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.qr img{width:200px;height:200px;border:1px solid var(--linha);border-radius:12px;background:var(--branco);padding:8px}
.qr .chave{font-size:14px;letter-spacing:.06em;word-break:break-all;padding:10px 12px;border:1px solid var(--linha);border-radius:8px;background:var(--branco)}

/* sistema */
.casca{min-height:100vh;display:flex;flex-wrap:wrap}
.lateral{flex:1 0 230px;max-width:100%;background:var(--verde);color:var(--nevoa);padding:24px 16px;display:flex;flex-direction:column;gap:20px}
.lateral img{width:180px;height:auto}
.lateral .itens{display:flex;flex-direction:column;gap:2px}
.lateral a{display:block;padding:12px;border-radius:8px;color:var(--nevoa);text-decoration:none;font-size:14px}
.lateral a:hover{background:rgba(255,255,255,.08)}
.lateral a[aria-current=page]{background:var(--verde2);font-weight:600}
.lateral .grupo{margin:16px 12px 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ambar);font-weight:600}
.lateral .fase{font-size:11px;color:#B9C7C0;margin-left:6px}
.conteudo{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.topo{padding:14px 28px;background:var(--branco);border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topo .trilha{font-size:14px;color:var(--texto2)}
.topo .quem{display:flex;align-items:center;gap:12px;font-size:14px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:6px;background:var(--verde);color:var(--ambar);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
main.tela{padding:28px;display:flex;flex-direction:column;gap:22px;width:100%}
main.tela h1{font-size:26px;font-weight:600}
.cabeca{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.cabeca > div{display:flex;flex-direction:column;gap:6px;max-width:680px}
.painel{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.painel h2{font-size:17px;font-weight:600}
.grade{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.grade .campo{flex:1 1 180px}
.cartoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;text-decoration:none}
.cartao strong{font-size:16px}
.cartao span{font-size:13px;color:var(--texto2)}
.rolagem{overflow-x:auto;background:var(--branco);border:1px solid var(--linha);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 14px;text-align:left;vertical-align:top}
thead th{background:var(--nevoa);font-weight:600;white-space:nowrap}
tbody tr{border-top:1px solid var(--linha)}
tr.alerta{background:var(--alerta-fundo)}
td .sub{display:block;font-size:12px;color:var(--texto2)}
.vazio{padding:28px;text-align:center;color:var(--texto2)}
.chave-sw{width:52px;height:44px;padding:8px 0;border:0;background:none;cursor:pointer}
.chave-sw span{display:flex;width:48px;height:28px;padding:3px;border-radius:14px;background:#B9C7C0;justify-content:flex-start}
.chave-sw span i{width:22px;height:22px;border-radius:11px;background:var(--branco)}
.chave-sw[aria-checked=true] span{background:var(--verde);justify-content:flex-end}
.chave-sw[aria-checked=true] span i{background:var(--ambar)}
.chave-sw[disabled]{opacity:.5;cursor:not-allowed}
.situacao{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;background:#E4F1EA;color:var(--verde)}
.situacao.off{background:#E8E8E8;color:#4A4A4A}
.chips{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle}
.chipm{padding:3px 9px;border-radius:6px;background:#E4F1EA;color:var(--verde);font-size:12px;font-weight:500;white-space:nowrap}
.chipm.bloq{background:var(--alerta-fundo);color:#7A5400}
.previa{padding:12px 14px;border-radius:8px;background:var(--nevoa);font-size:14px;line-height:1.9}
.previa .sub{display:block;font-size:12px;color:var(--texto2);line-height:1.5}
.caixas{display:flex;flex-wrap:wrap;gap:8px 18px}
.caixa-mod{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;cursor:pointer}
.caixa-mod input{width:20px;height:20px;accent-color:var(--verde)}
.junto{display:flex;gap:8px}
.junto input{flex:1;min-width:0}
.senha-inicial{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;font-weight:600;letter-spacing:.04em;user-select:all}
.oculto-visual{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
textarea{font-family:inherit;font-size:15px;color:var(--verde);padding:12px 14px;border:1px solid var(--borda);border-radius:8px;background:var(--branco);width:100%;resize:vertical}
.segmento{display:inline-flex;flex-wrap:wrap;border:1px solid var(--borda);border-radius:8px;background:var(--branco);overflow:hidden;max-width:100%}
.segmento.rolavel{display:flex}
.campo>.segmento{align-self:flex-start}
.aba{min-height:44px;padding:0 14px;border:0;border-right:1px solid var(--linha);background:none;font-size:14px;cursor:pointer;white-space:nowrap}
.aba:last-child{border-right:0}
.aba[aria-pressed=true]{background:var(--verde);color:var(--nevoa);font-weight:600}
.conta{font-size:12px;opacity:.8;margin-left:2px}
.selo{padding:2px 8px;border-radius:6px;background:#E4F1EA;color:var(--verde);font-size:12px;font-weight:500;white-space:nowrap}
.selo.claro{background:var(--nevoa);border:1px solid var(--linha)}
.selo.urgente{background:var(--erro-fundo);color:var(--erro)}
.selo.novo{background:var(--ambar);color:var(--verde);font-weight:600}
.vencida{color:var(--erro);font-weight:600}
.titulo-t{background:none;border:0;padding:0;text-align:left;font-size:14px;font-weight:500;color:var(--verde);cursor:pointer;min-height:28px;line-height:1.4}
.titulo-t:hover{text-decoration:underline}
.codigo{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--texto2);margin-right:4px}
tr.grupo-l th{background:var(--nevoa);font-size:13px;font-weight:600;padding:8px 14px}
.quadro{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start}
.coluna{background:#E9EEEA;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.coluna.alvo{outline:2px dashed var(--verde)}
.coluna h2{font-size:14px;font-weight:600}
.cartao-t{background:var(--branco);border:1px solid var(--linha);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:grab}
.cartao-t .meta,.meta{font-size:12px;color:var(--texto2);margin:0}
.mover{display:flex;flex-wrap:wrap;gap:6px}
.mover .botao{height:36px;padding:0 10px;font-size:12px}
.dlg{width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px);padding:0;border:0;border-radius:14px;color:var(--verde);box-shadow:0 20px 60px rgba(15,61,46,.35)}
.dlg::backdrop{background:rgba(15,61,46,.45)}
.dlg form{display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.dlg-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--linha)}
.dlg-topo h2{font-size:20px;font-weight:600}
.dlg-corpo{padding:18px 22px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.dlg-rodape{display:flex;flex-wrap:wrap;gap:10px;padding:16px 22px;border-top:1px solid var(--linha)}
.linha-conf{display:flex;justify-content:space-between;align-items:center;gap:12px}
.coment{padding:10px 12px;border-radius:8px;background:var(--nevoa);font-size:14px;margin-bottom:8px}
.coment p{margin-top:4px;white-space:pre-wrap;word-break:break-word}
.mencao{font-weight:600;color:var(--verde);background:#E4F1EA;border-radius:4px;padding:0 3px}
.mencao-base{position:relative;flex-wrap:wrap}
.mencao-lista{position:absolute;left:0;right:0;bottom:100%;margin:0 0 4px;padding:4px;list-style:none;background:#fff;border:1px solid var(--linha);border-radius:8px;box-shadow:0 6px 18px rgba(15,61,46,.14);z-index:5;max-height:220px;overflow:auto}
.mencao-lista li{padding:9px 10px;border-radius:6px;font-size:14px;cursor:pointer}
.mencao-lista li[aria-selected=true],.mencao-lista li:hover{background:var(--nevoa)}
.anexos{list-style:none;margin:0 0 8px;padding:0}
.anexos li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px;border-radius:8px;background:var(--nevoa);font-size:14px;margin-bottom:6px}
.anexos li .apoio{flex:1 1 auto}
button.link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--verde);text-decoration:underline;cursor:pointer;text-align:left;word-break:break-word}
#t-arquivo{flex:1 1 200px;min-width:0;font-size:14px}
.dlg-anexo{width:min(960px,96vw);max-width:96vw}
.dlg-anexo .dlg-topo h2{word-break:break-word;font-size:18px}
.va-imagem{display:block;max-width:100%;max-height:74vh;margin:0 auto;border-radius:8px}
.va-pdf{display:block;width:100%;height:74vh;border:1px solid var(--linha);border-radius:8px;background:#fff}
.va-texto{margin:0;padding:14px;background:var(--nevoa);border-radius:8px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:74vh;overflow:auto}
.grade-d{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.cartao-d{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.cartao-d.baixo{min-height:110px}
.cartao-d.apagado{background:transparent;border-style:dashed}
.cartao-d-topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.cartao-d-topo a{font-size:13px;white-space:nowrap}
.cartao-d .numero{font-size:24px;font-weight:600;line-height:1.2;margin-top:6px}
.cartao-d .apoio{font-size:13px}
.titulo-s{font-size:16px;font-weight:600;margin-top:4px}
.dupla-d{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
.legenda{display:flex;gap:16px;font-size:12px;color:var(--texto2)}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.lista-p{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lista-p li{padding:10px 0;border-top:1px solid var(--linha);display:flex;flex-direction:column;gap:2px}
.lista-p li:first-child{border-top:0}
.dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 24px}
.dado{display:flex;flex-direction:column;gap:2px;min-width:0}
.dado .rot{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto2)}
.dado .val{font-size:15px;word-break:break-word}
.copiar{background:none;border:0;padding:0 4px;font-size:12px;color:var(--texto2);text-decoration:underline;cursor:pointer;min-height:24px}
.contatos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.contato{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--linha);border-radius:10px;background:var(--nevoa)}
.grade3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:start}
.cabeca>.acoes{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;max-width:none;flex:0 1 auto}
.botao.sutil{background:none;color:var(--texto2);font-weight:500;text-decoration:underline;padding:0 10px}
.botao.sutil:hover{background:none;color:var(--verde)}
.texto-livre{white-space:pre-wrap;margin:0}
.verif{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin-top:6px}
.verif:empty{display:none}
#ip-env input{width:100%;min-width:0}
.dlg.largo{width:min(880px,calc(100vw - 24px))}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.neg{color:var(--erro)}
tr.grupo td,tr.grupo th{font-weight:600;background:var(--nevoa)}
tr.total td{font-weight:700;border-top:2px solid var(--verde)}
.pilha{display:flex;flex-direction:column;gap:20px}
.fin-acoes{display:flex;flex-wrap:wrap;gap:6px}
.opcao{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
tr.grupo-l th{background:var(--nevoa);text-align:left;font-size:14px;padding:10px 12px}
tr.grupo-l th .sub{display:inline;margin-left:10px;font-weight:400}
.opcao input{width:18px;height:18px;margin:0}
.lista-simples{margin:8px 0;padding-left:18px;font-size:14px;line-height:1.7}
.fin-faixa{display:flex;flex-direction:column;gap:6px}
.fin-faixa-topo{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.fin-faixa-barra{height:8px;border-radius:4px;background:var(--nevoa);overflow:hidden}
.fin-faixa-barra i{display:block;height:100%;background:var(--verde);border-radius:4px}
.fatura-doc{display:flex;flex-direction:column;gap:18px;border:1px solid var(--linha);border-radius:12px;padding:20px}
.fatura-topo,.fatura-partes{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.fatura-topo>div,.fatura-partes>div{display:flex;flex-direction:column;gap:4px}
.fatura-num{text-align:right;align-items:flex-end}
.fatura-num strong{font-size:22px}
.fatura-doc span,.fatura-obs{font-size:12px;color:var(--texto2);margin:0}
#ff-itens input{width:100%;min-width:0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:var(--nevoa);padding:1px 5px;border-radius:4px;word-break:break-all}
.bloco{margin:0;padding:12px 14px;background:var(--nevoa);border:1px solid var(--linha);border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;overflow-x:auto;white-space:pre}
#mcp-tk,#mcp-url{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.voltar{align-self:flex-start;background:none;border:0;padding:0;min-height:32px;font-size:14px;color:var(--texto2);cursor:pointer;margin-bottom:-10px}
.voltar:hover{color:var(--verde);text-decoration:underline}
.linha-socio{flex-direction:row!important;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px!important}
.linha-socio>div:first-child{display:flex;flex-direction:column;gap:2px}
#aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 18px;border-radius:8px;background:var(--verde);color:var(--nevoa);font-size:14px;box-shadow:0 6px 24px rgba(15,61,46,.25);z-index:2147483647}
#aviso.ruim{background:var(--erro)}
#aviso:empty{display:none}
@media (max-width:720px){.publico .marca{padding:32px 24px}.publico .marca h1{font-size:28px}.lateral .itens{flex-direction:row;flex-wrap:wrap}.lateral .grupo{width:100%;margin:8px 12px 2px}main.tela{padding:20px 16px}.topo{padding:12px 16px}}
</style>
</head>
<body>
<div id="app"><p class="vazio">Carregando…</p></div>
<div id="aviso" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.1"></script>
<script>document.write('<script src="'+window.CELEIRO_OFFICE_RAIZ+'config.js"><\/script>');</script>
<script>
(function(){
'use strict';

var cfg=window.CELEIRO_OFFICE_CONFIG||{};
var RAIZ=window.CELEIRO_OFFICE_RAIZ||'';
var configurado=!!(cfg.url&&cfg.anonKey&&!/COLE_AQUI/.test(String(cfg.url)+String(cfg.anonKey))&&window.supabase&&window.supabase.createClient);
var hashInicial=location.hash||'';
var sb=configurado?window.supabase.createClient(cfg.url,cfg.anonKey):null;
var app=document.getElementById('app');
var elAviso=document.getElementById('aviso');

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(sel,raiz){return (raiz||document).querySelector(sel);}
function $$(sel,raiz){return Array.prototype.slice.call((raiz||document).querySelectorAll(sel));}
function aviso(msg,ruim){
  var aberto=document.querySelector('dialog[open]');
  (aberto||document.body).appendChild(elAviso);
  elAviso.textContent=msg||'';
  elAviso.className=ruim?'ruim':'';
  clearTimeout(E.avisoRelogio);
  if(msg){E.avisoRelogio=setTimeout(function(){elAviso.textContent='';},5000);}
}
function msgErro(e){
  var m=(e&&e.message)||String(e||'');
  if(/Invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Invalid TOTP code|invalid.*code/i.test(m))return 'Código incorreto. Confira o aplicativo e tente de novo.';
  if(/rate limit|too many/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/Failed to fetch|NetworkError/i.test(m))return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
  if(/Email not confirmed/i.test(m))return 'Este e-mail ainda não foi confirmado.';
  if(/should be different/i.test(m))return 'A nova senha precisa ser diferente da atual.';
  return m||'Não foi possível concluir. Tente de novo.';
}
function evento(acao,modulo,detalhes){
  if(!sb)return;
  try{
    sb.rpc('registrar_evento',{p_acao:acao,p_modulo:modulo||'',p_detalhes:detalhes||null}).then(function(r){
      if(r&&r.error&&window.console)console.warn('Auditoria:',r.error.message);
    });
  }catch(err){}
}
function dataHora(iso){
  var d=new Date(iso);
  return {data:d.toLocaleDateString('pt-BR'),hora:d.toLocaleTimeString('pt-BR')};
}
function cnpjValido(v){
  var n=String(v||'').replace(/\D/g,'');
  if(n.length!==14||/^(\d)\1+$/.test(n))return false;
  function dv(base){var p=base.length-7,s=0;for(var i=0;i<base.length;i++){s+=Number(base[i])*p;p=p===2?9:p-1;}var r=s%11;return r<2?0:11-r;}
  return dv(n.slice(0,12))===Number(n[12])&&dv(n.slice(0,13))===Number(n[13]);
}
function formataCnpj(v){
  var n=String(v||'').replace(/\D/g,'');
  return n.length===14?n.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):String(v||'');
}
function ocupar(botao,sim){if(botao){botao.disabled=!!sim;}}

function telaLogin(msg,bom){
  pararInatividade();
  E.acesso=null;E.tentativas=0;
  publico('<form class="caixa" id="f-login" novalidate>'+
    '<div><h2>Entrar</h2><p class="apoio">Use o e-mail e a senha do seu acesso. Em seguida pediremos o código do autenticador.</p></div>'+
    (msg?'<p class="'+(bom?'sucesso':'erro')+'" role="alert">'+esc(msg)+'</p>':'')+
    '<div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>'+
    '<div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>'+
    '<button class="botao" type="submit">Continuar</button>'+
    '<button class="link" type="button" id="b-esqueci">Esqueci minha senha</button>'+
    '<p class="nota">Não há cadastro aberto. O acesso é criado por um usuário Master ou pelo responsável da sua organização. Este acesso registra IP, data e hora.</p>'+
  '</form>');
  var f=$('#f-login');
  $('#b-esqueci').onclick=function(){telaEsqueci($('#email').value);};
  f.onsubmit=async function(ev){
    ev.preventDefault();
    var email=$('#email').value.trim(),senha=$('#senha').value,b=$('button[type=submit]',f);
    if(!email||!senha){telaLoginErro('Informe e-mail e senha.');return;}
    ocupar(b,true);
    var r=await sb.auth.signInWithPassword({email:email,password:senha});
    if(r.error){ocupar(b,false);telaLoginErro(msgErro(r.error));return;}
    E.novoLogin=true;
    evento('Informou e-mail e senha','Acesso');
    await aposSenha();
  };
  function telaLoginErro(m){
    var p=$('.erro',f)||$('.sucesso',f);
    if(!p){p=document.createElement('p');p.setAttribute('role','alert');f.insertBefore(p,f.children[1]);}
    p.className='erro';p.textContent=m;
  }
}

function telaEsqueci(email){
  publico('<form class="caixa" id="f-esqueci" novalidate>'+
    '<div><h2>Redefinir senha</h2><p class="apoio">Informe o e-mail do seu acesso. Se ele existir, enviaremos um link para criar uma nova senha.</p></div>'+
    '<div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" value="'+esc(email||'')+'" required></div>'+
    '<button class="botao" type="submit">Enviar link</button>'+
    '<button class="link" type="button" id="b-voltar">Voltar para o login</button>'+
  '</form>');
  $('#b-voltar').onclick=function(){telaLogin();};
  $('#f-esqueci').onsubmit=async function(ev){
    ev.preventDefault();
    var em=$('#email').value.trim(),b=$('button[type=submit]',this);
    if(!em)return;
    ocupar(b,true);
    var r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});

  };
}

async function aposSenha(){
  var n=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(n.error){telaLogin(msgErro(n.error));return;}
  if(n.data&&n.data.currentLevel==='aal2'){await entrar();return;}
  var f=await sb.auth.mfa.listFactors();
  if(f.error){telaLogin(msgErro(f.error));return;}
  var verificados=(f.data&&f.data.totp)||[];
  if(verificados.length){telaCodigo(verificados[0].id);}
  else{await telaCadastro(((f.data&&f.data.all)||[]).filter(function(x){return x.status!=='verified';}));}
}

function telaCodigo(factorId){
  publico('<form class="caixa" id="f-codigo" novalidate>'+
    '<div><h2>Código do Google Authenticator</h2><p class="apoio">Abra o aplicativo no seu celular e informe o código de 6 dígitos da conta Celeiro Office.</p></div>'+
    '<p class="erro oculto" role="alert"></p>'+
    '<div class="campo"><label for="codigo">Código de 6 dígitos</label><input id="codigo" class="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>'+
    '<button class="botao" type="submit">Verificar e entrar</button>'+
    '<button class="link" type="button" id="b-sair">Voltar para o login</button>'+
    '<p class="nota">Perdeu o celular ou o autenticador? A redefinição é feita por um usuário Master, e fica registrada.</p>'+
  '</form>');
  var f=$('#f-codigo');
  $('#codigo').focus();
  $('#b-sair').onclick=function(){sair(true);};
  f.onsubmit=async function(ev){
    ev.preventDefault();
    var c=$('#codigo').value.replace(/\D/g,''),b=$('button[type=submit]',f),p=$('.erro',f);
    if(c.length!==6){p.textContent='Digite os 6 dígitos.';p.classList.remove('oculto');return;}
    ocupar(b,true);
    var r=await sb.auth.mfa.challengeAndVerify({factorId:factorId,code:c});
    if(r.error){
      E.tentativas++;
      evento('Código do autenticador recusado','Acesso',{tentativa:E.tentativas});
      if(E.tentativas>=MAX_TENTATIVAS){
        await sb.auth.signOut();
        telaLogin('Acesso encerrado após '+MAX_TENTATIVAS+' códigos incorretos. Entre de novo.');
        return;
      }
      ocupar(b,false);$('#codigo').value='';$('#codigo').focus();
      p.textContent=msgErro(r.error);p.classList.remove('oculto');
      return;
    }
    E.tentativas=0;
    await entrar();
  };
}

  if(r.error){telaLogin(msgErro(r.error));return;}
  var id=r.data.id,qr=r.data.totp.qr_code,chave=r.data.totp.secret;
  publico('<form class="caixa larga" id="f-cadastro" novalidate>'+
    '<div><h2>Cadastre o Google Authenticator</h2><p class="apoio">O segundo fator é obrigatório para todos os perfis. Sem ele, nenhuma tela do sistema é liberada.</p></div>'+
    '<p class="erro oculto" role="alert"></p>'+
    '<div class="qr"><img src="'+esc(qr)+'" alt="QR code para o Google Authenticator">'+
      '<div class="campo" style="flex:1 1 220px"><p><strong>1.</strong> Instale o Google Authenticator no celular.</p><p><strong>2.</strong> Adicione uma conta e leia o QR code. Se preferir, digite a chave:</p><p class="chave">'+esc(chave)+'</p></div></div>'+
    '<div class="campo"><label for="codigo"><strong>3.</strong> Digite o código de 6 dígitos que o aplicativo mostra</label><input id="codigo" class="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>'+
    '<button class="botao" type="submit">Ativar e entrar</button>'+
    '<button class="link" type="button" id="b-sair">Voltar para o login</button>'+
  '</form>');
  var f=$('#f-cadastro');
  $('#b-sair').onclick=function(){sair(true);};
  f.onsubmit=async function(ev){
    ev.preventDefault();
    var c=$('#codigo').value.replace(/\D/g,''),b=$('button[type=submit]',f),p=$('.erro',f);
    if(c.length!==6){p.textContent='Digite os 6 dígitos.';p.classList.remove('oculto');return;}
    ocupar(b,true);
    var v=await sb.auth.mfa.challengeAndVerify({factorId:id,code:c});
    if(v.error){ocupar(b,false);$('#codigo').value='';p.textContent=msgErro(v.error);p.classList.remove('oculto');return;}
    evento('Cadastrou o autenticador','Acesso');
    await entrar();
  };

function telaNovaSenha(){
  publico('<form class="caixa" id="f-nova" novalidate>'+
    '<div><h2>Criar nova senha</h2><p class="apoio">Use pelo menos 10 caracteres.</p></div>'+
    '<p class="erro oculto" role="alert"></p>'+
    '<div class="campo"><label for="s1">Nova senha</label><input id="s1" type="password" autocomplete="new-password" required></div>'+
    '<div class="campo"><label for="s2">Repita a nova senha</label><input id="s2" type="password" autocomplete="new-password" required></div>'+
    '<button class="botao" type="submit">Salvar senha</button>'+
  '</form>');
  var f=$('#f-nova');
  f.onsubmit=async function(ev){
    ev.preventDefault();
    var a=$('#s1').value,b2=$('#s2').value,b=$('button[type=submit]',f),p=$('.erro',f);
    function falha(m){p.textContent=m;p.classList.remove('oculto');}
    if(a.length<10){falha('A senha precisa ter pelo menos 10 caracteres.');return;}
    if(a!==b2){falha('As duas senhas não são iguais.');return;}
    ocupar(b,true);
    var r=await sb.auth.updateUser({password:a});
    if(r.error){ocupar(b,false);falha(msgErro(r.error));return;}
    E.recuperando=false;
    evento('Redefiniu a senha','Acesso');
    aviso('Senha alterada.');
    await entrar();
  };
}

/* ---------- entrada no sistema ---------- */
async function entrar(){
  if(E.recuperando){telaNovaSenha();return;}
  var r=await sb.rpc('meu_acesso');
  if(r.error){telaBloqueio('Não foi possível carregar seu acesso',msgErro(r.error));return;}
  var a=r.data||{};
  if(a.situacao==='sem_2fa'){
    var n=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(n.data&&n.data.currentLevel==='aal2'){telaBloqueio('Sessão não reconhecida','Saia e entre de novo.');return;}
    await aposSenha();return;
  }
  if(a.situacao==='email_pendente'){telaEmailPendente(a);return;}
  if(a.situacao==='sem_cadastro'){
    evento('Entrou sem perfil vinculado','Acesso');
    telaBloqueio('Acesso ainda não liberado','Seu e-mail e o autenticador estão corretos, mas o acesso ainda não foi vinculado a um perfil. Peça a um usuário Master ou ao responsável da sua organização.');
    return;
  }
  if(a.situacao!=='ok'){
    evento('Tentou entrar com acesso inativo','Acesso');
    telaBloqueio('Acesso inativo','Este acesso está desativado. Fale com um usuário Master ou com o responsável da sua organização.');
    return;
  }
  E.acesso=a;
  evento(E.novoLogin?'Entrou no sistema com segundo fator':'Retomou a sessão','Acesso');
  E.novoLogin=false;
  var m=await sb.from('modulos').select('*').order('ordem');
  E.modulos=m.error?[]:(m.data||[]);
  montarCasca();
  iniciarInatividade();
  rota();
}

async function sair(silencioso){
  pararInatividade();
  if(E.acesso){
    try{await sb.rpc('registrar_evento',{p_acao:'Saiu do sistema',p_modulo:'Acesso',p_detalhes:null});}catch(err){}
  }
  E.acesso=null;
  await sb.auth.signOut();
  if(location.hash){history.replaceState(null,'',location.pathname+location.search);}
  telaLogin(silencioso?'':'Você saiu do sistema.',true);
}

function pararInatividade(){clearTimeout(E.relogio);E.relogio=null;}
function iniciarInatividade(){
  pararInatividade();
  E.relogio=setTimeout(async function(){
    if(!E.acesso)return;
    try{await sb.rpc('registrar_evento',{p_acao:'Sessão encerrada por inatividade',p_modulo:'Acesso',p_detalhes:null});}catch(err){}
    E.acesso=null;
    await sb.auth.signOut();
    telaLogin('Sessão encerrada por inatividade. Entre de novo.');
  },INATIVIDADE_MS);
}
['click','keydown','touchstart','scroll'].forEach(function(t){
  window.addEventListener(t,function(){if(E.acesso)iniciarInatividade();},{passive:true,capture:true});
});

/* ---------- casca e rotas ---------- */
function temModulo(c){return !!E.acesso&&E.acesso.modulos.indexOf(c)>=0;}
function ehMaster(){return !!E.acesso&&E.acesso.perfil==='master';}
function ehCorpMaster(){return !!E.acesso&&E.acesso.perfil==='corp_master';}

function montarCasca(){
  var a=E.acesso,itens='';
  E.modulos.forEach(function(m){
    if(m.codigo==='auditoria'||!temModulo(m.codigo))return;
    if(PRONTOS[m.codigo]){itens+='<a href="#'+esc(m.codigo)+'" data-rota="'+esc(m.codigo)+'">'+esc(m.nome)+'</a>';return;}
    itens+='<a href="#m-'+esc(m.codigo)+'" data-rota="m-'+esc(m.codigo)+'">'+esc(m.nome)+'<span class="fase">fase '+esc(m.fase)+'</span></a>';
  });
  var adm='';
  if(ehMaster()||ehCorpMaster()){adm+='<a href="#modulos" data-rota="modulos">Módulos e permissões</a><a href="#usuarios" data-rota="usuarios">Usuários</a>';}
  if(ehMaster()){adm+='<a href="#organizacoes" data-rota="organizacoes">Organizações</a>';}
  if(temModulo('auditoria')){adm+='<a href="#auditoria" data-rota="auditoria">Auditoria</a>';}
  app.innerHTML=
  '<div class="casca">'+
    '<nav class="lateral" aria-label="Menu do sistema"><img src="'+RAIZ+'assets/logo-negativa.png" alt="Celeiro Administradora">'+
      '<div class="itens">'+itens+(adm?'<p class="grupo">Administração</p>'+adm:'')+'</div></nav>'+
    '<div class="conteudo">'+
      '<header class="topo"><p class="trilha" id="trilha"></p>'+
        '<div class="quem"><span class="chip">'+esc(PERFIS[a.perfil]||a.perfil)+'</span><span>'+esc(a.nome)+(a.organizacao?' · '+esc(a.organizacao):'')+'</span>'+
        (temModulo('workflow')?'<button class="botao ambar pequeno" type="button" id="b-nova-tarefa">Nova tarefa</button>':'')+
        '<a class="botao claro pequeno link-botao" href="#senha">Trocar senha</a>'+
        '<button class="botao claro pequeno" type="button" id="b-sair-topo">Sair</button></div></header>'+
      '<main class="tela" id="tela"></main>'+
    '</div>'+
  '</div>';
  $('#b-sair-topo').onclick=function(){sair(false);};
  if($('#b-nova-tarefa')){$('#b-nova-tarefa').onclick=function(){abrirTarefa(null,E.telaAtual||{});};}
}

  senha:{titulo:'Trocar senha',modulo:'Acesso',fn:telaSenha,pode:function(){return true;},semGrupo:true},
  workflow:{titulo:'Workflow',modulo:'Workflow',fn:telaWorkflow,pode:function(){return temModulo('workflow');},semGrupo:true},
  dashboard:{titulo:'Dashboard',modulo:'Dashboard',fn:telaDashboard,pode:function(){return temModulo('dashboard');},semGrupo:true},
  cadastro:{titulo:'Cadastro',modulo:'Cadastro',fn:telaCadPessoas,pode:function(){return temModulo('cadastro');},semGrupo:true},
  financeiro:{titulo:'Financeiro',modulo:'Financeiro',fn:telaFinanceiro,pode:function(){return temModulo('financeiro');},semGrupo:true},
  investimentos:{titulo:'Investimentos',modulo:'Investimentos',fn:telaInvestimentos,pode:function(){return temModulo('investimentos');},semGrupo:true},
  mcp:{titulo:'Conexão MCP',modulo:'Conexão MCP',fn:telaMcp,pode:function(){return temModulo('mcp');},semGrupo:true},
  app:{titulo:'Aplicativo',modulo:'Aplicativo',fn:telaApp,pode:function(){return temModulo('app');},semGrupo:true}
};

/* Primeira tela de cada pessoa: Dashboard, senão o primeiro módulo disponível.
   A página inicial antiga só aparece para quem não tem nenhuma tela para abrir. */
function rotaPadrao(){
  if(temModulo('dashboard'))return 'dashboard';
  var m=E.modulos.filter(function(x){return PRONTOS[x.codigo]&&ROTAS[x.codigo]&&temModulo(x.codigo);})[0];
  if(m)return m.codigo;
  if(ROTAS.usuarios.pode())return 'usuarios';
  return 'inicio';
}
function rota(){
  if(!E.acesso||!$('#tela'))return;
  var h=(location.hash||'#').slice(1)||rotaPadrao(),r=ROTAS[h],mod=null;
  if(h==='inicio'){h=rotaPadrao();r=ROTAS[h];}
  if(!r&&h.indexOf('m-')===0){
    mod=E.modulos.filter(function(m){return m.codigo===h.slice(2);})[0];
    if(mod&&temModulo(mod.codigo)&&!PRONTOS[mod.codigo]){r={titulo:mod.nome,modulo:mod.nome,fn:function(){telaPrevista(mod);},pode:function(){return true;}};}
  }
  if(!r||!r.pode()){h=rotaPadrao();r=ROTAS[h];}
  $$('.lateral a').forEach(function(l){if(l.getAttribute('data-rota')===h)l.setAttribute('aria-current','page');else l.removeAttribute('aria-current');});
  $('#trilha').textContent=(h==='inicio'||mod||r.semGrupo?'':'Administração / ')+r.titulo;
  document.title=r.titulo+' · Celeiro Office';
  E.telaAtual={origem:r.titulo,modulo:r.modulo};
  evento('Abriu a tela '+r.titulo,r.modulo);
  if(r.fn===telaUsuarios){telaUsuarios();}else{r.fn();}
}
window.addEventListener('hashchange',rota);

function tela(html){$('#tela').innerHTML=html;}
function carregando(titulo){tela('<h1>'+esc(titulo)+'</h1><p class="apoio">Carregando…</p>');}

  return '<button type="button" class="chave-sw" role="switch" aria-checked="'+(ligado?'true':'false')+'" aria-label="'+esc(rotulo)+'" '+dados+(desligada?' disabled':'')+'><span><i></i></span></button>';

function gerarSenha(){
  var abc='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789',v=new Uint32Array(14),s='';
  window.crypto.getRandomValues(v);
  for(var i=0;i<v.length;i++){s+=abc[v[i]%abc.length];}
  return s;
}
async function erroFuncao(e){
  var corpo=null;
  try{if(e&&e.context&&typeof e.context.json==='function'){corpo=await e.context.json();}}catch(err){}
  if(corpo&&corpo.erro)return corpo.erro;
  var st=e&&e.context&&e.context.status;
  if(st===404||/FunctionsFetchError|FunctionsRelayError/.test((e&&e.name)||'')||/Failed to send|not found/i.test((e&&e.message)||'')){
    return 'A função de criar usuários ainda não foi publicada no Supabase. Veja "Publicar a função criar-usuario" no LEIA-ME.';
  }
  if(st===401)return 'A função não aceitou a sua sessão. Saia, entre de novo e repita.';
  if(corpo&&corpo.message)return corpo.message;
  return msgErro(e);
}
function nomeModulo(c){
  var m=E.modulos.filter(function(x){return x.codigo===c;})[0];

}
function chipsModulos(lista,bloqueados){
  var h=(lista||[]).map(function(c){return '<span class="chipm">'+esc(nomeModulo(c))+'</span>';}).join('');

  return '<span class="chips">'+(h||'<span class="apoio">Nenhum módulo</span>')+'</span>';
}

async function telaUsuarios(op){
  op=op||{};
  carregando('Usuários');
  var rs=await Promise.all([
    sb.from('usuarios').select('*').order('nome'),
    sb.from('organizacoes').select('*').order('nome'),
    sb.from('niveis_permissao').select('*').order('nome'),
    sb.from('modulo_permissoes').select('*'),
    sb.rpc('usuarios_com_modulos')
  ]);
  for(var i=0;i<rs.length;i++){if(rs[i].error){falhaTela('Usuários',rs[i].error);return;}}
  var usuarios=rs[0].data||[],orgs=rs[1].data||[],niveis=rs[2].data||[],perms=rs[3].data||[],mods=rs[4].data||[];
  var master=ehMaster(),a=E.acesso;
  var nomeOrg={};orgs.forEach(function(o){nomeOrg[o.id]=o.nome;});
  var nivelPorId={};niveis.forEach(function(n){nivelPorId[n.id]=n;});
  var modsDe={};mods.forEach(function(m){modsDe[m.user_id]=m;});
  var ed=op.editar?usuarios.filter(function(u){return u.user_id===op.editar;})[0]:null;
  var edN=op.editarNivel?nivelPorId[op.editarNivel]:null;
  var vincular=!!op.vincular&&!ed;

  /* módulos que um perfil recebe, com ou sem nível */
  function basePerfil(perfil,org){
    return E.modulos.map(function(m){return m.codigo;}).filter(function(c){
      return perms.some(function(p){return p.perfil===perfil&&p.modulo===c&&p.habilitado&&(perfil==='gerencial'?p.organizacao_id===null:p.organizacao_id===org);});
    });
  }
  function previa(perfil,org,nivelId){
    if(perfil==='master')return {todos:true,modulos:[],bloqueados:[]};
    var base=basePerfil(perfil,org),n=nivelId?nivelPorId[nivelId]:null;
    if(!n)return {modulos:base,bloqueados:[]};
    return {modulos:base.filter(function(c){return n.modulos.indexOf(c)>=0;}),bloqueados:n.modulos.filter(function(c){return base.indexOf(c)<0;})};
  }
  function podeAlterar(u){return master||(u.perfil==='corp_operador'&&u.organizacao_id===a.organizacao_id);}

  /* ----- tabela de usuários ----- */

/* ---------- Trocar a própria senha ---------- */
function telaSenha(){
  tela('<div class="cabeca"><div><h1>Trocar senha</h1><p class="apoio">Use pelo menos 10 caracteres. A troca fica registrada na auditoria.</p></div></div>'+
    '<form class="painel" id="f-senha" novalidate style="max-width:460px">'+
    '<div class="campo"><label for="t-s1">Nova senha</label><input id="t-s1" type="password" autocomplete="new-password" required></div>'+
    '<div class="campo"><label for="t-s2">Repita a nova senha</label><input id="t-s2" type="password" autocomplete="new-password" required></div>'+
    '<button class="botao" type="submit">Salvar senha</button></form>');
  $('#f-senha').onsubmit=async function(ev){
    ev.preventDefault();
    var s1=$('#t-s1').value,s2=$('#t-s2').value,b=$('button[type=submit]',this);
    if(s1.length<10){aviso('A senha precisa ter pelo menos 10 caracteres.',true);return;}
    if(s1!==s2){aviso('As duas senhas não são iguais.',true);return;}
    ocupar(b,true);
    var r=await sb.auth.updateUser({password:s1});
    ocupar(b,false);
    if(r.error){aviso(msgErro(r.error),true);return;}
    evento('Trocou a própria senha','Acesso');
    $('#t-s1').value='';$('#t-s2').value='';
    aviso('Senha alterada.');
  };
}

/* ---------- Módulos e permissões ---------- */
async function telaModulos(orgEscolhida){
  carregando('Módulos e permissões');
  var rs=await Promise.all([sb.from('modulo_permissoes').select('*'),sb.from('organizacoes').select('*').order('nome')]);
  if(rs[0].error){falhaTela('Módulos e permissões',rs[0].error);return;}
  if(rs[1].error){falhaTela('Módulos e permissões',rs[1].error);return;}
  var perms=rs[0].data||[],orgs=rs[1].data||[],master=ehMaster(),a=E.acesso;
  var org=master?(orgEscolhida||''):a.organizacao_id;
  var colunas=master?(org?['corp_master','corp_operador']:['gerencial']):['corp_operador'];
  var mods=E.modulos.filter(function(m){return master||temModulo(m.codigo);});
  function ligado(perfil,modulo){
    return perms.some(function(p){return p.perfil===perfil&&p.modulo===modulo&&p.habilitado&&(perfil==='gerencial'?p.organizacao_id===null:p.organizacao_id===org);});
  }
  var linhas=mods.map(function(m){
    return '<tr><th scope="row">'+esc(m.nome)+'<span class="sub">'+(m.codigo==='auditoria'?'consulta ao histórico':'fase '+esc(m.fase))+'</span></th>'+
      colunas.map(function(p){

      (linhas||'<tr><td colspan="'+(colunas.length+1)+'" class="vazio">Nenhum módulo liberado para a sua organização.</td></tr>')+'</tbody></table></div>'+
    '<p class="nota">O registro em auditoria não pode ser desligado: toda ação é gravada. O que se habilita aqui é a consulta ao histórico. Clientes corporativos veem apenas a própria organização.</p>');

/* ---------- Workflow (tarefas em lista e em quadro) ---------- */
var WF={tarefas:[],orgs:[],visao:'lista',aba:'todas',busca:'',grupo:'status'};
var WF_STATUS=[['a_fazer','A fazer'],['em_andamento','Em andamento'],['em_revisao','Em revisão'],['concluida','Concluída']];
var WF_PRIOR=[['baixa','Baixa'],['media','Média'],['alta','Alta'],['urgente','Urgente']];
function rotuloDe(lista,c){var x=lista.filter(function(i){return i[0]===c;})[0];return x?x[1]:c;}
function isoLocal(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function hojeIso(){return isoLocal(new Date());}
function somaDias(n){var d=new Date();d.setDate(d.getDate()+n);return isoLocal(d);}
function dataBr(iso){if(!iso)return '';var p=String(iso).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function ehEquipe(){return !!E.acesso&&(E.acesso.perfil==='master'||E.acesso.perfil==='gerencial');}
function wfAberta(t){return t.status!=='concluida';}
function wfVencida(t){return wfAberta(t)&&!!t.prazo&&t.prazo<hojeIso();}
function wfPapel(t,papel){return t.participantes.some(function(p){return p.user_id===E.acesso.user_id&&p.papel===papel;});}
function wfResponsaveis(t){return t.participantes.filter(function(p){return p.papel==='responsavel';}).map(function(p){return p.nome;}).join(', ');}
var WF_ABAS=[
  ['todas','Todas',function(){return true;},'Todas as tarefas que você pode ver.'],
  ['pra_mim','Pra mim',function(t){return wfAberta(t)&&wfPapel(t,'responsavel');},'Tarefas em aberto em que você é o responsável.'],
  ['aguardando','Aguardando',function(t){return wfAberta(t)&&t.criado_por===E.acesso.user_id&&!wfPapel(t,'responsavel');},'Tarefas em aberto que você criou e estão com outra pessoa.'],
  ['nao_lidas','Não lidas',function(t){return !!t.nao_lida;},'Tarefas com novidade desde a última vez que você abriu.'],
  ['vencidas','Vencidas',wfVencida,'Tarefas em aberto com o prazo já passado.'],
  ['urgentes','Urgentes',function(t){return wfAberta(t)&&t.prioridade==='urgente';},'Tarefas em aberto com prioridade urgente.'],
  ['mencionado','Mencionado',function(t){return wfPapel(t,'envolvido');},'Tarefas em que você foi marcado como envolvido.']
];
function wfAba(){return WF_ABAS.filter(function(a){return a[0]===WF.aba;})[0]||WF_ABAS[0];}
function wfVisiveis(){
  var b=WF.busca.trim().toLowerCase(),f=wfAba()[2];
  return WF.tarefas.filter(function(t){
    return f(t)&&(!b||t.titulo.toLowerCase().indexOf(b)>=0||t.codigo.toLowerCase().indexOf(b)>=0);
  });
}
async function carregaTarefas(){
  var r=await sb.rpc('workflow_listar');
  if(r.error)return r.error;
  WF.tarefas=r.data||[];
  return null;
}

async function telaWorkflow(){
  carregando('Tarefas');
  var e=await carregaTarefas();
  if(e){falhaTela('Tarefas',e);return;}
  if(ehEquipe()){var o=await sb.from('organizacoes').select('*').order('nome');WF.orgs=o.error?[]:(o.data||[]);}
  desenhaWorkflow();
}

function desenhaWorkflow(){
  var abas=WF_ABAS.map(function(a){
    var n=WF.tarefas.filter(a[2]).length;
    return '<button type="button" class="aba" data-aba="'+a[0]+'" aria-pressed="'+(WF.aba===a[0]?'true':'false')+'">'+esc(a[1])+' <span class="conta">'+n+'</span></button>';
  }).join('');
  function seg(nome,valor,atual,rotulo){return '<button type="button" class="aba" data-'+nome+'="'+valor+'" aria-pressed="'+(atual===valor?'true':'false')+'">'+rotulo+'</button>';}
  tela('<div class="cabeca"><div><h1>Tarefas</h1><p class="apoio">Acompanhamento das tarefas da operação, com responsável e prazo.</p></div>'+
      '<div class="grade" style="align-items:center"><div class="segmento" role="group" aria-label="Forma de ver">'+seg('visao','lista',WF.visao,'Lista')+seg('visao','quadro',WF.visao,'Quadro')+'</div>'+
      '<button class="botao" type="button" id="wf-nova">Nova tarefa</button></div></div>'+
    '<div class="segmento rolavel" role="group" aria-label="Filtro de tarefas">'+abas+'</div>'+
    '<div class="grade" style="align-items:center">'+
      '<div class="campo" style="flex:999 1 260px"><label class="oculto-visual" for="wf-busca">Buscar</label><input id="wf-busca" type="text" placeholder="Buscar por título ou WF-0001" value="'+esc(WF.busca)+'"></div>'+
      (WF.visao==='lista'?'<div class="grade" style="align-items:center;flex:0 1 auto"><span class="apoio" style="font-size:13px">Agrupar por</span><div class="segmento" role="group" aria-label="Agrupar por">'+
        seg('grupo','status',WF.grupo,'Status')+seg('grupo','origem',WF.grupo,'Origem')+seg('grupo','nenhum',WF.grupo,'Nenhum')+'</div></div>':'')+
    '</div>'+
    '<p class="apoio" id="wf-explica" style="font-size:13px"></p>'+
    '<div id="wf-resultado"></div>');
  $('#wf-nova').onclick=function(){abrirTarefa(null);};
  $$('[data-aba]').forEach(function(b){b.onclick=function(){WF.aba=b.getAttribute('data-aba');desenhaWorkflow();};});
  $$('[data-visao]').forEach(function(b){b.onclick=function(){WF.visao=b.getAttribute('data-visao');desenhaWorkflow();};});
  $$('[data-grupo]').forEach(function(b){b.onclick=function(){WF.grupo=b.getAttribute('data-grupo');desenhaWorkflow();};});
  $('#wf-busca').oninput=function(){WF.busca=this.value;desenhaWfResultado();};
  desenhaWfResultado();
}

function wfSelos(t){
  return (t.nao_lida?'<span class="selo novo">Nova</span>':'')+
    (t.mencionado?'<span class="selo novo">@ Marcaram você</span>':'')+
    (t.prioridade==='urgente'&&wfAberta(t)?'<span class="selo urgente">Urgente</span>':'')+
    (t.confidencial?'<span class="selo">Confidencial</span>':'')+
    (ehEquipe()?'<span class="selo claro">'+esc(t.organizacao||'Celeiro')+'</span>':'');
}
function wfPrazoHtml(t){
  if(!t.prazo)return '<span class="apoio">Sem prazo</span>';
  return wfVencida(t)?'<span class="vencida">'+esc(dataBr(t.prazo))+' · vencida</span>':esc(dataBr(t.prazo));
}

function desenhaWfResultado(){
  var alvo=$('#wf-resultado');
  if(!alvo)return;
  var lista=wfVisiveis();
  $('#wf-explica').textContent=wfAba()[3]+' '+lista.length+(lista.length===1?' tarefa.':' tarefas.');
  if(!lista.length){alvo.innerHTML='<div class="rolagem"><p class="vazio">'+(WF.tarefas.length?'Nenhuma tarefa neste filtro.':'Nenhuma tarefa ainda. Crie a primeira em "Nova tarefa".')+'</p></div>';return;}
  if(WF.visao==='quadro'){
    alvo.innerHTML='<div class="quadro">'+WF_STATUS.map(function(s,i){
      var cs=lista.filter(function(t){return t.status===s[0];});
      return '<section class="coluna" data-coluna="'+s[0]+'" aria-label="'+esc(s[1])+'"><h2>'+esc(s[1])+' <span class="conta">'+cs.length+'</span></h2>'+
        cs.map(function(t){
          return '<article class="cartao-t" draggable="true" data-tarefa="'+esc(t.id)+'">'+
            '<button type="button" class="titulo-t" data-abrir="'+esc(t.id)+'"><span class="codigo">'+esc(t.codigo)+'</span> '+esc(t.titulo)+'</button>'+
            '<div class="chips">'+wfSelos(t)+'</div>'+
            '<p class="meta">'+esc(wfResponsaveis(t)||'Sem responsável')+'</p><p class="meta">'+wfPrazoHtml(t)+(t.comentarios?' · '+t.comentarios+(t.comentarios===1?' comentário':' comentários'):'')+(Number(t.anexos)?' · '+t.anexos+(Number(t.anexos)===1?' anexo':' anexos'):'')+'</p>'+
            '<div class="mover">'+(i>0?'<button type="button" class="botao claro pequeno" data-mover="'+esc(t.id)+'" data-para="'+WF_STATUS[i-1][0]+'" aria-label="Mover '+esc(t.codigo)+' para '+esc(WF_STATUS[i-1][1])+'">← '+esc(WF_STATUS[i-1][1])+'</button>':'')+
              (i<WF_STATUS.length-1?'<button type="button" class="botao claro pequeno" data-mover="'+esc(t.id)+'" data-para="'+WF_STATUS[i+1][0]+'" aria-label="Mover '+esc(t.codigo)+' para '+esc(WF_STATUS[i+1][1])+'">'+esc(WF_STATUS[i+1][1])+' →</button>':'')+'</div>'+
          '</article>';
        }).join('')+(cs.length?'':'<p class="meta" style="padding:8px">Nada aqui.</p>')+'</section>';
    }).join('')+'</div>';
    $$('.cartao-t',alvo).forEach(function(c){
      c.addEventListener('dragstart',function(ev){ev.dataTransfer.setData('text/plain',c.getAttribute('data-tarefa'));ev.dataTransfer.effectAllowed='move';});
    });
    $$('.coluna',alvo).forEach(function(col){
      col.addEventListener('dragover',function(ev){ev.preventDefault();col.classList.add('alvo');});
      col.addEventListener('dragleave',function(){col.classList.remove('alvo');});
      col.addEventListener('drop',function(ev){ev.preventDefault();col.classList.remove('alvo');var id=ev.dataTransfer.getData('text/plain');if(id)moverTarefa(id,col.getAttribute('data-coluna'));});
    });
    $$('[data-mover]',alvo).forEach(function(b){b.onclick=function(){ocupar(b,true);moverTarefa(b.getAttribute('data-mover'),b.getAttribute('data-para'));};});
  }else{
    var grupos=[];
    if(WF.grupo==='status'){WF_STATUS.forEach(function(s){grupos.push([s[1],lista.filter(function(t){return t.status===s[0];})]);});}
    else if(WF.grupo==='origem'){
      var nomes=[];lista.forEach(function(t){var n=t.modulo||'Sem módulo';if(nomes.indexOf(n)<0)nomes.push(n);});
      nomes.sort().forEach(function(n){grupos.push([n,lista.filter(function(t){return (t.modulo||'Sem módulo')===n;})]);});
    }else{grupos.push([null,lista]);}
    var corpo=grupos.filter(function(g){return g[1].length;}).map(function(g){
      return (g[0]===null?'':'<tr class="grupo-l"><th scope="colgroup" colspan="5">'+esc(g[0])+' <span class="conta">'+g[1].length+'</span></th></tr>')+
        g[1].map(function(t){
          return '<tr'+(wfVencida(t)?' class="alerta"':'')+'><td><button type="button" class="titulo-t" data-abrir="'+esc(t.id)+'"><span class="codigo">'+esc(t.codigo)+'</span> '+esc(t.titulo)+'</button><div class="chips" style="margin-top:4px">'+wfSelos(t)+'</div></td>'+
            '<td>'+esc(rotuloDe(WF_STATUS,t.status))+'<span class="sub">Prioridade '+esc(rotuloDe(WF_PRIOR,t.prioridade).toLowerCase())+'</span></td>'+
            '<td>'+esc(wfResponsaveis(t)||'—')+'</td><td>'+wfPrazoHtml(t)+'</td><td>'+esc(t.modulo||'—')+(t.categoria?'<span class="sub">'+esc(t.categoria)+'</span>':'')+'</td></tr>';
        }).join('');
    }).join('');
    alvo.innerHTML='<div class="rolagem"><table style="min-width:760px"><thead><tr><th scope="col">Título</th><th scope="col">Status</th><th scope="col">Responsável</th><th scope="col">Prazo</th><th scope="col">Módulo</th></tr></thead><tbody>'+corpo+'</tbody></table></div>';
  }
  $$('[data-abrir]',alvo).forEach(function(b){b.onclick=function(){var t=WF.tarefas.filter(function(x){return x.id===b.getAttribute('data-abrir');})[0];if(t)abrirTarefa(t);};});
}

async function moverTarefa(id,status){
  var t=WF.tarefas.filter(function(x){return x.id===id;})[0];
  if(!t||t.status===status){desenhaWfResultado();return;}
  var r=await sb.rpc('workflow_mover',{p_id:id,p_status:status});
  if(r.error){aviso(msgErro(r.error),true);desenhaWfResultado();return;}
  aviso(t.codigo+' movida para '+rotuloDe(WF_STATUS,status)+'.');
  await recarregaTelaDeTarefas();
}
async function recarregaTelaDeTarefas(){
  var h=(location.hash||'').slice(1);
  if(h==='workflow'){var e=await carregaTarefas();if(e){aviso(msgErro(e),true);return;}desenhaWorkflow();}
  else if(h==='dashboard'){telaDashboard();}
}

/* ----- janela da tarefa (criar, editar, comentar) ----- */
/* Mostra um anexo dentro do sistema, sem baixar: imagem, PDF e texto. Os demais tipos só podem ser baixados. */
function tipoAnexo(nome){
  var e=(/\.([A-Za-z0-9]+)$/.exec(nome||'')||[])[1];e=(e||'').toLowerCase();
  if(['png','jpg','jpeg','webp','gif'].indexOf(e)>=0)return {modo:'imagem',mime:e==='jpg'?'image/jpeg':'image/'+e};
  if(e==='pdf')return {modo:'pdf',mime:'application/pdf'};
  if(e==='txt'||e==='csv')return {modo:'texto',mime:'text/plain'};
  return {modo:'',mime:''};
}
async function verAnexo(x,codigo,baixar){
  var tp=tipoAnexo(x.nome),d=document.createElement('dialog'),url='';
  d.className='dlg dlg-anexo';d.id='dlg-anexo';d.setAttribute('aria-labelledby','dlg-anexo-titulo');
  d.innerHTML='<div class="dlg-topo"><h2 id="dlg-anexo-titulo">'+esc(x.nome)+'</h2><div class="fin-acoes"><button type="button" class="botao claro pequeno" id="va-baixar">Baixar</button><button type="button" class="botao claro pequeno" id="va-fechar">Fechar</button></div></div>'+
    '<div class="dlg-corpo" id="va-corpo"><p class="apoio">'+(tp.modo?'Carregando…':'Este tipo de arquivo não abre no navegador. Use Baixar para abrir no programa do seu computador.')+'</p></div>';
  document.body.appendChild(d);
  function fechar(){if(url)URL.revokeObjectURL(url);try{d.close();}catch(err){}d.remove();}
  $('#va-fechar',d).onclick=fechar;$('#va-baixar',d).onclick=function(){baixar(x);};
  d.addEventListener('cancel',function(ev){ev.preventDefault();ev.stopPropagation();fechar();});
  if(typeof d.showModal==='function'){d.showModal();}else{d.setAttribute('open','');}
  $('#va-fechar',d).focus();
  if(!tp.modo)return;
  var r=await sb.storage.from('workflow-anexos').download(x.caminho),corpo=$('#va-corpo',d);
  if(!d.isConnected)return;
  if(r.error||!r.data){corpo.innerHTML='<p class="erro">Não foi possível abrir o arquivo: '+esc((r.error&&r.error.message)||'tente de novo')+'</p>';return;}
  evento('Visualizou o anexo '+x.nome+' da tarefa '+codigo,'Workflow');
  if(tp.modo==='texto'){
    var txt=await r.data.text(),pre=document.createElement('pre');
    pre.className='va-texto';pre.textContent=txt.length>200000?txt.slice(0,200000)+'\n\n[…] O arquivo é maior do que o trecho mostrado. Baixe para ver tudo.':txt;
    corpo.innerHTML='';corpo.appendChild(pre);return;
  }
  url=URL.createObjectURL(new Blob([r.data],{type:tp.mime}));
  if(tp.modo==='imagem'){
    var img=document.createElement('img');img.className='va-imagem';img.alt=x.nome;img.src=url;
    corpo.innerHTML='';corpo.appendChild(img);
  }else{
    corpo.innerHTML='<iframe class="va-pdf" title="'+esc(x.nome)+'" src="'+url+'"></iframe><p class="meta">Se o PDF não aparecer aqui, <a href="'+url+'" target="_blank" rel="noopener">abra em outra aba</a>.</p>';
  }
}
async function abrirTarefa(t,ctx){
  ctx=ctx||{};
  var novo=!t,a=E.acesso,equipe=ehEquipe();
  var org=novo?(equipe?'':a.organizacao_id):(t.organizacao_id||'');
  if(equipe&&!WF.orgs.length){var o=await sb.from('organizacoes').select('*').order('nome');WF.orgs=o.error?[]:(o.data||[]);}
  var velho=$('#dlg-tarefa');if(velho)velho.remove();
  var d=document.createElement('dialog');
  d.id='dlg-tarefa';d.className='dlg';d.setAttribute('aria-labelledby','dlg-titulo');
  document.body.appendChild(d);

  var modulosOpc=[''].concat(E.modulos.map(function(m){return m.nome;}),['Usuários','Organizações','Módulos e permissões']);
  var moduloAtual=novo?(ctx.modulo&&modulosOpc.indexOf(ctx.modulo)>=0?ctx.modulo:''):t.modulo;
  if(modulosOpc.indexOf(moduloAtual)<0)modulosOpc.push(moduloAtual);
  var categorias=[];WF.tarefas.forEach(function(x){if(x.categoria&&categorias.indexOf(x.categoria)<0)categorias.push(x.categoria);});
  var prior=novo?'media':t.prioridade,prazo=novo?'':(t.prazo||'');
  var PRAZOS=[['hoje','Hoje',hojeIso()],['amanha','Amanhã',somaDias(1)],['48h','48h',somaDias(2)],['semana','1 semana',somaDias(7)],['sem','Sem prazo',''],['outra','Outra data',null]];
  function prazoAtivo(){var p=PRAZOS.filter(function(x){return x[2]!==null&&x[2]===prazo;})[0];return p?p[0]:'outra';}

  d.innerHTML='<form id="f-tarefa" novalidate>'+
    '<div class="dlg-topo"><h2 id="dlg-titulo">'+(novo?'Nova tarefa':esc(t.codigo))+'</h2><button type="button" class="botao claro pequeno" id="t-fechar" aria-label="Fechar">Fechar</button></div>'+
    '<div class="dlg-corpo">'+
    '<div class="campo"><label for="t-titulo">Título <span class="apoio" id="t-conta"></span></label><input id="t-titulo" type="text" maxlength="500" value="'+esc(novo?'':t.titulo)+'" required></div>'+
    '<div class="campo"><label for="t-desc">Descrição (opcional)</label><textarea id="t-desc" rows="3" maxlength="4000">'+esc(novo?'':t.descricao)+'</textarea></div>'+
    '<div class="campo"><span class="rotulo" id="r-prior">Prioridade</span><div class="segmento" role="group" aria-labelledby="r-prior">'+
      WF_PRIOR.map(function(p){return '<button type="button" class="aba" data-prior="'+p[0]+'" aria-pressed="'+(prior===p[0]?'true':'false')+'">'+p[1]+'</button>';}).join('')+'</div></div>'+
    '<div class="grade">'+
      (novo?'':'<div class="campo"><label for="t-status">Status</label><select id="t-status">'+WF_STATUS.map(function(s){return '<option value="'+s[0]+'"'+(t.status===s[0]?' selected':'')+'>'+s[1]+'</option>';}).join('')+'</select></div>')+
      '<div class="campo"><label for="t-modulo">Módulo</label><select id="t-modulo">'+modulosOpc.map(function(m){return '<option value="'+esc(m)+'"'+(m===moduloAtual?' selected':'')+'>'+esc(m||'Nenhum')+'</option>';}).join('')+'</select></div>'+
      '<div class="campo"><label for="t-cat">Categoria</label><input id="t-cat" type="text" maxlength="80" list="t-cats" value="'+esc(novo?'':t.categoria)+'"><datalist id="t-cats">'+categorias.map(function(c){return '<option value="'+esc(c)+'">';}).join('')+'</datalist></div>'+
    '</div>'+
    '<div class="campo"><span class="rotulo" id="r-prazo">Prazo</span><div class="segmento rolavel" role="group" aria-labelledby="r-prazo">'+
      PRAZOS.map(function(p){return '<button type="button" class="aba" data-prazo="'+p[0]+'">'+p[1]+'</button>';}).join('')+'</div>'+

  async function anexar(arq,tarefaId){

    if(!arq.size)return arq.name+': arquivo vazio';
    var r=await sb.rpc('workflow_anexo_registrar',{p_tarefa:tarefaId,p_nome:arq.name,p_tipo:arq.type||'',p_tamanho:arq.size});
    if(r.error)return arq.name+': '+msgErro(r.error);
    var up=await sb.storage.from('workflow-anexos').upload(r.data.caminho,arq,{contentType:arq.type||'application/octet-stream',upsert:false});
    if(up.error){await sb.rpc('workflow_anexo_excluir',{p_id:r.data.id});return arq.name+': '+(up.error.message||'falha no envio');}
    var c=await sb.rpc('workflow_anexo_confirmar',{p_id:r.data.id});
    if(c.error){await sb.storage.from('workflow-anexos').remove([r.data.caminho]);await sb.rpc('workflow_anexo_excluir',{p_id:r.data.id});return arq.name+': '+msgErro(c.error);}

/* ---------- Conexão MCP (assistentes de IA ligados ao sistema) ---------- */
var MCP={org:'',token:null};
function mcpEndereco(){return String(cfg.url||'').replace(/\/+$/,'')+'/functions/v1/mcp';}
function mcpSituacao(c){
  if(c.revogada_em)return ['Revogada',' off'];
  if(new Date(c.expira_em)<=new Date())return ['Expirada',' off'];
  return ['Ativa',''];
}
function mcpCopiar(texto,oque){
  function ok(){aviso(oque+' copiado.');}
  function falha(){aviso('Não foi possível copiar. Selecione o texto e copie manualmente.',true);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(texto).then(ok,falha);}else{falha();}
}
function mcpLinhaConexao(c,comDono){
  var s=mcpSituacao(c),u=c.ultimo_uso?dataHora(c.ultimo_uso):null;
  return '<tr><td>'+esc(c.nome)+'<span class="sub">'+esc(c.prefixo)+'…</span></td>'+
    (comDono?'<td>'+esc(c.usuario)+'<span class="sub">'+esc(c.organizacao||'Equipe Celeiro')+'</span></td>':'')+
    '<td>'+(c.escrita?'Leitura e gravação':'Somente leitura')+'</td>'+
    '<td>'+esc(dataBr(c.expira_em))+'</td>'+
    '<td>'+(u?esc(u.data)+'<span class="sub">'+esc(u.hora)+' · '+esc(c.chamadas)+' chamadas</span>':'Nunca usada')+'</td>'+
    '<td><span class="situacao'+s[1]+'">'+s[0]+'</span></td>'+
    '<td>'+(s[0]==='Ativa'?'<button class="botao claro pequeno" type="button" data-revogar="'+esc(c.id)+'" data-nome="'+esc(c.nome)+'">Revogar</button>':'')+'</td></tr>';
}

var FIN={aba:'dashboard',org:'',ini:'',fim:'',plano:[],planoDe:null,orgs:null,pessoas:null,pessoasDe:null,campo:'vencimento',status:'todos'};
var FIN_ABAS=[['dashboard','Dashboard'],['receber','Contas a receber'],['pagar','Contas a pagar'],['projetado','Fluxo projetado'],['realizado','Fluxo realizado'],['dre','DRE'],['balanco','Balanço'],['balancete','Balancete'],['cobrancas','Cobranças e notas'],['plano','Plano de contas']];
var FIN_TIPOS=[['ativo','Ativo'],['passivo','Passivo'],['patrimonio','Patrimônio líquido'],['receita','Receita'],['custo','Custo'],['despesa','Despesa']];
var FIN_FORMAS=[['','Não informada'],['pix','Pix'],['boleto','Boleto'],['transferencia','Transferência'],['cartao','Cartão'],['dinheiro','Dinheiro'],['outro','Outro']];
function moeda(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function valorDe(txt){
  var s=String(txt==null?'':txt).replace(/[R$\s]/g,'');
  if(s.indexOf(',')>=0){s=s.replace(/\./g,'').replace(',','.');}
  return s===''||isNaN(Number(s))?NaN:Number(s);
}
function finOrg(){return ehEquipe()?(FIN.org||null):E.acesso.organizacao_id;}
function finMes(d){return [isoLocal(new Date(d.getFullYear(),d.getMonth(),1)),isoLocal(new Date(d.getFullYear(),d.getMonth()+1,0))];}
function finAtalho(k){
  var h=new Date(),p;
  if(k==='mes'){p=finMes(h);}
  else if(k==='mes_passado'){p=finMes(new Date(h.getFullYear(),h.getMonth()-1,1));}
  else if(k==='proximo_mes'){p=finMes(new Date(h.getFullYear(),h.getMonth()+1,1));}
  else if(k==='30'){p=[somaDias(-29),hojeIso()];}
  else if(k==='90'){p=[hojeIso(),somaDias(90)];}
  else if(k==='ano'){p=[h.getFullYear()+'-01-01',h.getFullYear()+'-12-31'];}
  else if(k==='ano_passado'){p=[(h.getFullYear()-1)+'-01-01',(h.getFullYear()-1)+'-12-31'];}
  if(p){FIN.ini=p[0];FIN.fim=p[1];}
}
function finContas(f){return FIN.plano.filter(function(c){return !c.grupo&&c.ativo&&f(c);});}
function finOpcoes(f,sel){
  return '<option value="">Escolha</option>'+finContas(f).map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===sel?' selected':'')+'>'+esc(c.codigo+' '+c.nome)+'</option>';}).join('');
}
function finDlg(titulo,corpo,rodape,largo){

  document.body.appendChild(d);
  d.fechar=function(){if(d.open&&d.close)d.close();d.remove();};
  $('[data-fechar]',d).onclick=d.fechar;
  d.addEventListener('cancel',function(){setTimeout(function(){d.remove();},0);});

}
function finCartao(rotulo,valor,apoio,classe){
  return '<div class="cartao-d baixo"><div class="cartao-d-topo"><span>'+esc(rotulo)+'</span></div><div class="numero'+(classe?' '+classe:'')+'">'+esc(valor)+'</div>'+(apoio?'<p class="apoio">'+esc(apoio)+'</p>':'')+'</div>';
}
function finBarras(grupos,series,fmt){
  fmt=fmt||moeda;
  var topo=4;grupos.forEach(function(g){g.v.forEach(function(x){if(x>topo)topo=x;});});
  var L=64,T=12,W=640,H=230,AW=W-L-8,AH=H-T-30,passo=AW/grupos.length,bw=Math.min(34,(passo-14)/series.length),svg='';
  for(var i=0;i<=4;i++){
    var y=T+AH-AH*i/4;
    svg+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#D5DED9" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#44564E">'+esc(Math.round(topo*i/4).toLocaleString('pt-BR'))+'</text>';
  }
  grupos.forEach(function(g,k){
    var x0=L+k*passo+(passo-bw*series.length-2*(series.length-1))/2;
    g.v.forEach(function(x,j){
      var h=Math.max(x>0?2:0,AH*x/topo);
      svg+='<rect x="'+(x0+j*(bw+2))+'" y="'+(T+AH-h)+'" width="'+bw+'" height="'+h+'" rx="2" fill="'+series[j][1]+'"><title>'+esc(g.r+' · '+series[j][0]+': '+fmt(x))+'</title></rect>';
    });
    svg+='<text x="'+(L+k*passo+passo/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="#44564E">'+esc(g.r)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de barras: '+esc(series.map(function(s){return s[0];}).join(' e '))+'" style="width:100%;height:auto">'+svg+'</svg>'+
    '<p class="meta">'+series.map(function(s){return '<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+s[1]+';margin-right:6px"></span>'+esc(s[0]);}).join(' &nbsp; ')+'</p>';
}
function finLinha(pontos,rotulo){
  if(pontos.length<2)return '';
  var min=0,max=1;pontos.forEach(function(p){if(p.v<min)min=p.v;if(p.v>max)max=p.v;});
  var L=64,T=12,W=640,H=200,AW=W-L-8,AH=H-T-28,svg='',pts=[];
  function Y(v){return T+AH-AH*(v-min)/(max-min);}
  for(var i=0;i<=4;i++){
    var v=min+(max-min)*i/4,y=Y(v);
    svg+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#D5DED9" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#44564E">'+esc(Math.round(v).toLocaleString('pt-BR'))+'</text>';
  }
  if(min<0)svg+='<line x1="'+L+'" y1="'+Y(0)+'" x2="'+(W-8)+'" y2="'+Y(0)+'" stroke="#B3261E" stroke-width="1" stroke-dasharray="4 3"/>';
  pontos.forEach(function(p,k){pts.push((L+AW*k/(pontos.length-1))+','+Y(p.v));});
  svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#0F3D2E" stroke-width="2.5" stroke-linejoin="round"/>';
  [0,pontos.length-1].forEach(function(k){
    svg+='<text x="'+(L+AW*k/(pontos.length-1))+'" y="'+(H-8)+'" text-anchor="'+(k?'end':'start')+'" font-size="11" fill="#44564E">'+esc(pontos[k].r)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(rotulo)+'" style="width:100%;height:auto">'+svg+'</svg>';
}

/* saldo de uma conta: devedora (ativo, custo, despesa) = débitos − créditos; credora = créditos − débitos */
function finDev(c){return c.tipo==='ativo'||c.tipo==='custo'||c.tipo==='despesa';}
function finSaldos(contas){
  contas.forEach(function(c){
    var filhos=c.grupo?contas.filter(function(x){return !x.grupo&&x.codigo.indexOf(c.codigo+'.')===0;}):[c];
    c.s={ant_d:0,ant_c:0,per_d:0,per_c:0};
    filhos.forEach(function(x){['ant_d','ant_c','per_d','per_c'].forEach(function(k){c.s[k]+=Number(x[k]);});});
    var sinal=finDev(c)?1:-1;
    c.anterior=sinal*(c.s.ant_d-c.s.ant_c);c.periodo=sinal*(c.s.per_d-c.s.per_c);c.final=c.anterior+c.periodo;
  });
  return contas;
}
function finNivel(c){return c.codigo.split('.').length-1;}
async function finDre(c){
  var b=await finRpc('fin_balancete',finPeriodo()),contas=finSaldos(b.contas||[]);
  function bloco(tipo){return contas.filter(function(x){return x.tipo===tipo&&!x.grupo&&Math.abs(x.periodo)>0.004;});}
  function soma(l){return l.reduce(function(s,x){return s+x.periodo;},0);}
  var rec=bloco('receita'),cus=bloco('custo'),des=bloco('despesa'),tr=soma(rec),tc=soma(cus),td=soma(des),bruto=tr-tc,res=bruto-td;
  function linhas(l,menos){return l.map(function(x){return '<tr><td style="padding-left:32px">'+esc(x.codigo+' '+x.nome)+'</td><td class="num">'+(menos?'− ':'')+esc(moeda(x.periodo))+'</td><td class="num">'+(tr?esc((100*x.periodo/tr).toFixed(1).replace('.',','))+'%':'')+'</td></tr>';}).join('');}
  function tot(r,v,cl){return '<tr class="'+cl+'"><td>'+esc(r)+'</td><td class="num'+(v<0?' neg':'')+'">'+esc(moeda(v))+'</td><td class="num">'+(tr?esc((100*v/tr).toFixed(1).replace('.',','))+'%':'')+'</td></tr>';}
  c.innerHTML='<div class="cabeca"><div><h2>DRE: demonstração do resultado</h2><p class="apoio">Por competência, de '+esc(finPeriodoTexto())+'. A coluna % compara cada linha com a receita.</p></div></div>'+
    '<div class="grade-d">'+finCartao('Receita',moeda(tr))+finCartao('Custos',moeda(tc))+finCartao('Despesas',moeda(td))+finCartao('Resultado',moeda(res),tr?'Margem de '+(100*res/tr).toFixed(1).replace('.',',')+'%':'',res<0?'neg':'')+'</div>'+
    '<div class="rolagem"><table id="fin-dre"><thead><tr><th scope="col">Conta</th><th scope="col" class="num">Valor</th><th scope="col" class="num">% da receita</th></tr></thead><tbody>'+
      tot('Receita',tr,'grupo')+linhas(rec)+tot('(−) Custos',-tc,'grupo')+linhas(cus,true)+tot('(=) Lucro bruto',bruto,'total')+
      tot('(−) Despesas',-td,'grupo')+linhas(des,true)+tot('(=) Resultado do período',res,'total')+'</tbody></table></div>';
}

function invDoc(tipo,doc){var d=String(doc||'');return tipo==='pj'?formataCnpj(d):d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4');}
function invLink(codigo){return location.origin+RAIZ+'indicacao/?c='+codigo;}
function invSelo(st){return '<span class="'+(st==='captando'?'situacao':st==='rascunho'?'selo claro':'situacao off')+'">'+esc(rotuloDe(INV_STATUS,st))+'</span>';}
function invProgresso(captado,meta){
  var p=Number(meta)>0?100*Number(captado)/Number(meta):0;
  return '<div class="fin-faixa"><div class="fin-faixa-barra" role="img" aria-label="'+esc(pct(p,1))+' da meta arrecadado"><i style="width:'+Math.min(100,Math.max(p>0?2:0,p))+'%"></i></div><span class="sub">'+esc(pct(p,1))+' da meta</span></div>';
}
async function invRpc(fn,args){var r=await sb.rpc(fn,args);if(r.error)throw r.error;return r.data;}
function invPeriodoTexto(){return dataBr(INV.ini)+' a '+dataBr(INV.fim);}
function invConfirma(b,rotulo,acao){
  b.onclick=async function(){
    if(b.getAttribute('data-confirma')!=='1'){
      var antes=b.textContent;b.setAttribute('data-confirma','1');b.textContent=rotulo;
      setTimeout(function(){if(b.isConnected){b.removeAttribute('data-confirma');b.textContent=antes;}},5000);return;
    }
    ocupar(b,true);
    try{await acao();}catch(e){ocupar(b,false);aviso(msgErro(e),true);}
  };
}
async function telaInvestimentos(){

    '<div class="segmento rolavel" role="group" aria-label="Menus de Investimentos">'+INV_ABAS.map(function(a){return '<button type="button" class="aba" data-inv-aba="'+a[0]+'" aria-pressed="'+(INV.aba===a[0])+'">'+a[1]+'</button>';}).join('')+'</div>'+
    '<form class="painel" id="inv-filtro" novalidate><div class="grade">'+
      (ehEquipe()?'<div class="campo" style="flex:1 1 220px"><label for="inv-org">Projetos de</label><select id="inv-org"><option value="">Celeiro Administradora</option>'+
        (INV.orgs||[]).map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===INV.org?' selected':'')+'>'+esc(x.nome)+(x.ativo?'':' (inativa)')+'</option>';}).join('')+'</select></div>':'')+
      '<div class="campo" data-inv-ini style="flex:0 1 170px"><label for="inv-ini">De</label><input id="inv-ini" type="date" value="'+esc(INV.ini)+'"></div>'+
      '<div class="campo" data-inv-fim style="flex:0 1 170px"><label for="inv-fim" id="inv-fim-r">Até</label><input id="inv-fim" type="date" value="'+esc(INV.fim)+'"></div>'+
      '<button class="botao" type="submit" data-inv-fim>Pesquisar</button></div></form>'+
    '<div id="inv-corpo" class="pilha"></div>');
  $$('[data-inv-aba]').forEach(function(b){b.onclick=function(){INV.aba=b.getAttribute('data-inv-aba');INV.projeto=null;$$('[data-inv-aba]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});invDesenha();};});
  if($('#inv-org')){$('#inv-org').onchange=function(){INV.org=this.value;INV.pessoas=null;INV.projeto=null;invDesenha();};}
  $('#inv-filtro').onsubmit=function(ev){
    ev.preventDefault();
    var i=$('#inv-ini').value,f=$('#inv-fim').value;
    if(INV.aba==='comparativo'){
      if(!f){aviso('Informe a data.',true);return;}

    INV.ini=i;INV.fim=f;invDesenha();

async function invDesenha(){
  var c=$('#inv-corpo');if(!c)return;
  var comPeriodo=INV.aba==='dashboard'||INV.aba==='comissoes',soData=INV.aba==='comparativo';
  $('#inv-filtro').classList.toggle('oculto',!comPeriodo&&!soData&&!ehEquipe());
  $$('[data-inv-ini]').forEach(function(x){x.classList.toggle('oculto',!comPeriodo);});
  $$('[data-inv-fim]').forEach(function(x){x.classList.toggle('oculto',!comPeriodo&&!soData);});
  $('#inv-fim-r').textContent=soData?'Posição em':'Até';
  $('#inv-fim').value=soData?INV.ate:INV.fim;
  c.innerHTML='<p class="apoio">Carregando…</p>';
  var fn={dashboard:invDashboard,projetos:invProjetos,investidores:invInvestidores,comparativo:invComparativo,indicadores:invIndicadores,indicacoes:invIndicacoes,comissoes:invComissoes}[INV.aba];
  try{await fn(c);}catch(e){c.innerHTML='<p class="erro" role="alert">'+esc(msgErro(e))+'</p>';}
}
function invIr(aba){INV.aba=aba;INV.projeto=null;$$('[data-inv-aba]').forEach(function(x){x.setAttribute('aria-pressed',x.getAttribute('data-inv-aba')===aba?'true':'false');});invDesenha();}

      '<div class="campo"><label for="ip-prazo">Prazo (meses)</label><input id="ip-prazo" type="text" inputmode="numeric" value="'+esc(p.prazo_meses||'')+'"></div></div>'+
    '<div class="grade"><div class="campo"><label for="ip-ini">Início da captação</label><input id="ip-ini" type="date" value="'+esc(p.inicio||'')+'"></div>'+
      '<div class="campo"><label for="ip-fim">Fim da captação</label><input id="ip-fim" type="date" value="'+esc(p.fim_captacao||'')+'"></div></div>'+
    '<div class="campo"><label for="ip-desc">Descrição do projeto</label><textarea id="ip-desc" rows="4" maxlength="4000">'+esc(p.descricao||'')+'</textarea></div>'+
    '<div class="campo"><span class="rotulo">Quem está envolvido</span><div class="rolagem"><table id="ip-env"><thead><tr><th scope="col">Nome</th><th scope="col">Papel</th><th scope="col">Contato</th><th scope="col"></th></tr></thead><tbody>'+
      ((p.envolvidos||[]).map(invEnvolvidoLinha).join('')||invEnvolvidoLinha())+'</tbody></table></div>'+
      '<button class="botao claro pequeno" type="button" id="ip-env-mais" style="align-self:flex-start">Adicionar envolvido</button></div>',
    '<button class="botao" type="submit">Salvar projeto</button>',true);
  $('#ip-env-mais',d).onclick=function(){$('#ip-env tbody',d).insertAdjacentHTML('beforeend',invEnvolvidoLinha());};
  $('#ip-env',d).addEventListener('click',function(ev){var b=ev.target.closest('[data-ev-tirar]');if(b){b.closest('tr').remove();}});
  $('form',d).onsubmit=async function(ev){
    ev.preventDefault();
    var b=$('button[type=submit]',d),meta=valorDe($('#ip-meta',d).value),taxa=$('#ip-taxa',d).value.trim()===''?0:valorDe($('#ip-taxa',d).value);
    if(!$('#ip-nome',d).value.trim()){aviso('Informe o nome do projeto.',true);return;}
    if(!(meta>0)){aviso('Informe o valor a ser arrecadado.',true);return;}
    if(isNaN(taxa)||taxa<0){aviso('Confira a taxa de retorno esperada.',true);return;}
    ocupar(b,true);
    var r=await sb.rpc('inv_projeto_salvar',{p_id:novo?null:p.id,p_org:invOrg(),p_dados:{nome:$('#ip-nome',d).value,produto:$('#ip-produto',d).value,status:$('#ip-status',d).value,

    if(r.error){ocupar(b,false);aviso(msgErro(r.error),true);return;}
    d.fechar();aviso(novo?'Projeto criado.':'Projeto salvo.');
    if(novo){INV.projeto=r.data;}
    invDesenha();
  };
  $('#ip-nome',d).focus();
}
