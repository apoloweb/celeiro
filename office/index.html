<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Celeiro Office</title>
<script>
/* Raiz do sistema: funciona em /office, /office/ e na raiz do subdomínio */
(function(){var p=location.pathname.replace(/[^\/]*\.html$/,'');if(p.charAt(p.length-1)!=='/')p+='/';window.CELEIRO_OFFICE_RAIZ=p;
document.write('<link rel="icon" href="'+p+'assets/favicon.png">');})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#0F3D2E;--verde2:#1B5A45;--ambar:#E3A72F;--nevoa:#F4F6F3;--linha:#D5DED9;--borda:#9FB0A8;--texto2:#44564E;--branco:#FFFFFF;--erro:#9B1C1C;--erro-fundo:#FDECEC;--alerta-fundo:#FBF1DC}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Sora',system-ui,sans-serif;color:var(--verde);background:var(--nevoa);font-size:15px;line-height:1.5}
h1,h2,h3,p{margin:0}
a{color:var(--verde)}
button,input,select{font-family:inherit;font-size:15px;color:var(--verde)}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
.oculto{display:none!important}

/* telas públicas */
.publico{min-height:100vh;display:flex;flex-wrap:wrap}
.publico .marca{flex:1 1 440px;background:var(--verde);color:var(--nevoa);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.publico .marca img{width:240px;height:auto}
.publico .marca .olho{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--ambar);font-weight:600}
.publico .marca h1{font-size:36px;line-height:1.15;font-weight:600;max-width:460px;margin-top:16px}
.publico .marca ul{margin:20px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;color:#D5DED9}
.publico .marca li{display:flex;gap:12px;align-items:flex-start}
.publico .marca li::before{content:"";flex:none;width:14px;height:8px;margin-top:8px;background:var(--ambar);transform:skewX(-30deg)}
.publico .marca .rodape{font-size:13px;color:#B9C7C0}
.publico .lado{flex:1 1 420px;padding:48px 24px;display:flex;align-items:center;justify-content:center}
.caixa{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px}
.caixa.larga{max-width:560px}
.caixa h2{font-size:26px;font-weight:600;line-height:1.25}
.caixa .apoio,.apoio{color:var(--texto2)}
.nota{font-size:13px;line-height:1.6;color:var(--texto2);padding-top:18px;border-top:1px solid var(--linha)}

/* formulários */
.campo{display:flex;flex-direction:column;gap:8px}
.campo label,.campo .rotulo{font-size:14px;font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=date],select{height:48px;padding:0 14px;border:1px solid var(--borda);border-radius:8px;background:var(--branco);width:100%}
input.codigo{font-size:24px;font-weight:600;letter-spacing:.35em;text-align:center;height:60px}
.botao{height:48px;padding:0 22px;border:0;border-radius:8px;background:var(--verde);color:var(--nevoa);font-weight:600;cursor:pointer}
.botao:hover{background:var(--verde2)}
.botao[disabled]{opacity:.6;cursor:wait}
.botao.ambar{background:var(--ambar);color:var(--verde)}
.botao.claro{background:var(--branco);color:var(--verde);border:1px solid var(--verde)}
.botao.pequeno{height:44px;padding:0 14px;font-size:14px}
.link-botao{display:inline-flex;align-items:center;text-decoration:none}
.link{background:none;border:0;padding:0;color:var(--verde);text-decoration:underline;cursor:pointer;font-size:14px;min-height:44px;text-align:left}
.erro{background:var(--erro-fundo);color:var(--erro);border:1px solid #F0B4B4;border-radius:8px;padding:12px 14px;font-size:14px}
.sucesso{background:#E4F1EA;color:var(--verde);border:1px solid #B5D3C4;border-radius:8px;padding:12px 14px;font-size:14px}
.qr{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.qr img{width:200px;height:200px;border:1px solid var(--linha);border-radius:12px;background:var(--branco);padding:8px}
.qr .chave{font-size:14px;letter-spacing:.06em;word-break:break-all;padding:10px 12px;border:1px solid var(--linha);border-radius:8px;background:var(--branco)}

/* sistema */
.casca{min-height:100vh;display:flex;flex-wrap:wrap}
.lateral{flex:1 0 230px;max-width:100%;background:var(--verde);color:var(--nevoa);padding:24px 16px;display:flex;flex-direction:column;gap:20px}
.lateral img{width:180px;height:auto}
.lateral .itens{display:flex;flex-direction:column;gap:2px}
.lateral a{display:block;padding:12px;border-radius:8px;color:var(--nevoa);text-decoration:none;font-size:14px}
.lateral a:hover{background:rgba(255,255,255,.08)}
.lateral a[aria-current=page]{background:var(--verde2);font-weight:600}
.lateral .grupo{margin:16px 12px 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ambar);font-weight:600}
.lateral .fase{font-size:11px;color:#B9C7C0;margin-left:6px}
.conteudo{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.topo{padding:14px 28px;background:var(--branco);border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.topo .trilha{font-size:14px;color:var(--texto2)}
.topo .quem{display:flex;align-items:center;gap:12px;font-size:14px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:6px;background:var(--verde);color:var(--ambar);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
main.tela{padding:28px;display:flex;flex-direction:column;gap:22px;width:100%}
main.tela h1{font-size:26px;font-weight:600}
.cabeca{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.cabeca > div{display:flex;flex-direction:column;gap:6px;max-width:680px}
.painel{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.painel h2{font-size:17px;font-weight:600}
.grade{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.grade .campo{flex:1 1 180px}
.cartoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;text-decoration:none}
.cartao strong{font-size:16px}
.cartao span{font-size:13px;color:var(--texto2)}
.rolagem{overflow-x:auto;background:var(--branco);border:1px solid var(--linha);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 14px;text-align:left;vertical-align:top}
thead th{background:var(--nevoa);font-weight:600;white-space:nowrap}
tbody tr{border-top:1px solid var(--linha)}
tr.alerta{background:var(--alerta-fundo)}
td .sub{display:block;font-size:12px;color:var(--texto2)}
.vazio{padding:28px;text-align:center;color:var(--texto2)}
.chave-sw{width:52px;height:44px;padding:8px 0;border:0;background:none;cursor:pointer}
.chave-sw span{display:flex;width:48px;height:28px;padding:3px;border-radius:14px;background:#B9C7C0;justify-content:flex-start}
.chave-sw span i{width:22px;height:22px;border-radius:11px;background:var(--branco)}
.chave-sw[aria-checked=true] span{background:var(--verde);justify-content:flex-end}
.chave-sw[aria-checked=true] span i{background:var(--ambar)}
.chave-sw[disabled]{opacity:.5;cursor:not-allowed}
.situacao{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;background:#E4F1EA;color:var(--verde)}
.situacao.off{background:#E8E8E8;color:#4A4A4A}
.chips{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle}
.chipm{padding:3px 9px;border-radius:6px;background:#E4F1EA;color:var(--verde);font-size:12px;font-weight:500;white-space:nowrap}
.chipm.bloq{background:var(--alerta-fundo);color:#7A5400}
.previa{padding:12px 14px;border-radius:8px;background:var(--nevoa);font-size:14px;line-height:1.9}
.previa .sub{display:block;font-size:12px;color:var(--texto2);line-height:1.5}
.caixas{display:flex;flex-wrap:wrap;gap:8px 18px}
.caixa-mod{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;cursor:pointer}
.caixa-mod input{width:20px;height:20px;accent-color:var(--verde)}
.junto{display:flex;gap:8px}
.junto input{flex:1;min-width:0}
.senha-inicial{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;font-weight:600;letter-spacing:.04em;user-select:all}
#aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 18px;border-radius:8px;background:var(--verde);color:var(--nevoa);font-size:14px;box-shadow:0 6px 24px rgba(15,61,46,.25);z-index:10}
#aviso.ruim{background:var(--erro)}
#aviso:empty{display:none}
@media (max-width:720px){.publico .marca{padding:32px 24px}.publico .marca h1{font-size:28px}.lateral .itens{flex-direction:row;flex-wrap:wrap}.lateral .grupo{width:100%;margin:8px 12px 2px}main.tela{padding:20px 16px}.topo{padding:12px 16px}}
</style>
</head>
<body>
<div id="app"><p class="vazio">Carregando…</p></div>
<div id="aviso" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.1"></script>
<script>document.write('<script src="'+window.CELEIRO_OFFICE_RAIZ+'config.js"><\/script>');</script>
<script>
(function(){
'use strict';

var cfg=window.CELEIRO_OFFICE_CONFIG||{};
var RAIZ=window.CELEIRO_OFFICE_RAIZ||'';
var configurado=!!(cfg.url&&cfg.anonKey&&!/COLE_AQUI/.test(String(cfg.url)+String(cfg.anonKey))&&window.supabase&&window.supabase.createClient);
var hashInicial=location.hash||'';
var sb=configurado?window.supabase.createClient(cfg.url,cfg.anonKey):null;
var app=document.getElementById('app');
var elAviso=document.getElementById('aviso');

var PERFIS={master:'Master',gerencial:'Gerencial',corp_master:'Corporativo master',corp_operador:'Corporativo operador'};
var INATIVIDADE_MS=15*60*1000;
var MAX_TENTATIVAS=5;
var E={acesso:null,modulos:[],recuperando:/type=recovery/.test(hashInicial),novoLogin:false,tentativas:0,relogio:null,avisoRelogio:null};

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(sel,raiz){return (raiz||document).querySelector(sel);}
function $$(sel,raiz){return Array.prototype.slice.call((raiz||document).querySelectorAll(sel));}
function aviso(msg,ruim){
  elAviso.textContent=msg||'';
  elAviso.className=ruim?'ruim':'';
  clearTimeout(E.avisoRelogio);
  if(msg){E.avisoRelogio=setTimeout(function(){elAviso.textContent='';},5000);}
}
function msgErro(e){
  var m=(e&&e.message)||String(e||'');
  if(/Invalid login credentials/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Invalid TOTP code|invalid.*code/i.test(m))return 'Código incorreto. Confira o aplicativo e tente de novo.';
  if(/rate limit|too many/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/Failed to fetch|NetworkError/i.test(m))return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
  if(/Email not confirmed/i.test(m))return 'Este e-mail ainda não foi confirmado.';
  if(/should be different/i.test(m))return 'A nova senha precisa ser diferente da atual.';
  return m||'Não foi possível concluir. Tente de novo.';
}
function evento(acao,modulo,detalhes){
  if(!sb)return;
  try{
    sb.rpc('registrar_evento',{p_acao:acao,p_modulo:modulo||'',p_detalhes:detalhes||null}).then(function(r){
      if(r&&r.error&&window.console)console.warn('Auditoria:',r.error.message);
    });
  }catch(err){}
}
function dataHora(iso){
  var d=new Date(iso);
  return {data:d.toLocaleDateString('pt-BR'),hora:d.toLocaleTimeString('pt-BR')};
}
function cnpjValido(v){
  var n=String(v||'').replace(/\D/g,'');
  if(n.length!==14||/^(\d)\1+$/.test(n))return false;
  function dv(base){var p=base.length-7,s=0;for(var i=0;i<base.length;i++){s+=Number(base[i])*p;p=p===2?9:p-1;}var r=s%11;return r<2?0:11-r;}
  return dv(n.slice(0,12))===Number(n[12])&&dv(n.slice(0,13))===Number(n[13]);
}
function formataCnpj(v){
  var n=String(v||'').replace(/\D/g,'');
  return n.length===14?n.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):String(v||'');
}
function ocupar(botao,sim){if(botao){botao.disabled=!!sim;}}

/* ---------- telas públicas ---------- */
function publico(html){
  app.innerHTML=
  '<div class="publico">'+
    '<section class="marca">'+
      '<img src="'+RAIZ+'assets/logo-negativa.png" alt="Celeiro Administradora">'+
      '<div><p class="olho">Celeiro Office</p>'+
      '<h1>Sistema de gestão da Celeiro Administradora</h1>'+
      '<ul><li>Acesso restrito a usuários convidados</li><li>Autenticação em dois fatores obrigatória</li><li>Todas as ações registradas em auditoria</li></ul></div>'+
      '<p class="rodape">'+esc(location.host||'office.celeiroadministradora.com.br')+'</p>'+
    '</section>'+
    '<main class="lado">'+html+'</main>'+
  '</div>';
}

function telaConfig(){
  publico('<div class="caixa"><h2>Falta ligar ao Supabase</h2>'+
    '<p class="apoio">Preencha o arquivo <strong>config.js</strong> com o endereço e a chave pública do projeto Supabase do backoffice. O passo a passo está no arquivo LEIA-ME.md.</p></div>');
}

function telaLogin(msg,bom){
  pararInatividade();
  E.acesso=null;E.tentativas=0;
  publico('<form class="caixa" id="f-login" novalidate>'+
    '<div><h2>Entrar</h2><p class="apoio">Use o e-mail e a senha do seu acesso. Em seguida pediremos o código do autenticador.</p></div>'+
    (msg?'<p class="'+(bom?'sucesso':'erro')+'" role="alert">'+esc(msg)+'</p>':'')+
    '<div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>'+
    '<div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>'+
    '<button class="botao" type="submit">Continuar</button>'+
    '<button class="link" type="button" id="b-esqueci">Esqueci minha senha</button>'+
    '<p class="nota">Não há cadastro aberto. O acesso é criado por um usuário Master ou pelo responsável da sua organização. Este acesso registra IP, data e hora.</p>'+
  '</form>');
  var f=$('#f-login');
  $('#b-esqueci').onclick=function(){telaEsqueci($('#email').value);};
  f.onsubmit=async function(ev){
    ev.preventDefault();
    var email=$('#email').value.trim(),senha=$('#senha').value,b=$('button[type=submit]',f);
    if(!email||!senha){telaLoginErro('Informe e-mail e senha.');return;}
    ocupar(b,true);
    var r=await sb.auth.signInWithPassword({email:email,password:senha});
    if(r.error){ocupar(b,false);telaLoginErro(msgErro(r.error));return;}
    E.novoLogin=true;
    evento('Informou e-mail e senha','Acesso');
    await aposSenha();
  };
  function telaLoginErro(m){
    var p=$('.erro',f)||$('.sucesso',f);
    if(!p){p=document.createElement('p');p.setAttribute('role','alert');f.insertBefore(p,f.children[1]);}
    p.className='erro';p.textContent=m;
  }
}

function telaEsqueci(email){
  publico('<form class="caixa" id="f-esqueci" novalidate>'+
    '<div><h2>Redefinir senha</h2><p class="apoio">Informe o e-mail do seu acesso. Se ele existir, enviaremos um link para criar uma nova senha.</p></div>'+
    '<div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" value="'+esc(email||'')+'" required></div>'+
    '<button class="botao" type="submit">Enviar link</button>'+
    '<button class="link" type="button" id="b-voltar">Voltar para o login</button>'+
  '</form>');
  $('#b-voltar').onclick=function(){telaLogin();};
  $('#f-esqueci').onsubmit=async function(ev){
    ev.preventDefault();
    var em=$('#email').value.trim(),b=$('button[type=submit]',this);
    if(!em)return;
    ocupar(b,true);
    var r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
    if(r.error){ocupar(b,false);aviso(msgErro(r.error),true);return;}
    telaLogin('Se o e-mail estiver cadastrado, o link de redefinição foi enviado.',true);
  };
}

async function aposSenha(){
  var n=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(n.error){telaLogin(msgErro(n.error));return;}
  if(n.data&&n.data.currentLevel==='aal2'){await entrar();return;}
  var f=await sb.auth.mfa.listFactors();
  if(f.error){telaLogin(msgErro(f.error));return;}
  var verificados=(f.data&&f.data.totp)||[];
  if(verificados.length){telaCodigo(verificados[0].id);}
  else{await telaCadastro(((f.data&&f.data.all)||[]).filter(function(x){return x.status!=='verified';}));}
}

function telaCodigo(factorId){
  publico('<form class="caixa" id="f-codigo" novalidate>'+
    '<div><h2>Código do Google Authenticator</h2><p class="apoio">Abra o aplicativo no seu celular e informe o código de 6 dígitos da conta Celeiro Office.</p></div>'+
    '<p class="erro oculto" role="alert"></p>'+
    '<div class="campo"><label for="codigo">Código de 6 dígitos</label><input id="codigo" class="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>'+
    '<button class="botao" type="submit">Verificar e entrar</button>'+
    '<button class="link" type="button" id="b-sair">Voltar para o login</button>'+
    '<p class="nota">Perdeu o celular ou o autenticador? A redefinição é feita por um usuário Master, e fica registrada.</p>'+
  '</form>');
  var f=$('#f-codigo');
  $('#codigo').focus();
  $('#b-sair').onclick=function(){sair(true);};
  f.onsubmit=async function(ev){
    ev.preventDefault();
    var c=$('#codigo').value.replace(/\D/g,''),b=$('button[type=submit]',f),p=$('.erro',f);
    if(c.length!==6){p.textContent='Digite os 6 dígitos.';p.classList.remove('oculto');return;}
    ocupar(b,true);
    var r=await sb.auth.mfa.challengeAndVerify({factorId:factorId,code:c});
    if(r.error){
      E.tentativas++;
      evento('Código do autenticador recusado','Acesso',{tentativa:E.tentativas});
      if(E.tentativas>=MAX_TENTATIVAS){
        await sb.auth.signOut();
        telaLogin('Acesso encerrado após '+MAX_TENTATIVAS+' códigos incorretos. Entre de novo.');
        return;
      }
      ocupar(b,false);$('#codigo').value='';$('#codigo').focus();
      p.textContent=msgErro(r.error);p.classList.remove('oculto');
      return;
    }
    E.tentativas=0;
    await entrar();
  };
}

async function telaCadastro(pendentes){
  publico('<div class="caixa"><p class="apoio">Preparando o cadastro do autenticador…</p></div>');
  for(var i=0;i<(pendentes||[]).length;i++){await sb.auth.mfa.unenroll({factorId:pendentes[i].id});}
  var r=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'Celeiro Office '+Date.now()});
  if(r.error){telaLogin(msgErro(r.error));return;}
  var id=r.data.id,qr=r.data.totp.qr_code,chave=r.data.totp.secret;
  publico('<form class="caixa larga" id="f-cadastro" novalidate>'+
    '<div><h2>Cadastre o Google Authenticator</h2><p class="apoio">O segundo fator é obrigatório para todos os perfis. Sem ele, nenhuma tela do sistema é liberada.</p></div>'+
    '<p class="erro oculto" role="alert"></p>'+
    '<div class="qr"><img src="'+esc(qr)+'" alt="QR code para o Google Authenticator">'+
      '<div class="campo" style="flex:1 1 220px"><p><strong>1.</strong> Instale o Google Authenticator no celular.</p><p><strong>2.</strong> Adicione uma conta e leia o QR code. Se preferir, digite a chave:</p><p class="chave">'+esc(chave)+'</p></div></div>'+
    '<div class="campo"><label for="codigo"><strong>3.</strong> Digite o código de 6 dígitos que o aplicativo mostra</label><input id="codigo" class="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>'+
    '<button class="botao" type="submit">Ativar e entrar</button>'+

  var f=$('#f-cadastro');

    ev.preventDefault();
    var a=$('#s1').value,b2=$('#s2').value,b=$('button[type=submit]',f),p=$('.erro',f);
    function falha(m){p.textContent=m;p.classList.remove('oculto');}

/* ---------- entrada no sistema ---------- */
async function entrar(){
  if(E.recuperando){telaNovaSenha();return;}
  var r=await sb.rpc('meu_acesso');
  if(r.error){telaBloqueio('Não foi possível carregar seu acesso',msgErro(r.error));return;}
  var a=r.data||{};
  if(a.situacao==='sem_2fa'){
    var n=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(n.data&&n.data.currentLevel==='aal2'){telaBloqueio('Sessão não reconhecida','Saia e entre de novo.');return;}
    await aposSenha();return;
  }
  if(a.situacao==='sem_cadastro'){
    evento('Entrou sem perfil vinculado','Acesso');
    telaBloqueio('Acesso ainda não liberado','Seu e-mail e o autenticador estão corretos, mas o acesso ainda não foi vinculado a um perfil. Peça a um usuário Master ou ao responsável da sua organização.');
    return;
  }
  if(a.situacao!=='ok'){
    evento('Tentou entrar com acesso inativo','Acesso');
    telaBloqueio('Acesso inativo','Este acesso está desativado. Fale com um usuário Master ou com o responsável da sua organização.');
    return;
  }
  E.acesso=a;
  evento(E.novoLogin?'Entrou no sistema com segundo fator':'Retomou a sessão','Acesso');
  E.novoLogin=false;
  var m=await sb.from('modulos').select('*').order('ordem');
  E.modulos=m.error?[]:(m.data||[]);
  montarCasca();
  iniciarInatividade();
  rota();
}

async function sair(silencioso){
  pararInatividade();
  if(E.acesso){
    try{await sb.rpc('registrar_evento',{p_acao:'Saiu do sistema',p_modulo:'Acesso',p_detalhes:null});}catch(err){}
  }
  E.acesso=null;
  await sb.auth.signOut();
  if(location.hash){history.replaceState(null,'',location.pathname+location.search);}
  telaLogin(silencioso?'':'Você saiu do sistema.',true);
}

function pararInatividade(){clearTimeout(E.relogio);E.relogio=null;}
function iniciarInatividade(){
  pararInatividade();
  E.relogio=setTimeout(async function(){
    if(!E.acesso)return;
    try{await sb.rpc('registrar_evento',{p_acao:'Sessão encerrada por inatividade',p_modulo:'Acesso',p_detalhes:null});}catch(err){}
    E.acesso=null;

}

function rota(){
  if(!E.acesso||!$('#tela'))return;
  var h=(location.hash||'#inicio').slice(1),r=ROTAS[h],mod=null;
  if(!r&&h.indexOf('m-')===0){
    mod=E.modulos.filter(function(m){return m.codigo===h.slice(2);})[0];
    if(mod&&temModulo(mod.codigo)&&mod.codigo!=='auditoria'){r={titulo:mod.nome,modulo:mod.nome,fn:function(){telaPrevista(mod);},pode:function(){return true;}};}
  }

  $('#trilha').textContent=(h==='inicio'||mod||r.semGrupo?'':'Administração / ')+r.titulo;

}

/* ---------- Usuários, níveis de permissão e módulos de cada pessoa ---------- */
function gerarSenha(){
  var abc='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789',v=new Uint32Array(14),s='';
  window.crypto.getRandomValues(v);
  for(var i=0;i<v.length;i++){s+=abc[v[i]%abc.length];}
  return s;
}
async function erroFuncao(e){
  var corpo=null;
  try{if(e&&e.context&&typeof e.context.json==='function'){corpo=await e.context.json();}}catch(err){}
  if(corpo&&corpo.erro)return corpo.erro;
  var st=e&&e.context&&e.context.status;
  if(st===404||/FunctionsFetchError|FunctionsRelayError/.test((e&&e.name)||'')||/Failed to send|not found/i.test((e&&e.message)||'')){
    return 'A função de criar usuários ainda não foi publicada no Supabase. Veja "Publicar a função criar-usuario" no LEIA-ME.';
  }
  if(st===401)return 'A função não aceitou a sua sessão. Saia, entre de novo e repita.';
  if(corpo&&corpo.message)return corpo.message;
  return msgErro(e);
}
function nomeModulo(c){
  var m=E.modulos.filter(function(x){return x.codigo===c;})[0];
  return m?m.nome:c;
}
function chipsModulos(lista,bloqueados){
  var h=(lista||[]).map(function(c){return '<span class="chipm">'+esc(nomeModulo(c))+'</span>';}).join('');

  return '<span class="chips">'+(h||'<span class="apoio">Nenhum módulo</span>')+'</span>';
}

  var usuarios=rs[0].data||[],orgs=rs[1].data||[],niveis=rs[2].data||[],perms=rs[3].data||[],mods=rs[4].data||[];

  /* módulos que um perfil recebe, com ou sem nível */

    'No primeiro acesso a pessoa cadastra o próprio Google Authenticator e pode trocar a senha em "Trocar senha".</div>':'';

  /* ----- níveis ----- */

    if(!nome){aviso('Dê um nome ao nível.',true);return;}

/* ---------- Trocar a própria senha ---------- */
function telaSenha(){
  tela('<div class="cabeca"><div><h1>Trocar senha</h1><p class="apoio">Use pelo menos 10 caracteres. A troca fica registrada na auditoria.</p></div></div>'+
    '<form class="painel" id="f-senha" novalidate style="max-width:460px">'+
    '<div class="campo"><label for="t-s1">Nova senha</label><input id="t-s1" type="password" autocomplete="new-password" required></div>'+
    '<div class="campo"><label for="t-s2">Repita a nova senha</label><input id="t-s2" type="password" autocomplete="new-password" required></div>'+
    '<button class="botao" type="submit">Salvar senha</button></form>');
  $('#f-senha').onsubmit=async function(ev){
    ev.preventDefault();
    var s1=$('#t-s1').value,s2=$('#t-s2').value,b=$('button[type=submit]',this);
    if(s1.length<10){aviso('A senha precisa ter pelo menos 10 caracteres.',true);return;}
    if(s1!==s2){aviso('As duas senhas não são iguais.',true);return;}
    ocupar(b,true);
    var r=await sb.auth.updateUser({password:s1});
    ocupar(b,false);
    if(r.error){aviso(msgErro(r.error),true);return;}
    evento('Trocou a própria senha','Acesso');
    $('#t-s1').value='';$('#t-s2').value='';
    aviso('Senha alterada.');
  };
}

/* ---------- Módulos e permissões ---------- */
async function telaModulos(orgEscolhida){
  carregando('Módulos e permissões');
  var rs=await Promise.all([sb.from('modulo_permissoes').select('*'),sb.from('organizacoes').select('*').order('nome')]);
  if(rs[0].error){falhaTela('Módulos e permissões',rs[0].error);return;}
  if(rs[1].error){falhaTela('Módulos e permissões',rs[1].error);return;}
  var perms=rs[0].data||[],orgs=rs[1].data||[],master=ehMaster(),a=E.acesso;
  var org=master?(orgEscolhida||''):a.organizacao_id;
  var colunas=master?(org?['corp_master','corp_operador']:['gerencial']):['corp_operador'];
  var mods=E.modulos.filter(function(m){return master||temModulo(m.codigo);});
  function ligado(perfil,modulo){
    return perms.some(function(p){return p.perfil===perfil&&p.modulo===modulo&&p.habilitado&&(perfil==='gerencial'?p.organizacao_id===null:p.organizacao_id===org);});
  }
  var linhas=mods.map(function(m){
    return '<tr><th scope="row">'+esc(m.nome)+'<span class="sub">'+(m.codigo==='auditoria'?'consulta ao histórico':'fase '+esc(m.fase))+'</span></th>'+
      colunas.map(function(p){
        return '<td>'+chaveSw(ligado(p,m.codigo),m.nome+' para '+PERFIS[p],'data-perfil="'+p+'" data-modulo="'+esc(m.codigo)+'"')+'</td>';
      }).join('')+'</tr>';
  }).join('');
  var seletor=master?'<div class="painel"><div class="grade"><div class="campo" style="max-width:420px"><label for="m-org">Para quem</label><select id="m-org">'+
      '<option value="">Equipe Celeiro (perfil Gerencial)</option>'+
      orgs.map(function(o){return '<option value="'+esc(o.id)+'"'+(o.id===org?' selected':'')+'>'+esc(o.nome)+(o.ativo?'':' (inativa)')+'</option>';}).join('')+
      '</select></div></div></div>':'';
  tela('<div class="cabeca"><div><h1>Módulos e permissões</h1><p class="apoio">'+
      (master?'Ligue ou desligue cada módulo por perfil. O perfil Master tem acesso a tudo. A mudança vale na hora.':'Defina o que os operadores da sua organização podem acessar, entre os módulos liberados para você.')+'</p></div></div>'+
    seletor+
    '<div class="rolagem"><table><thead><tr><th scope="col">Módulo</th>'+colunas.map(function(p){return '<th scope="col">'+esc(PERFIS[p])+'</th>';}).join('')+'</tr></thead><tbody>'+
      (linhas||'<tr><td colspan="'+(colunas.length+1)+'" class="vazio">Nenhum módulo liberado para a sua organização.</td></tr>')+'</tbody></table></div>'+
    '<p class="nota">O registro em auditoria não pode ser desligado: toda ação é gravada. O que se habilita aqui é a consulta ao histórico. Clientes corporativos veem apenas a própria organização.</p>');
  if(master){$('#m-org').onchange=function(){telaModulos(this.value);};}
  $$('.chave-sw').forEach(function(b){
    b.onclick=async function(){
      var novo=b.getAttribute('aria-checked')!=='true',perfil=b.getAttribute('data-perfil');
      ocupar(b,true);
      var r=await sb.rpc('definir_modulo',{p_org:perfil==='gerencial'?null:org,p_perfil:perfil,p_modulo:b.getAttribute('data-modulo'),p_habilitado:novo});
      ocupar(b,false);
      if(r.error){aviso(msgErro(r.error),true);return;}
      b.setAttribute('aria-checked',novo?'true':'false');
      aviso(novo?'Módulo habilitado.':'Módulo desabilitado.');
    };
  });
}

        modulosFiltro.map(function(m){return '<option'+(f.modulo===m?' selected':'')+'>'+esc(m)+'</option>';}).join('')+'</select></div>'+
      '<div class="campo"><label for="a-ip">IP</label><input id="a-ip" type="text" placeholder="Buscar por IP" value="'+esc(f.ip||'')+'"></div>'+
      '<button class="botao" type="submit">Filtrar</button></div></form>'+
    '<div id="aud-lista"><p class="apoio">Carregando…</p></div>'+
    '<p class="nota">O local mostra o país informado pela rede no momento do acesso. Cidade depende de um serviço de localização por IP, ainda não contratado. Mesmo com ele, o local é estimado pelo IP, não é a posição exata do equipamento. Ações feitas direto no painel do Supabase aparecem sem usuário.</p>');
  $('#f-aud').onsubmit=function(ev){
    ev.preventDefault();
    AUD.filtros={de:$('#a-de').value,ate:$('#a-ate').value,usuario:$('#a-usuario').value,modulo:$('#a-modulo').value,ip:$('#a-ip').value.trim()};
    evento('Filtrou a auditoria','Auditoria',AUD.filtros);
    buscaAuditoria();
  };
  $('#b-exportar').onclick=exportaAuditoria;
  buscaAuditoria();

async function buscaAuditoria(){
  var f=AUD.filtros,lista=$('#aud-lista');
  if(!lista)return;
  var q=sb.from('auditoria').select('*').order('ocorrido_em',{ascending:false}).limit(300);
  if(f.de)q=q.gte('ocorrido_em',new Date(f.de+'T00:00:00').toISOString());
  if(f.ate)q=q.lte('ocorrido_em',new Date(f.ate+'T23:59:59.999').toISOString());
  if(f.usuario)q=q.eq('user_id',f.usuario);
  if(f.modulo)q=q.eq('modulo',f.modulo);
  if(f.ip)q=q.ilike('ip','%'+f.ip.replace(/[%_,()]/g,'')+'%');
  var r=await q;
  if(!$('#aud-lista'))return;
  if(r.error){lista.innerHTML='<p class="erro" role="alert">'+esc(msgErro(r.error))+'</p>';return;}
  AUD.linhas=r.data||[];
  if(!AUD.linhas.length){lista.innerHTML='<div class="rolagem"><p class="vazio">Nenhum registro para este filtro.</p></div>';return;}
  var linhas=AUD.linhas.map(function(l){
    var d=dataHora(l.ocorrido_em),alerta=/recusad|inativ|sem perfil/i.test(l.acao);
    return '<tr'+(alerta?' class="alerta"':'')+'><td>'+esc(d.data)+'</td><td>'+esc(d.hora)+'</td>'+
      '<td>'+esc(l.usuario_nome||'—')+'<span class="sub">'+esc(l.usuario_email||(l.user_id?'':'direto no banco'))+'</span></td>'+
      '<td>'+esc(PERFIS[l.perfil]||l.perfil||'—')+'</td>'+
      '<td>'+esc(l.acao)+(l.tabela?'<span class="sub">'+esc(l.tabela)+(l.registro_id?' · '+esc(l.registro_id):'')+'</span>':'')+'</td>'+
      '<td>'+esc(l.modulo||'—')+'</td><td>'+esc(l.ip||'—')+'</td><td>'+esc(l.local||l.pais||'—')+'</td></tr>';
  }).join('');
  lista.innerHTML='<div class="rolagem"><table style="min-width:920px"><thead><tr><th scope="col">Data</th><th scope="col">Hora</th><th scope="col">Usuário</th><th scope="col">Perfil</th><th scope="col">Ação</th><th scope="col">Módulo</th><th scope="col">IP</th><th scope="col">Local</th></tr></thead><tbody>'+linhas+'</tbody></table></div>'+
    '<p class="apoio" style="font-size:13px;margin-top:10px">'+AUD.linhas.length+(AUD.linhas.length===300?' registros mais recentes (limite da tela; use os filtros para ver períodos anteriores).':' registros.')+'</p>';
}

function exportaAuditoria(){
  if(!AUD.linhas.length){aviso('Não há registros para exportar.',true);return;}
  function c(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
  var csv=['Data;Hora;Usuário;E-mail;Perfil;Ação;Módulo;Tabela;Registro;IP;País;Local;Navegador;Origem'];
  AUD.linhas.forEach(function(l){
    var d=dataHora(l.ocorrido_em);
    csv.push([d.data,d.hora,l.usuario_nome,l.usuario_email,PERFIS[l.perfil]||l.perfil,l.acao,l.modulo,l.tabela,l.registro_id,l.ip,l.pais,l.local,l.navegador,l.origem].map(c).join(';'));
  });
  var url=URL.createObjectURL(new Blob(['﻿'+csv.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  var a=document.createElement('a');
  a.href=url;a.download='celeiro-auditoria-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
  evento('Exportou a auditoria','Auditoria',{registros:AUD.linhas.length,filtros:AUD.filtros});
}

/* ---------- início ---------- */
async function iniciar(){
  if(!configurado){telaConfig();return;}
  sb.auth.onAuthStateChange(function(tipo){
    if(tipo==='PASSWORD_RECOVERY'){E.recuperando=true;}
    if(tipo==='SIGNED_OUT'&&E.acesso){
      setTimeout(function(){E.acesso=null;telaLogin('Sua sessão foi encerrada. Entre de novo.');},0);
    }
  });
  var s=await sb.auth.getSession();
  if(s.error||!s.data||!s.data.session){telaLogin();return;}
  await aposSenha();
}
iniciar();

})();
</script>
