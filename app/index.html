<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Celeiro V1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plano: app de uma tela em moldura de celular, conforme o Manual de Marca Celeiro ADM v1.0.
   Verde é a cor institucional; âmbar só como destaque (barra da marca, botões, realces),
   nunca em texto sobre fundo claro. Família única: Sora. */
:root{
  color-scheme: light;
  --fundo:#F4F6F3;        /* Névoa: fundo das telas */
  --superficie:#FFFFFF;   /* cartões e campos */
  --tinta:#0F3D2E;        /* Verde Celeiro: texto, marca, fundos institucionais */
  --apoio:#3F5F53;        /* Verde médio: texto secundário */
  --destaque:#E3A72F;     /* Âmbar Energia: ação principal e realces */
  --linha:#C9D2C8;        /* fios e bordas */
  --palco:#DFE4DD;        /* área fora do celular */
  --sobre-tinta:#F4F6F3;  /* texto sobre verde */
  --fonte-titulo:"Sora", "Helvetica Neue", Arial, sans-serif;
  --fonte-texto:"Sora", "Helvetica Neue", Arial, sans-serif;
  --raio:14px;
  --raio-p:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--palco);color:var(--tinta);font-family:var(--fonte-texto);font-size:14.5px;font-weight:400;line-height:1.5;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}

#aparelho{width:100%;height:100%;max-width:400px;max-height:860px;background:var(--fundo);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:480px) and (min-height:700px){
  #aparelho{height:calc(100% - 32px);border:1px solid var(--linha);border-radius:34px;box-shadow:0 20px 50px rgba(15,61,46,.18)}
}
#topo{flex:none;display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--linha);min-height:56px}
#topo h1{font-family:var(--fonte-titulo);font-size:17px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}

.icone-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none}
.icone-btn:hover{background:var(--superficie)}
#tela{flex:1;overflow-y:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:18px}
#abas{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--linha);padding:6px 6px 10px}
#abas button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:500;color:var(--apoio);border-radius:var(--raio-p)}
#abas button{position:relative}
#abas button[aria-current="page"]{color:var(--tinta);font-weight:600}
#abas button[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:50%;width:28px;height:3px;margin-left:-14px;background:var(--destaque)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

h2{font-family:var(--fonte-titulo);font-size:22px;font-weight:600;line-height:1.15;text-wrap:balance}
h3{font-family:var(--fonte-titulo);font-size:15px;font-weight:600;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-topo{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.link{font-weight:600;text-decoration:underline;text-decoration-color:var(--destaque);text-decoration-thickness:2px;text-underline-offset:3px;font-size:13px}
.apoio{color:var(--apoio);font-size:13px}
.rotulo{font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--apoio)}
.num{font-variant-numeric:tabular-nums}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:10px 16px;border-radius:var(--raio);font-weight:600;border:1.5px solid var(--tinta);text-align:center}
.btn.cheio{background:var(--destaque);border-color:var(--destaque);color:var(--tinta)}
.btn.claro{border-color:var(--linha)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.curto{width:auto;min-height:38px;padding:6px 14px;font-size:13px}
.pilha{display:flex;flex-direction:column;gap:10px}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.campo{display:flex;flex-direction:column;gap:5px}
.campo label{font-size:13px;font-weight:600}
.campo input,.campo textarea,.campo select{background:var(--superficie);border:1.5px solid var(--linha);border-radius:var(--raio-p);padding:12px;width:100%}
.campo input:focus,.campo textarea:focus,.campo select:focus{outline:none;border-color:var(--tinta);background:var(--fundo)}
.campo textarea{min-height:96px;resize:vertical}
.erro{font-size:13px;font-weight:600;border-left:3px solid var(--destaque);padding:6px 10px;background:var(--superficie)}
.divisor{display:flex;align-items:center;gap:10px;color:var(--apoio);font-size:12px}
.divisor::before,.divisor::after{content:"";flex:1;height:1px;background:var(--linha)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips.quebra{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1.5px solid var(--linha);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--sobre-tinta);border-color:var(--tinta)}
.selo{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border:1px solid var(--tinta);border-radius:99px;white-space:nowrap}
.selo.cheio{background:var(--tinta);color:var(--sobre-tinta)}

.capa{aspect-ratio:16/9;background:var(--tinta);color:var(--sobre-tinta);border-radius:var(--raio);display:grid;place-items:center;position:relative;overflow:hidden;width:100%}
.capa .play{width:52px;height:52px;border-radius:50%;border:2px solid var(--sobre-tinta);display:grid;place-items:center}
.capa .dur{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;background:var(--fundo);color:var(--tinta);padding:1px 6px;border-radius:4px}
.capa .txt{position:absolute;left:12px;bottom:10px;right:60px;font-size:12px;opacity:.8}
.capa video{width:100%;height:100%;background:#000}
.barra-play{position:absolute;left:0;bottom:0;height:4px;background:var(--sobre-tinta);width:0}
.capa.tocando .barra-play{animation:tocar 30s linear forwards}
@keyframes tocar{to{width:100%}}
@media (prefers-reduced-motion:reduce){.capa.tocando .barra-play{animation:none;width:35%}}

.item-video{display:grid;grid-template-columns:128px 1fr;gap:12px;text-align:left;align-items:start;width:100%}
.item-video .capa{border-radius:var(--raio-p)}
.item-video .capa .play{width:30px;height:30px;border-width:1.5px}
.item-video .capa .play svg{width:14px;height:14px}
.cartao{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.progresso{height:7px;background:var(--superficie);border-radius:99px;overflow:hidden;border:1px solid var(--linha)}
.progresso i{display:block;height:100%;background:var(--destaque)}
.lista{display:flex;flex-direction:column}
.linha{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--linha);text-align:left;width:100%}
.linha:last-child{border-bottom:0}
.linha .cresce{flex:1;min-width:0;overflow-wrap:anywhere}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--tinta);color:var(--sobre-tinta);display:grid;place-items:center;font-weight:600;font-size:20px;flex:none}
.texto-longo{white-space:pre-line;max-width:65ch}
.aviso{background:var(--superficie);border-left:3px solid var(--destaque);border-radius:var(--raio-p);padding:12px;font-size:13px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--linha);background:var(--superficie);border-radius:var(--raio-p);padding:3px}
.seg button{padding:9px 4px;border-radius:8px;font-size:12.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--tinta);color:var(--sobre-tinta)}
.centro{align-items:center;text-align:center}
.servicos{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);padding:0 14px}
.servicos .linha{padding:14px 0}
.servico-ic{width:42px;height:42px;border-radius:var(--raio-p);background:var(--tinta);color:var(--sobre-tinta);display:grid;place-items:center;flex:none}
.etapas{display:flex;flex-direction:column;gap:0}
.etapas li{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:8px 0;color:var(--apoio)}
.etapas li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--linha);margin-top:4px;flex:none}
.etapas li.feita{color:var(--tinta)}
.etapas li.feita::before{background:var(--tinta);border-color:var(--tinta)}
.etapas li.agora{color:var(--tinta);font-weight:600}
.etapas li.agora::before{background:var(--destaque);border-color:var(--destaque)}
.abertura{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
b{font-weight:600}
#topo,#abas{background:var(--superficie)}
#aparelho.verde{background:var(--tinta);color:var(--sobre-tinta)}
.verde .apoio{color:var(--linha)}
.verde .btn{border-color:var(--sobre-tinta)}
.verde .btn.cheio{border-color:var(--destaque)}
.verde .btn.claro{border-color:rgba(244,246,243,.35)}
.verde :focus-visible{outline-color:var(--sobre-tinta)}
.mono{display:block;height:100%;width:auto;fill:currentColor}
.mono .barra{fill:var(--destaque)}
/* Assinatura horizontal: 40 px de altura (mínimo do manual), fio entre monograma e nome */
.ass-h{display:flex;align-items:center;gap:12px;height:40px;color:var(--tinta)}
.ass-h .m{height:30px}
.ass-h .fio{width:1px;align-self:stretch;background:currentColor;opacity:.7}
.ass-h .nome{display:flex;flex-direction:column;gap:5px}
.ass-h .n1{font-size:15px;font-weight:500;letter-spacing:.34em;line-height:1}
.ass-h .n2,.ass-v .n2{font-size:6.5px;font-weight:400;letter-spacing:.72em;line-height:1;text-transform:uppercase;color:var(--apoio)}
/* Assinatura vertical: telas de abertura */
.ass-v{display:flex;flex-direction:column;align-items:center;gap:16px}
.ass-v .m{height:64px}
.ass-v .n1{font-size:24px;font-weight:500;letter-spacing:.34em;margin-right:-.34em;line-height:1}
.ass-v .n2{font-size:9px;margin-right:-.72em}
.sobre-verde{background:var(--tinta);color:var(--sobre-tinta);border-radius:var(--raio);padding:36px 16px}
.verde .n2,.sobre-verde .n2{color:var(--destaque)}
.avatar.realce{background:var(--destaque);color:var(--tinta)}
.interruptor{width:46px;height:26px;border-radius:99px;border:1.5px solid var(--tinta);position:relative;flex:none}
.interruptor::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--tinta);transition:transform .15s}
.interruptor[aria-checked="true"]{background:var(--tinta)}
.interruptor[aria-checked="true"]::after{background:var(--sobre-tinta);transform:translateX(20px)}
#aviso-flutuante{position:absolute;left:16px;right:16px;bottom:84px;background:var(--tinta);color:var(--sobre-tinta);padding:12px 14px;border-radius:var(--raio-p);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#aviso-flutuante.ver{opacity:1}
</style>
</head>
<body>
<div id="aparelho">
  <header id="topo"></header>
  <main id="tela"></main>
  <nav id="abas" aria-label="Navegação principal"></nav>
  <div id="aviso-flutuante" role="status"></div>
</div>

<script>
/* ---------- Ícones ---------- */
const P={
  inicio:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  video:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/>',
  assinar:'<path d="M4 20h16"/><path d="M6 16l9-9 3 3-9 9H6z"/>',
  perfil:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  voltar:'<path d="M15 5l-7 7 7 7"/>',
  seta:'<path d="M9 5l7 7-7 7"/>',
  play:'<path d="M8 5l11 7-11 7z" fill="currentColor"/>',
  mais:'<path d="M12 5v14M5 12h14"/>',
  ok:'<path d="M5 12l5 5 9-10"/>',
  lixo:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  cadeado:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  carro:'<path d="M5 13l1.6-4.6A2 2 0 018.5 7h7a2 2 0 011.9 1.4L19 13"/><rect x="3" y="13" width="18" height="5" rx="1.5"/><path d="M6.5 18v2M17.5 18v2"/>',
  raio:'<path d="M13 2L5 14h6l-1 8 9-12h-6z"/>',
  conta:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
  engrenagem:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const mono=()=>`<svg class="mono" viewBox="0 0 388.57 148.31" role="img" aria-label="Monograma CE"><path d="M175.01 0H74.15a74.15 74.15 0 0 0 0 148.31h81.28l28.48-35.6H74.15a38.56 38.56 0 0 1 0-77.12h72.38z"/><path d="M207.63 0h180.94l-28.48 35.59H243.23v77.12h145.34l-28.48 35.6H165.81l28.48-35.6h13.34z"/><path class="barra" d="M289.5 56.36h84.24l-28.48 35.59h-84.23z"/></svg>`;
const assH=()=>`<span class="ass-h" aria-label="Celeiro Administradora"><span class="m">${mono()}</span><span class="fio"></span><span class="nome"><span class="n1">CELEIRO</span><span class="n2">Administradora</span></span></span>`;
const assV=()=>`<div class="ass-v" aria-label="Celeiro Administradora"><span class="m">${mono()}</span><span class="n1">CELEIRO</span><span class="n2">Administradora</span></div>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=x=>Number(x).toLocaleString('pt-BR');
const hoje=()=>new Date().toLocaleDateString('pt-BR');
const nomeCurto=nm=>{const p=String(nm||'').trim().split(/\s+/);return p.length<2?(p[0]||'Assinante'):p[0]+' '+p[p.length-1][0].toUpperCase()+'.'};
function cpfOk(c){const d=String(c||'').replace(/\D/g,'');if(d.length!==11||/^(\d)\1{10}$/.test(d))return false;
  const dv=q=>{let s=0;for(let i=0;i<q;i++)s+=+d[i]*(q+1-i);const r=(s*10)%11;return r===10?0:r};
  return dv(9)===+d[9]&&dv(10)===+d[10]}

/* ---------- Dados de exemplo (substituir pela API do backoffice) ---------- */
const S={
  usuario:null, admin:false,
  pilha:[{v:'abertura'}],
  filtro:'Todos', busca:'',
  videos:[
    {id:1,titulo:'Conheça a Celeiro Administradora',desc:'Apresentação institucional: gestão e administração de grandes estruturas empresariais, energia, incorporação, estruturação financeira e cobranças.',cat:'Institucional',dur:'3:40',data:'10/11/2026',origem:'upload',publico:true},
    {id:2,titulo:'Como funciona a comercialização de energia',desc:'Entenda como a energia é contratada, o que muda na fatura e de onde vem a economia.',cat:'Energia',dur:'8:15',data:'05/11/2026',origem:'link',url:'https://www.youtube.com/',publico:true},
    {id:3,titulo:'Unidades geradoras: da obra à operação',desc:'As etapas de construção de uma unidade geradora e como acompanhar cada fase.',cat:'Energia',dur:'12:02',data:'28/10/2026',origem:'link',url:'https://www.youtube.com/',publico:false},
    {id:4,titulo:'Estruturação financeira de projetos',desc:'Financiamento e captação de recursos: como uma operação é montada do início ao fim.',cat:'Financeiro',dur:'9:48',data:'20/10/2026',origem:'upload',publico:false},
    {id:5,titulo:'Gestão de ativos imobiliários',desc:'Incorporação, construção e gestão: o papel da administradora em cada etapa.',cat:'Imobiliário',dur:'6:30',data:'12/10/2026',origem:'upload',publico:false}
  ],
  peticoes:[
    {id:1,titulo:'Usina solar comunitária no bairro',resumo:'Pedido de instalação de uma unidade geradora compartilhada para os moradores.',texto:'Nós, abaixo assinados, solicitamos a instalação de uma unidade geradora solar compartilhada, com rateio da energia entre os moradores cadastrados.\n\nA medida reduz o valor da fatura de energia das famílias participantes e aproveita a área disponível no bairro.',meta:1500,base:1042,prazo:'15/12/2026',sig:[{nome:'Marina Lopes',data:'11/11/2026'},{nome:'Carlos Antunes',data:'11/11/2026'},{nome:'Rita Okada',data:'10/11/2026'}]},
    {id:2,titulo:'Adesão do condomínio à compra coletiva de energia',resumo:'Autorização dos condôminos para contratar energia em conjunto.',texto:'Nós, condôminos abaixo assinados, autorizamos a administração a contratar energia de forma coletiva em nome do condomínio, nas condições apresentadas em assembleia.',meta:400,base:318,prazo:'30/11/2026',sig:[{nome:'João Pedro Sá',data:'09/11/2026'},{nome:'Helena Dias',data:'08/11/2026'}]},
    {id:3,titulo:'Iluminação eficiente nas áreas comuns',resumo:'Troca das luminárias antigas por modelos de baixo consumo.',texto:'Nós, abaixo assinados, pedimos a substituição das luminárias das áreas comuns por modelos de baixo consumo, com acompanhamento da economia obtida.',meta:250,base:87,prazo:'20/01/2027',sig:[{nome:'Bruno Teles',data:'07/11/2026'}]}
  ],
  minhas:{} // id da petição -> {protocolo,data}
};
const total=p=>p.base+p.sig.length-S.peticoesBase[p.id];
/* ---------- Módulos do app ----------
   Cada menu é um módulo que o administrador liga ou desliga.
   No app publicado, a lista vem do Office (função app_config) e vale para todos os aparelhos. */
const MODS=[
  {c:'videos',nome:'Vídeos',desc:'Área de vídeos e streaming'},
  {c:'assinaturas',nome:'Abaixo-assinados',desc:'Coleta de assinaturas com CPF e senha'},
  {c:'veicular',nome:'Aquisição Veicular',desc:'Pedidos de cotação veicular'},
  {c:'energia',nome:'Energia com Desconto',desc:'Pedidos de migração de energia'},
  {c:'conta',nome:'Conta digital',desc:'Solicitações de abertura de conta'}
];
S.modulos={videos:true,assinaturas:true,veicular:true,energia:true,conta:true};
const on=m=>!!S.modulos[m];
const MOD_DA_TELA={videos:'videos',video:'videos',peticoes:'assinaturas',peticao:'assinaturas',assinatura:'assinaturas',minhas:'assinaturas',veicular:'veicular',energia:'energia',conta:'conta'};

/* ---------- Integração com o Celeiro Office ----------
   Tudo o que o app informa ao backoffice (office.celeiroadministradora.com.br) sai por aqui.
   Destino: função app_registrar do banco do Office (arquivo office/supabase-app.sql).
   O que não for entregue fica na fila e é reenviado. */
const Office={
  destino:'office.celeiroadministradora.com.br',
  url:'https://wvvounloqtucagerizct.supabase.co/rest/v1/rpc/app_registrar',
  chave:'sb_publishable_ZSW04enHBahN-I8wfpkJfw_4z-HBuG3', // chave pública do Office; nunca usar a secreta no app
  teste:true, // protótipo: os envios chegam marcados como teste. Trocar para false no app publicado.
  TIPOS:{instalacao:'Instalação do app',lead:'Lead',conta_digital:'Abertura de conta',cotacao_veicular:'Cotação veicular',migracao_energia:'Migração de energia'},
  fila:[],
  _id:null,
  dispositivo(){
    if(this._id)return this._id;
    try{this._id=localStorage.getItem('celeiro-dispositivo')}catch(_){}
    if(!this._id){this._id='d-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);try{localStorage.setItem('celeiro-dispositivo',this._id)}catch(_){}}
    return this._id;
  },
  registrar(tipo,dados){
    const e={tipo,dados:{...dados,teste:this.teste},data:hoje(),status:'na fila'};
    this.fila.unshift(e);this.enviar(e);return e;
  },
  async enviar(e){
    try{
      const r=await fetch(this.url,{method:'POST',headers:{apikey:this.chave,Authorization:'Bearer '+this.chave,'Content-Type':'application/json'},
        body:JSON.stringify({p_tipo:e.tipo,p_dispositivo:this.dispositivo(),p_dados:e.dados})});
      e.status=r.ok?'enviado':'na fila';
    }catch(_){e.status='na fila'}
    if(atual().v==='admin'&&atual().seg==='office')desenhar();
  },
  async reenviar(){for(const e of this.fila.filter(x=>x.status!=='enviado'))await this.enviar(e)},
  instalacao(){
    let ja=false;try{ja=localStorage.getItem('celeiro-instalado')==='1'}catch(_){}
    if(ja)return;
    this.registrar('instalacao',{plataforma:'web-prototipo',versao:'1.0'});
    try{localStorage.setItem('celeiro-instalado','1')}catch(_){}
  }
};

/* ---------- Desenho ---------- */
function desenhar(){
  if(MOD_DA_TELA[atual().v]&&!on(MOD_DA_TELA[atual().v]))S.pilha=[{v:'inicio'}];
  const a=atual(),t=T[a.v](),raiz=RAIZ.includes(a.v);
  document.getElementById('aparelho').classList.toggle('verde',!!t.verde);
  const topo=document.getElementById('topo'),abas=document.getElementById('abas');
  topo.style.display=t.semTopo?'none':'';
  topo.innerHTML=t.marca?`${assH()}<span style="flex:1"></span>${S.usuario?'':`<button class="btn curto" data-a="ir" data-v="login">Entrar</button>`}`
    :`${raiz||t.semVoltar?'':`<button class="icone-btn" data-a="voltar" aria-label="Voltar">${ic('voltar')}</button>`}<h1>${esc(t.titulo||'')}</h1>`;
  const tela=document.getElementById('tela');tela.innerHTML=t.html;tela.scrollTop=0;
  abas.style.display=raiz?'':'none';
  const itensAba=[['inicio','Início','inicio'],['videos','Vídeos','video','videos'],['peticoes','Assinaturas','assinar','assinaturas'],['perfil','Perfil','perfil']].filter(x=>!x[3]||on(x[3]));
  abas.style.gridTemplateColumns='repeat('+itensAba.length+',1fr)';
  abas.innerHTML=itensAba
    .map(([v,r,i])=>`<button data-a="aba" data-v="${v}" ${a.v===v?'aria-current="page"':''}>${ic(i)}${r}</button>`).join('');
}
function entrar(u){
  S.usuario=u;const d=S.depois;S.depois=null;
  S.pilha=[{v:'inicio'}];
  if(typeof d==='number'){S.pilha.push({v:'peticao',id:d},{v:'assinatura',id:d,etapa:1})}else if(d){S.pilha.push(d)}
  desenhar();avisar('Você entrou como '+u.nome.split(' ')[0]);
}
const val=id=>(document.getElementById(id)?.value||'').trim();
const falhar=m=>{S.erro=m;const f={};document.querySelectorAll('#tela input,#tela textarea,#tela select').forEach(e=>{if(e.id&&e.type!=='file')f[e.id]=e.type==='checkbox'?e.checked:e.value});desenhar();for(const k in f){const e=document.getElementById(k);if(!e)continue;if(e.type==='checkbox')e.checked=f[k];else e.value=f[k]}document.querySelector('.erro')?.scrollIntoView({block:'center'})};
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

/* ---------- Ações ---------- */
const A={
  ir:d=>ir(d.v,d.id?{id:+d.id}:{}), aba:d=>aba(d.v), voltar, trocar:d=>trocar(d.v),
  avisar:d=>avisar(d.m),
  social:d=>{const u={nome:'Paulo Exemplo',email:'paulo@exemplo.com.br',tel:'',metodo:d.m};Office.registrar('lead',{nome:u.nome,email:u.email,telefone:'',metodo:d.m});entrar(u)},
  filtro:d=>{S.filtro=d.c;desenhar()},
  'abrir-video':d=>ir('video',{id:+d.id}),
  'abrir-peticao':d=>ir('peticao',{id:+d.id}),
  tocar:(d,el)=>{el.classList.toggle('tocando');el.querySelector('.txt').textContent=el.classList.contains('tocando')?'Reproduzindo (simulação)':'Pausado'},
  assinar:d=>{if(!S.usuario){S.depois=+d.id;ir('login',{motivo:'Entre na sua conta para assinar este abaixo-assinado.'})}else ir('assinatura',{id:+d.id,etapa:1})},
  'alternar-admin':()=>{S.admin=!S.admin;desenhar();avisar(S.admin?'Perfil administrador ativado':'Perfil administrador desativado')},
  sair:()=>{S.usuario=null;S.admin=false;S.minhas={};S.conta=null;S.pilha=[{v:'abertura'}];desenhar()},
  'abrir-conta':()=>{if(!S.usuario){S.depois={v:'conta'};ir('login',{motivo:'Entre na sua conta para abrir a conta digital.'})}else ir('conta')},
  'tipo-conta':d=>trocar('conta',{tipo:d.t}),
  'atualizar-conta':async()=>{const r=await ContaDigital.consultarStatus(S.conta.protocolo);S.conta.status=r.status;desenhar();avisar('Status: '+ContaDigital.STATUS[r.status])},
  'alternar-modulo':d=>{S.modulos[d.m]=!S.modulos[d.m];desenhar();avisar(MODS.find(m=>m.c===d.m).nome+(S.modulos[d.m]?' habilitado':' desabilitado'))},
  'reenviar-office':async()=>{await Office.reenviar();desenhar();avisar(Office.fila.some(e=>e.status!=='enviado')?'Sem conexão com o Office. Os envios continuam na fila.':'Fila enviada ao Office')},
  seg:d=>trocar('admin',{seg:d.s}),
  origem:d=>trocar('novoVideo',{origem:d.o}),
  'excluir-video':d=>{S.videos=S.videos.filter(v=>v.id!=d.id);desenhar();avisar('Vídeo excluído')},
  encerrar:d=>{S.peticoes=S.peticoes.filter(p=>p.id!=d.id);S.pilha=[{v:'perfil'},{v:'admin',seg:'peticoes'}];desenhar();avisar('Abaixo-assinado encerrado')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset,el)});
document.addEventListener('input',e=>{if(e.target.id==='busca'){S.busca=e.target.value;const p=e.target.selectionStart;desenhar();const b=document.getElementById('busca');b.focus();b.setSelectionRange(p,p)}});

const F={
  login(){const em=val('l-email'),s=val('l-senha');
    if(!emailOk(em))return falhar('Digite um e-mail válido, como voce@exemplo.com.br.');
    if(!s)return falhar('Digite a sua senha.');
    entrar({nome:em.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),email:em,tel:'',metodo:'e-mail e senha'})},
  cadastro(){const nm=val('c-nome'),em=val('c-email'),s=val('c-senha');
    if(nm.length<3)return falhar('Digite o seu nome completo.');
    if(!emailOk(em))return falhar('Digite um e-mail válido, como voce@exemplo.com.br.');
    if(val('c-tel').replace(/\D/g,'').length<10)return falhar('Digite o celular com DDD.');
    if(s.length<8)return falhar('A senha precisa ter pelo menos 8 caracteres.');
    if(s!==val('c-senha2'))return falhar('As duas senhas não são iguais. Digite novamente.');
    if(!document.getElementById('c-termos').checked)return falhar('Aceite os Termos de Uso para criar a conta.');
    Office.registrar('lead',{nome:nm,email:em,telefone:val('c-tel'),metodo:'e-mail e senha'});
    entrar({nome:nm,email:em,tel:val('c-tel'),metodo:'e-mail e senha'})},
  veicular(){const nm=val('s-nome'),tel=val('s-tel');
    if(nm.length<3)return falhar('Digite o seu nome completo.');
    if(tel.replace(/\D/g,'').length<10)return falhar('Digite o celular com DDD.');
    if(!val('s-valor'))return falhar('Informe o valor aproximado do veículo.');
    if(!val('s-cidade'))return falhar('Informe a cidade e a UF.');
    S.pedidos.unshift({servico:'Aquisição Veicular',nome:nm,tel,detalhe:val('s-veic')+' '+val('s-cond').toLowerCase()+' · R$ '+val('s-valor')+' · '+val('s-cidade'),data:hoje()});
    Office.registrar('cotacao_veicular',{nome:nm,telefone:tel,veiculo:val('s-veic'),condicao:val('s-cond'),valor:val('s-valor'),cidade:val('s-cidade')});
    trocar('pedidoOk',{servico:'Aquisição Veicular'})},
  energia(){const nm=val('s-nome'),tel=val('s-tel'),arq=document.getElementById('s-fatura')?.files?.[0];
    if(nm.length<3)return falhar('Digite o nome completo ou a razão social.');
    if(tel.replace(/\D/g,'').length<10)return falhar('Digite o celular com DDD.');
    if(!val('s-dist'))return falhar('Informe a distribuidora que aparece na fatura.');
    if(!val('s-valor'))return falhar('Informe o valor médio da fatura.');
    S.pedidos.unshift({servico:'Energia com Desconto',nome:nm,tel,detalhe:val('s-unid')+' · '+val('s-dist')+' · R$ '+val('s-valor')+'/mês'+(arq?' · fatura anexada':''),data:hoje()});
    Office.registrar('migracao_energia',{nome:nm,telefone:tel,unidade:val('s-unid'),distribuidora:val('s-dist'),valor_fatura:val('s-valor'),fatura_anexada:!!arq});
    trocar('pedidoOk',{servico:'Energia com Desconto'})},
  async conta(){const t=atual().tipo||'PF',doc=val('k-doc'),dg=doc.replace(/\D/g,''),nm=val('k-nome');
    if(dg.length!==(t==='PF'?11:14))return falhar(t==='PF'?'Digite o CPF com 11 números.':'Digite o CNPJ com 14 números.');
    if(nm.length<3)return falhar(t==='PF'?'Digite o seu nome completo.':'Digite a razão social.');
    if(t==='PF'&&!val('k-nasc'))return falhar('Informe a data de nascimento.');
    if(t==='PJ'&&val('k-resp').length<3)return falhar('Informe o nome do responsável legal.');
    if(val('k-tel').replace(/\D/g,'').length<10)return falhar('Digite o celular com DDD.');
    if(!emailOk(val('k-email')))return falhar('Digite um e-mail válido.');
    if(!document.getElementById('k-ok').checked)return falhar('Marque a autorização para enviar os dados à instituição parceira.');
    const dados={tipo:t,documento:doc,nome:nm,nascimento:val('k-nasc'),responsavel:val('k-resp'),celular:val('k-tel'),email:val('k-email'),consentimento:true};
    const r=await ContaDigital.abrirProposta(dados);
    Office.registrar('conta_digital',{nome:nm,telefone:dados.celular,email:dados.email,documento:doc,tipo_pessoa:t,nascimento:dados.nascimento,responsavel:dados.responsavel,protocolo:r.protocolo});
    S.conta={...dados,...r};trocar('conta');avisar('Proposta enviada para análise')},
  assinar(){const p=S.peticoes.find(x=>x.id==atual().id),cpf=val('a-cpf'),dg=cpf.replace(/\D/g,''),comSenha=S.usuario.metodo==='e-mail e senha';
    if(!cpfOk(cpf))return falhar('CPF inválido. Confira os números.');
    if(comSenha&&!document.getElementById('a-senha').value)return falhar('Digite a sua senha para confirmar.');
    if(p.sig.some(x=>x.cpf===dg))return falhar('Este CPF já assinou este abaixo-assinado.');
    // No app publicado, este registro é feito pela função "assinar" do banco (supabase-cliente.sql), que grava também o IP.
    const protocolo='CEL-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,10).toUpperCase().padEnd(8,'0');
    S.minhas[p.id]={protocolo,data:hoje()};
    p.sig.unshift({nome:S.usuario.nome,cpf:dg,protocolo,data:hoje()});
    trocar('assinatura',{id:p.id,etapa:3})},
  dados(){const nm=val('d-nome'),em=val('d-email');
    if(nm.length<3)return falhar('Digite o seu nome completo.');
    if(!emailOk(em))return falhar('Digite um e-mail válido.');
    Object.assign(S.usuario,{nome:nm,email:em,tel:val('d-tel')});voltar();avisar('Dados salvos')},
  video(){const o=atual().origem||'upload',ti=val('v-titulo'),arq=document.getElementById('v-arq')?.files?.[0],url=val('v-url');
    if(o==='upload'&&!arq)return falhar('Escolha o arquivo de vídeo.');
    if(o==='link'&&!/^https?:\/\/.+\..+/.test(url))return falhar('Cole o link completo, começando com https://');
    if(!ti)return falhar('Dê um título ao vídeo.');
    if(!val('v-desc'))return falhar('Escreva a descrição do vídeo.');
    S.videos.unshift({id:Date.now(),titulo:ti,desc:val('v-desc'),cat:val('v-cat'),dur:'novo',data:hoje(),origem:o,url,publico:val('v-vis')==='1',blob:arq?URL.createObjectURL(arq):null});
    S.pilha=[{v:'perfil'},{v:'admin',seg:'videos'}];desenhar();avisar('Vídeo publicado')},
  peticao(){const ti=val('p-titulo'),meta=+val('p-meta'),pr=val('p-prazo');
    if(!ti)return falhar('Dê um título ao abaixo-assinado.');
    if(!val('p-texto'))return falhar('Escreva o texto que as pessoas vão assinar.');
    if(!(meta>0))return falhar('Informe a meta de assinaturas.');
    if(!pr)return falhar('Escolha a data de encerramento.');
    const id=Date.now();S.peticoesBase[id]=0;
    S.peticoes.unshift({id,titulo:ti,resumo:val('p-resumo')||ti,texto:val('p-texto'),meta,base:0,prazo:pr.split('-').reverse().join('/'),sig:[]});
    S.pilha=[{v:'perfil'},{v:'admin',seg:'peticoes'}];desenhar();avisar('Abaixo-assinado aberto')}
};
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;if(F[f])F[f]()});

desenhar();
Office.instalacao();
</script>
